<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>Kanban decisions PoC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --page: #d4d4d8;
      --bg: #ffffff;
      --surface: #d4d4d8;
      --tone-1: #f4f4f5;
      --tone-2: #e4e4e7;
      --tone-3: #c4c4c8;
      --text: #09090b;
      --subtle: #3f3f46;
      --muted: #71717a;
      --faint: #a1a1aa;
      --link: #27272a;
      --accent: #18181b;
      --hover-fill: rgba(0, 0, 0, 0.05);
      --focus-ring: rgba(9, 9, 11, 0.12);
      --card-text-x: 0.85rem;
      --answer-indent: 0.65rem;
      --qa-py: 0.55rem;
      --qa-join-py: 0.35rem;
      --question-bg: #ffad9f;
      --question-text: #09090b;
      --answer-bg: #afe9b9;
      --answer-card-bg: #c8f5d0;
      --answer-text: #09090b;
      --answer-tentative-bg: #fef3c7;
      --answer-tentative-text: #09090b;
      --app-header-h: 3.25rem;
      --issue-ref-panel-w: min(32rem, 44vw);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 500;
      background: var(--page);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }
    .app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .app-body {
      display: flex;
      flex: 1 1 auto;
      align-items: stretch;
      min-height: 0;
      width: 100%;
    }
    .app-body > main {
      flex: 1 1 auto;
      min-width: 0;
    }
    body.issue-ref-panel-open main {
      margin-right: var(--issue-ref-panel-w);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      flex-shrink: 0;
      min-height: var(--app-header-h);
      padding: 0.875rem 1.5rem;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border-bottom: 1px solid var(--tone-2);
    }
    header h1 { margin: 0; font-size: 1rem; font-weight: 600; letter-spacing: -0.02em; }
    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .view-tabs {
      display: flex;
      padding: 3px;
      background: var(--tone-2);
      border-radius: 8px;
      gap: 2px;
    }
    .view-tab {
      font: inherit;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.35rem 0.75rem;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .view-tab.active {
      background: var(--bg);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }
    .dates-toggle {
      margin-left: 0.25rem;
      border-radius: 8px;
      background: var(--tone-2);
    }
    .dates-toggle[aria-pressed="true"] {
      background: var(--bg);
      color: var(--text);
    }
    .badge-proto {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    main { padding: 1.25rem 1.5rem 2.5rem; margin: 0; max-width: none; }
    main:has(#app.board) {
      max-width: 1200px;
      margin: 0 auto;
    }
    .main-layout {
      width: fit-content;
      max-width: 100%;
    }
    .main-layout:has(#app:not(.board)) {
      margin-left: 0;
      margin-right: 0;
    }
    .main-layout > #app {
      flex: 1 1 auto;
      min-width: 0;
    }
    .main-layout > #app:not(.board) {
      flex: 0 0 500px;
      width: 500px;
      max-width: 100%;
    }
    @media (max-width: 840px) {
      .app-body {
        flex-direction: column;
      }
      .main-layout:has(#app:not(.board)) {
        width: 100%;
      }
      .main-layout > #app:not(.board) {
        flex: 1 1 auto;
        width: 100%;
      }
      body.issue-ref-panel-open main {
        margin-right: 0;
        margin-bottom: min(50vh, 24rem);
      }
      .issue-ref-panel,
      .ref-link-picker-panel {
        top: auto;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: min(50vh, 24rem);
        border-left: none;
        border-top: 1px solid var(--tone-2);
      }
    }
    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      align-items: start;
    }
    @media (max-width: 720px) { .board { grid-template-columns: 1fr; } }
    .column {
      background: var(--surface);
      border-radius: 12px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
    }
    .column-header {
      padding: 0.875rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .column-header .dot {
      width: 8px; height: 8px; border-radius: 50%; margin-right: 0.5rem;
    }
    .column-header .title-row { display: flex; align-items: center; }
    .column-header.needs .dot { background: var(--text); }
    .column-header.answered .dot { background: var(--faint); }
    .count {
      font-weight: 500;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .column-body {
      padding: 0 0 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      flex: 1;
    }
    .card {
      border-radius: 10px;
      padding: 0;
      position: relative;
      overflow: hidden;
      background: var(--bg);
      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.07),
        0 4px 14px rgba(0, 0, 0, 0.08);
    }
    .card.card-complete {
      background: var(--answer-card-bg);
      color: var(--answer-text);
    }
    .card.card-complete .timeline-step {
      background: transparent;
    }
    .card.card-complete .problem,
    .card.card-complete .timeline-step.answered .problem,
    .card.card-complete .answer-block:not(.empty) {
      background: var(--answer-bg);
      color: var(--answer-text);
    }
    .card.card-complete .btn-delete {
      background: var(--answer-card-bg);
    }
    .timeline-step.answered .problem {
      background: var(--answer-bg);
      color: var(--answer-text);
    }
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .timeline-step {
      min-width: 0;
      overflow: hidden;
      border-radius: 0;
      background: transparent;
    }
    .timeline-step .answer-block {
      margin-top: 0;
      border: none;
      border-radius: 0;
    }
    .timeline-step .answer-block.empty {
      display: none;
      border: none;
      background: var(--tone-1);
    }
    .timeline-step:hover .answer-block.empty,
    .timeline-step:focus-within .answer-block.empty {
      display: block;
    }
    .card-top {
      min-height: 1.5rem;
    }
    .card-main { min-width: 0; }
    .btn-delete {
      position: absolute;
      top: 0.35rem;
      right: var(--card-text-x);
      z-index: 1;
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 6px;
      background: var(--bg);
      color: var(--muted);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s, color 0.15s;
    }
    .card:hover .btn-delete { opacity: 1; }
    .btn-delete:hover { background: var(--hover-fill); color: var(--text); }
    .editable {
      cursor: text;
      border-radius: 4px;
      padding: 2px 4px;
      margin: -2px -4px;
      line-height: 1.45;
    }
    .card .editable {
      margin-left: 0;
      margin-right: 0;
      border-radius: 0;
    }
    .card .problem,
    .card .answer-block {
      border-radius: 0;
    }
    .problem.editable {
      margin: 0;
      padding: var(--qa-py) var(--card-text-x);
      padding-bottom: var(--qa-join-py);
    }
    .answer-block.editable {
      margin: 0;
      padding: var(--qa-join-py) var(--card-text-x) var(--qa-py);
      padding-left: calc(var(--card-text-x) + var(--answer-indent));
    }
    .answer-text.editable {
      display: block;
      padding: 0;
      margin: 0;
    }
    .editable:hover { background: var(--hover-fill); }
    .problem.editable:hover {
      background: var(--question-bg);
    }
    .timeline-step.answered .problem.editable:hover,
    .card.card-complete .problem.editable:hover {
      background: var(--answer-bg);
    }
    .answer-block:not(.empty).editable:hover,
    .answer-block:not(.empty) .answer-text.editable:hover {
      background: transparent;
    }
    .answer-block:not(.empty):has(.answer-text.editable:hover) {
      background: var(--answer-bg);
    }
    .answer-block.answer-marked:not(.empty):has(.answer-text.editable:hover),
    .answer-block.answer-marked:not(.empty).editable:hover {
      background: var(--answer-tentative-bg);
    }
    .editable.empty { color: var(--muted); font-style: italic; }
    .problem {
      font-weight: 400;
      font-size: 0.9rem;
      padding: var(--qa-py) var(--card-text-x) var(--qa-join-py);
      background: var(--question-bg);
      color: var(--question-text);
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .timeline-step:first-child .problem {
      font-weight: 600;
      font-size: 0.95rem;
      padding-top: var(--qa-py);
      padding-bottom: var(--qa-join-py);
    }
    .timeline-step:last-child:not(:has(.answer-block:not(.empty))) .problem {
      padding-bottom: var(--qa-py);
    }
    .answer-block {
      font-size: 0.85rem;
      padding: var(--qa-join-py) var(--card-text-x) var(--qa-py);
      padding-left: calc(var(--card-text-x) + var(--answer-indent));
      font-weight: 400;
      line-height: 1.45;
    }
    .answer-block:not(.empty) {
      background: var(--answer-bg);
      color: var(--answer-text);
    }
    .answer-block.empty {
      color: var(--muted);
      font-style: italic;
      background: var(--tone-1);
    }
    .answer-inner {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--card-text-x);
    }
    .answer-text {
      flex: 1;
      min-width: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .answer-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.25rem;
      flex-shrink: 0;
    }
    .answer-mark-btn {
      font: inherit;
      font-size: 1rem;
      line-height: 1;
      width: 1.5rem;
      height: 1.5rem;
      padding: 0;
      border: none;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.08);
      color: inherit;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s;
    }
    .answer-block:hover .answer-mark-btn,
    .answer-block:focus-within .answer-mark-btn,
    .answer-mark-btn[aria-pressed="true"] {
      opacity: 1;
    }
    .answer-mark-btn:hover { background: rgba(0, 0, 0, 0.12); }
    .answer-mark-btn[aria-pressed="true"] {
      background: rgba(0, 0, 0, 0.14);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
    }
    .answer-mark-icon {
      display: block;
      font-size: 1.35rem;
      line-height: 1.5rem;
      text-align: center;
    }
    .answer-block.answer-marked {
      background: var(--answer-tentative-bg);
      color: var(--answer-tentative-text);
    }
    .answer-block.answer-marked .answer-mark-btn {
      background: rgba(0, 0, 0, 0.1);
    }
    .decision-date {
      display: none;
      flex-shrink: 0;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      line-height: 1.45;
      white-space: nowrap;
    }
    body.show-dates .decision-date {
      display: block;
    }
    textarea.inline-input,
    textarea.followup-input,
    .composer textarea {
      resize: none;
      overflow: hidden;
      field-sizing: content;
    }
    .inline-input {
      width: 100%;
      border: none;
      font: inherit;
      line-height: 1.45;
      color: inherit;
      background: transparent;
      outline: none;
      box-shadow: none;
    }
    .inline-input:focus {
      box-shadow: inset 0 0 0 2px var(--focus-ring);
    }
    .inline-input.single {
      min-height: unset;
      resize: none;
      padding: 0.2rem 0.35rem;
      border-radius: 6px;
    }
    .inline-input-problem {
      display: block;
      margin: 0;
      padding: var(--qa-py) var(--card-text-x) var(--qa-join-py);
      font-size: 0.9rem;
      font-weight: 400;
      background: var(--question-bg);
      color: var(--question-text);
      border-radius: 0;
      min-height: unset;
    }
    .timeline-step:first-child .inline-input-problem {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .timeline-step.answered .inline-input-problem,
    .card.card-complete .inline-input-problem {
      background: var(--answer-bg);
      color: var(--answer-text);
    }
    .inline-input-answer {
      display: block;
      margin: 0;
      padding: 0;
      min-height: 1.45em;
      background: transparent;
      border-radius: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.55rem;
      margin: 0;
      align-items: center;
      padding: 0.45rem var(--card-text-x) 0.4rem;
      padding-right: calc(var(--card-text-x) + 1.75rem);
    }
    .tags-row-edit {
      flex: 1 1 auto;
      min-width: 0;
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem;
    }
    .tags-row-edit .inline-input.single {
      flex: 1 1 6rem;
      min-width: 4rem;
      width: auto;
      max-width: 100%;
    }
    .tags-row-tags {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem;
      min-width: 0;
    }
    .tags-row .card-id {
      font: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      color: var(--text);
      margin: 0;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .tags-row .card-id:hover,
    .tags-row .card-id:focus-visible {
      text-decoration: underline;
      outline: none;
    }
    .tags-row:not(:has(.tag)) .tags-add {
      display: none;
    }
    .card:hover .tags-row:not(:has(.tag)) .tags-add,
    .card:focus-within .tags-row:not(:has(.tag)) .tags-add {
      display: inline;
    }
    .followup-input {
      display: none;
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.45rem var(--card-text-x);
      border: none;
      border-radius: 6px;
      font: inherit;
      font-size: 0.85rem;
      line-height: 1.45;
      color: var(--text);
      background: var(--tone-2);
      outline: none;
      min-height: 2.25rem;
    }
    .card:hover .followup-input,
    .card:focus-within .followup-input,
    .followup-input:not(:placeholder-shown) {
      display: block;
    }
    .followup-input:focus {
      display: block;
      background: var(--bg);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }
    .followup-input::placeholder { color: var(--muted); }
    .tag {
      font-size: 0.68rem;
      font-weight: 500;
      padding: 0.12rem 0.4rem;
      border-radius: 4px;
    }
    .tags-row-edit[data-editable] {
      cursor: text;
      border-radius: 6px;
      padding: 0.1rem 0.25rem;
      margin: -0.1rem -0.25rem;
    }
    .tags-row-edit[data-editable]:hover { background: var(--hover-fill); }
    .tags-add {
      font-size: 0.75rem;
      color: var(--muted);
      font-style: italic;
    }
    .card-footer {
      margin-top: 0.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.75rem;
      align-items: center;
    }
    .text-btn {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      font-size: 0.75rem;
      color: var(--link);
      cursor: pointer;
    }
    .text-btn:hover { color: var(--text); text-decoration: underline; }
    .text-btn.muted { color: var(--muted); }
    .links {
      font-size: 0.72rem;
      color: var(--muted);
    }
    .links button {
      background: none; border: none; padding: 0;
      font: inherit; color: var(--link); cursor: pointer;
    }
    .links button:hover { text-decoration: underline; }
    .add-trigger {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      width: 100%;
      padding: 0.55rem 0.65rem;
      border: none;
      border-radius: 8px;
      background: var(--tone-2);
      color: var(--muted);
      font: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: left;
      transition: color 0.15s, background 0.15s;
    }
    .add-trigger:hover {
      color: var(--text);
      background: var(--tone-3);
    }
    .composer {
      background: var(--bg);
      border-radius: 10px;
      padding: 0.75rem;
      box-shadow: 0 0 0 3px var(--focus-ring);
    }
    .composer.linked { margin-left: 0.75rem; }
    .composer textarea {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.9rem;
      resize: none;
      outline: none;
      min-height: 2.75rem;
    }
    .composer-meta {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
      align-items: center;
    }
    .composer-meta input {
      flex: 1;
      border: none;
      background: var(--hover-fill);
      border-radius: 6px;
      padding: 0.35rem 0.5rem;
      font: inherit;
      font-size: 0.75rem;
      color: var(--text);
      outline: none;
    }
    .composer-meta input::placeholder { color: var(--muted); }
    .composer-actions {
      display: flex;
      gap: 0.35rem;
      margin-top: 0.5rem;
      justify-content: flex-end;
    }
    .btn-sm {
      font: inherit;
      font-size: 0.75rem;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      border: none;
      background: var(--tone-2);
      color: var(--subtle);
      cursor: pointer;
    }
    .btn-sm.primary {
      background: var(--text);
      color: var(--bg);
    }
    .btn-sm:hover { filter: brightness(0.96); }
    .state-dump { margin-top: 2rem; font-size: 0.7rem; color: var(--muted); }
    .state-dump summary { cursor: pointer; }
    .state-dump pre {
      overflow: auto; max-height: 200px;
      background: var(--surface);
      padding: 0.75rem; border-radius: 8px; margin-top: 0.5rem;
    }
    .highlight { outline: 2px solid var(--tone-3); outline-offset: 2px; }
    .timeline-step.highlight {
      outline: 2px solid var(--tone-3);
      outline-offset: 0;
      border-radius: 4px;
    }
    .list-view {
      background: var(--surface);
      border-radius: 12px;
      padding: 0.75rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .list-header {
      padding: 0.25rem 0.85rem 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
    }
    .list-body { display: flex; flex-direction: column; gap: 0; }
    .list-body > .add-trigger,
    .list-body > .composer {
      margin-top: 1rem;
    }
    .list-cards {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .composer-in-card { margin-top: 0.5rem; }
    .mention {
      font-weight: 600;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 3px;
      padding: 0 0.15rem;
    }
    .mention-menu {
      position: fixed;
      z-index: 1000;
      background: var(--bg);
      border-radius: 8px;
      padding: 0.25rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 12rem;
      overflow: auto;
    }
    .mention-menu-item {
      font: inherit;
      font-size: 0.8rem;
      text-align: left;
      padding: 0.35rem 0.5rem;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }
    .mention-menu-item:hover,

<body>
  <div class="app-shell">
    <header>
      <h1>Decisions</h1>
      <div class="header-right">
        <nav class="view-tabs" aria-label="View">
          <button type="button" class="view-tab" data-view="board">Board</button>
          <button type="button" class="view-tab active" data-view="list">List</button>
        </nav>
        <button type="button" class="view-tab dates-toggle" data-action="toggle-dates" aria-pressed="false">Dates</button>
        <span class="badge-proto">PoC · saved locally</span>
      </div>
    </header>
    <div class="app-body" id="app-body">
      <main>
        <div class="main-layout" id="main-layout">
          <div id="app"></div>
        </div>
        <details class="state-dump">
          <summary>Full state (JSON)</summary>
          <pre id="state-json"></pre>
        </details>
      </main>
    </div>
  </div>

  <script>
    let nextId = 1;
    /** @type {Record<string, { id: string, tags: string[], steps: object[] }>} */
    let items = {};

    const MENTION_PEOPLE = ['Alex', 'Casey', 'Jordan', 'Morgan', 'Riley', 'Sam'];

    /** @type {{ type: 'root' } | null} */
    let openComposer = null;

    /** @type {HTMLElement | null} */
    let mentionMenuEl = null;
    let selectionRefToolbarEl = null;
    /** @type {HTMLTextAreaElement | null} */
    let selectionRefToolbarTa = null;
    /** @type {{ ta: HTMLTextAreaElement, start: number, end: number, label: string } | null} */
    let selectionRefToolbarState = null;
    /** @type {object | null} */
    let selectionRefPick = null;
    /** @type {(() => void) | null} */
    let pendingInlineEditCommit = null;
    let refLinkPickerEl = null;
    let refLinkPickerQuery = '';
    /** @type {string[]} */
    let refLinkPickerActiveTags = [];
    /** @type {'all' | 'answer' | 'question' | 'card'} */
    let refLinkPickerKindFilter = 'all';

    const REF_EDITABLE_TEXTAREA_SEL = 'textarea.inline-input, textarea[data-composer-input], textarea[data-followup-input]';

    /** @type {HTMLElement | null} */
    let issuePreviewEl = null;

    /** @type {ReturnType<typeof setTimeout> | null} */
    let issuePreviewShowTimer = null;

    /** @type {ReturnType<typeof setTimeout> | null} */
    let issuePreviewHideTimer = null;

    /** @type {HTMLElement | null} */
    let issuePreviewAnchor = null;

    /** @type {ReturnType<typeof setTimeout> | null} */
    let issuePreviewDismissLockTimer = null;

    let issuePreviewDismissLocked = false;

    /** @type {HTMLElement | null} */
    let issueDrawerEl = null;

    /** @type {string | null} */
    let issueDrawerRefId = null;

    /** @type {{ item: object, step: object, field: 'problem' | 'answer' } | null} */
    let issuePanelUpgradeSource = null;

    /** @type {number | null} */
    let issuePanelViewRev = null;

    let issuePanelDiffOpen = false;

    let issuePanelShowOlderRevisions = false;

    /** @type {{ eventIndex: number, snapshotAt: string, stepIndex: number, field: 'problem' | 'answer', rev: number } | null} */
    let issuePanelCardHistoryView = null;

    /** @type {Record<string, string>} */
    let followupDrafts = {};

    /** @type {{ id: string, field: string, step?: number, panel?: boolean } | null} */
    let pendingFocus = null;

    const PANEL_CARD_ID_PREFIX = 'panel-';

    /** @type {'board' | 'list'} */
    let viewMode = 'list';

    let showAllDates = false;

    const STORAGE_KEY = 'kanban-poc:v1';
    const STORAGE_VERSION = 1;

    /** @type {ReturnType<typeof setTimeout> | null} */
    let saveStateTimer = null;

    function recomputeNextId() {
      let max = 0;
      for (const id of Object.keys(items)) {
        const m = id.match(/^item-(\d+)$/i);
        if (m) max = Math.max(max, parseInt(m[1], 10));
      }
      nextId = max + 1;
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          version: STORAGE_VERSION,
          nextId,
          items,
          viewMode,
          showAllDates,
        }));
      } catch (err) {
        console.warn('Could not save to localStorage', err);
      }
    }

    function scheduleSaveState() {
      if (saveStateTimer) clearTimeout(saveStateTimer);
      saveStateTimer = setTimeout(() => {
        saveStateTimer = null;
        saveState();
      }, 250);
    }

    /** Decision refs use `!` — rewrite legacy `#` id links in stored text (not #tags). */
    function migrateDecisionRefSigilInText(text) {
      if (!text || typeof text !== 'string') return text;
      let out = text.replace(
        /\[([^\]]*)\]\(#(\d+(?:\/(?:\d+|a\d+))?(?:@v\d+)?)\)/gi,
        '[$1](!$2)',
      );
      out = out.replace(
        /(^|[^\w!])#(\d+(?:\/(?:\d+|a\d+))?(?:@v\d+)?)\b/g,
        '$1!$2',
      );
      return out;
    }

    function migrateAllItemRefSigils() {
      for (const item of Object.values(items)) {
        for (const step of item.steps) {
          if (step.problem) step.problem = migrateDecisionRefSigilInText(step.problem);
          if (step.answer) step.answer = migrateDecisionRefSigilInText(step.answer);
          for (const entry of step.problemRevisions || []) {
            entry.text = migrateDecisionRefSigilInText(entry.text);
          }
          for (const entry of step.answerRevisions || []) {
            entry.text = migrateDecisionRefSigilInText(entry.text);
          }
        }
      }
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        const data = JSON.parse(raw);
        if (!data || data.version !== STORAGE_VERSION || !data.items || typeof data.items !== 'object') {
          return false;
        }
        items = data.items;
        for (const item of Object.values(items)) {
          if (item?.steps?.length) item.steps = item.steps.map(normalizeStep);
        }
        migrateAllItemRefSigils();
        recomputeNextId();
        if (data.viewMode === 'board' || data.viewMode === 'list') viewMode = data.viewMode;
        if (typeof data.showAllDates === 'boolean') showAllDates = data.showAllDates;
        return true;
      } catch (err) {
        console.warn('Could not load from localStorage', err);
        return false;
      }
    }

    function initState() {
      if (loadState()) return;
      seed();
      saveState();
    }

    function uid() {
      return 'item-' + nextId++;
    }

    function parseTags(raw) {
      return raw.split(',').map((t) => t.trim()).filter(Boolean);
    }

    function normalizeTagName(name) {
      return String(name ?? '').trim().toLowerCase();
    }

    function addTagToItemTags(itemId, tag) {
      const name = normalizeTagName(tag);
      if (!name || !items[itemId]) return;
      if (!items[itemId].tags.includes(name)) items[itemId].tags.push(name);
    }

    function allKnownTags() {
      const set = new Set();
      for (const item of Object.values(items)) {
        for (const t of item.tags) set.add(t);
      }
      return [...set].sort((a, b) => a.localeCompare(b));
    }

    function appendComposerTag(tagsInput, tag) {
      if (!tagsInput) return;
      const name = normalizeTagName(tag);
      if (!name) return;
      const tags = parseTags(tagsInput.value);
      if (tags.includes(name)) return;
      tagsInput.value = tagsInput.value.trim() ? `${tagsInput.value}, ${name}` : name;
    }

    function resolveTagTargetItemId(ta) {
      if (ta.matches('[data-composer-input]')) return 'composer';
      if (ta.dataset.refItemId) return ta.dataset.refItemId;
      if (ta.matches('[data-followup-input]')) return ta.dataset.id;
      return null;
    }

    function applyTagFromTextarea(ta, tag) {
      const target = resolveTagTargetItemId(ta);
      if (target === 'composer') {
        appendComposerTag(ta.closest('[data-composer]')?.querySelector('[data-composer-tags]'), tag);
        return;
      }
      if (target) addTagToItemTags(target, tag);
    }

    /** `#tag` shortcut: add to the card (or composer) tag list only — not kept in body text. */
    function insertHashTag(ta, tagName) {
      const pos = ta.selectionStart ?? ta.value.length;
      const before = ta.value.slice(0, pos);
      const match = before.match(/#([\w.-]*)$/);
      if (!match) return;
      const start = pos - match[0].length;
      const tag = normalizeTagName(tagName);
      if (!tag) return;
      ta.value = `${ta.value.slice(0, start)}${ta.value.slice(pos)}`;
      ta.focus();
      ta.setSelectionRange(start, start);
      autoGrowTextarea(ta);
      applyTagFromTextarea(ta, tag);
    }

    function consumeTrailingHashTag(ta) {
      const pos = ta.selectionStart ?? ta.value.length;
      const before = ta.value.slice(0, pos);
      const match = before.match(/#([\w][\w.-]*)$/);
      if (!match?.[1]) return false;
      insertHashTag(ta, match[1]);
      return true;
    }

    const TAG_PALETTE = [
      { bg: '#e4e4e7', text: '#27272a' },
      { bg: '#d4d4d8', text: '#18181b' },
      { bg: '#f4f4f5', text: '#52525b' },
      { bg: '#a1a1aa', text: '#fafafa' },
      { bg: '#71717a', text: '#fafafa' },
      { bg: '#52525b', text: '#f4f4f5' },
      { bg: '#e4e4e7', text: '#3f3f46' },
      { bg: '#d4d4d8', text: '#3f3f46' },
    ];

    function tagColorIndex(name) {
      let hash = 0;
      const key = name.toLowerCase();
      for (let i = 0; i < key.length; i++) {
        hash = ((hash << 5) - hash + key.charCodeAt(i)) | 0;
      }
      return Math.abs(hash) % TAG_PALETTE.length;
    }

    function tagStyle(name) {
      const c = TAG_PALETTE[tagColorIndex(name)];
      return `background:${c.bg};color:${c.text}`;
    }

    function stepResolved(step) {
      return !!(step.answer && step.answer.trim());
    }

    function stepFullyResolved(step) {
      return stepResolved(step) && !step.answerTentative;
    }

    function ensureStepRevisions(step) {
      const now = new Date().toISOString();
      if (!step.problemRevisions?.length) {
        step.problemRevisions = [{ rev: 1, text: step.problem, at: step.problemAt || now }];
        step.problemRev = 1;
      }
      if (step.answer?.trim() && !step.answerRevisions?.length) {
        step.answerRevisions = [{
          rev: 1,
          text: step.answer.trim(),
          at: step.decidedAt || now,
          tentative: !!step.answerTentative,
        }];
        step.answerRev = 1;
      }
    }

    function recordProblemEdit(step, newText) {
      const trimmed = newText.trim();
      if (!trimmed) return;
      ensureStepRevisions(step);
      if (trimmed === getProblemText(step, step.problemRev)) return;
      step.problemRev += 1;
      step.problemRevisions.push({ rev: step.problemRev, text: trimmed, at: new Date().toISOString() });
      step.problem = trimmed;
    }

    function recordAnswerEdit(step, newText) {
      const trimmed = newText.trim();
      if (!trimmed) return;
      if (!step.answerRevisions?.length) {
        step.answerRevisions = [];
        step.answerRev = 0;
      }
      if (trimmed === getAnswerText(step, step.answerRev)) return;
      step.answerRev += 1;
      step.answerRevisions.push({
        rev: step.answerRev,
        text: trimmed,
        at: new Date().toISOString(),
        tentative: !!step.answerTentative,
      });
      step.answer = trimmed;
      step.decidedAt = step.answerRevisions[step.answerRevisions.length - 1].at;
    }

    /** Patch markdown in place at the current revision (no new rev — e.g. link pin updates). */
    function setStepFieldHeadText(step, field, text) {
      if (field !== 'problem' && field !== 'answer') return;
      ensureStepRevisions(step);
      step[field] = text;
      const rev = field === 'answer' ? step.answerRev : step.problemRev;
      const revisions = field === 'answer' ? step.answerRevisions : step.problemRevisions;
      const entry = revisions?.find((e) => e.rev === rev);
      if (entry) entry.text = text;
    }

    function getProblemText(step, rev = null) {
      ensureStepRevisions(step);
      const r = rev ?? step.problemRev;
      return step.problemRevisions.find((entry) => entry.rev === r)?.text ?? step.problem;
    }

    function getAnswerText(step, rev = null) {
      if (!step.answer?.trim() && !step.answerRevisions?.length) return null;
      if (!step.answerRevisions?.length) return step.answer?.trim() || null;
      const r = rev ?? step.answerRev;
      return step.answerRevisions.find((entry) => entry.rev === r)?.text ?? step.answer?.trim() ?? null;
    }

    function stepFieldHeadRev(step, field) {
      ensureStepRevisions(step);
      return field === 'answer' ? step.answerRev : step.problemRev;
    }

    function stepFieldRevisions(step, field) {
      ensureStepRevisions(step);
      return field === 'answer' ? (step.answerRevisions || []) : step.problemRevisions;
    }

    function normalizeStep(step) {
      const answer = step.answer?.trim() || null;
      let answerTentative = !!(step.answerTentative || step.answerMark);
      if (!answer) answerTentative = false;
      const normalized = {
        problem: step.problem,
        answer,
        answerTentative,
        decidedAt: answer ? (step.decidedAt || new Date().toISOString()) : null,
        problemRevisions: step.problemRevisions,
        answerRevisions: step.answerRevisions,
        problemRev: step.problemRev,
        answerRev: step.answerRev,
      };
      ensureStepRevisions(normalized);
      return normalized;
    }

    function toggleAnswerTentative(step) {
      if (!stepResolved(step)) return;
      step.answerTentative = !step.answerTentative;
    }

    function formatDecisionDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      return `${dd}.${mm}.${yyyy}`;
    }

    function itemNeedsDecision(item) {
      return item.steps.some((s) => !stepFullyResolved(s));
    }

    function cardStatusClass(item) {
      const resolved = item.steps.filter(stepFullyResolved).length;
      if (resolved === item.steps.length) return 'card-complete';
      if (resolved === 0 && item.steps.every((s) => !stepResolved(s))) return 'card-incomplete';
      return 'card-partial';
    }

    function createItem({ problem, tags = [], answer = null, steps = null }) {
      const id = uid();
      if (steps) {
        items[id] = { id, tags, steps: steps.map(normalizeStep) };
        return id;
      }
      const trimmed = problem?.trim();
      if (!trimmed) return null;
      const ans = answer ? answer.trim() : null;
      items[id] = {
        id,
        tags,
        steps: [normalizeStep({ problem: trimmed, answer: ans })],
      };
      return id;
    }

    function addStep(itemId, problem) {
      const trimmed = problem.trim();
      if (!trimmed || !items[itemId]) return false;
      items[itemId].steps.push(normalizeStep({ problem: trimmed, answer: null }));
      return true;
    }

    function seed() {
      const refNum = (id) => id.replace(/^item-/i, '');

      const archId = createItem({
        tags: ['allegro', 'architecture'],
        steps: [
          {
            problem: 'One shared list per household or separate lists per member on Allegro? @Ania',
            answer: 'One household list by default; optional personal lists in settings. @Marek to align with account model.',
            decidedAt: '2026-10-28T14:30:00.000Z',
          },
          {
            problem: 'How do list sync and cart checkout stay consistent when we split services? (API link wired after seed.)',
            answer: null,
          },
        ],
      });
      createItem({
        tags: ['allegro', 'product'],
        steps: [{ problem: 'Do collaborators see list changes in real time without refreshing?', answer: null }],
      });
      createItem({
        tags: ['allegro', 'ux'],
        steps: [
          {
            problem: 'First-time users: empty list or a sample “Weekly groceries” template?',
            answer: 'Sample template with 5 generic items they can clear in one tap.',
            decidedAt: '2026-10-25T09:15:00.000Z',
          },
          {
            problem: 'Show the collaborative list onboarding coach again after dismiss?',
            answer: 'Only from Help → “Shared lists”, not on every app open.',
            decidedAt: '2026-10-26T16:45:00.000Z',
          },
        ],
      });
      createItem({
        tags: ['allegro', 'security'],
        steps: [
          {
            problem: 'How do we invite someone to a shared Allegro shopping list?',
            answer: 'Deep link + in-app invite; must be logged into Allegro to accept.',
            decidedAt: '2026-10-22T11:00:00.000Z',
          },
          {
            problem: 'Can a list owner remove a member without their consent?',
            answer: null,
          },
        ],
      });
      const apiId = createItem({
        tags: ['allegro', 'api'],
        steps: [
          {
            problem: 'Version the Shopping List API under /v1 or negotiate via Accept-Version header?',
            answer: 'Path prefix /v1/lists; breaking changes only in /v2 with 12-month sunset.',
            decidedAt: '2026-10-20T13:20:00.000Z',
          },
        ],
      });
      createItem({
        tags: ['allegro', 'infra'],
        steps: [
          {
            problem: 'Store list state in existing Allegro Postgres or a dedicated service DB?',
            answer: 'Dedicated list service DB; cart stays on commerce core.',
            decidedAt: '2026-10-18T10:00:00.000Z',
          },
          {
            problem: 'RPO / RTO if a shared list is unavailable during peak shopping?',
            answer: 'RPO 15m, RTO 1h; read-only cached list on mobile if sync is down.',
            decidedAt: '2026-10-19T15:30:00.000Z',
          },
        ],
      });
      createItem({
        tags: ['allegro', 'design'],
        steps: [{ problem: 'Show “checked off” items struck through or move them to a done section?', answer: null }],
      });
      createItem({
        tags: ['allegro', 'mobile'],
        steps: [
          {
            problem: 'Ship collaborative lists on iOS and Android in the same sprint?',
            answer: null,
          },
        ],
      });
      createItem({
        tags: ['allegro', 'legal'],
        steps: [
          {
            problem: 'Do shared lists need explicit consent under GDPR when adding a co-shopper?',
            answer: 'Yes — invitee accepts visibility of nickname and list activity; privacy policy updated.',
            decidedAt: '2026-10-15T08:00:00.000Z',
          },
        ],
      });
      createItem({
        tags: ['allegro', 'notifications'],
        steps: [
          {
            problem: 'Push when someone adds an item to our shared list — beta scope?',
            answer: 'Yes; one push per batch (max 1 / 15 min per list) to avoid spam.',
            decidedAt: '2026-10-27T18:00:00.000Z',
          },
          {
            problem: 'Also notify when a list item is linked to a purchased offer?',
            answer: null,
          },
        ],
      });

      items[archId].steps[1].problem =
        `How do list sync and checkout stay consistent when we split? See [List API versioning](!${refNum(apiId)}).`;

      const rolloutId = createItem({
        tags: ['allegro', 'rollout'],
        steps: [
          {
            problem: 'Who gets the collaborative shopping list beta on Allegro?',
            answer: 'Allegro Smart households in PL only — invite from account settings, no store banner yet.',
            decidedAt: '2026-10-10T09:00:00.000Z',
          },
          {
            problem: 'What counts as beta success for shared lists?',
            answer: '10k active shared lists with ≥2 members, weekly add-to-cart from a list item at least once per list.',
            decidedAt: '2026-10-11T11:30:00.000Z',
          },
          {
            problem: 'Is Allegro Smart required during the shared-list beta?',
            answer: 'Free until general availability; Smart not required to join a shared list during beta.',
            decidedAt: '2026-10-12T14:00:00.000Z',
          },
          {
            problem: 'When do we enable list sharing for all Allegro accounts in PL?',
            answer: null,
          },
        ],
      });

      {
        const charge = items[rolloutId].steps[2];
        charge.answerRevisions = [
          { rev: 1, text: 'Smart required; shared lists are a Smart-only perk.', at: '2026-10-12T10:00:00.000Z', tentative: false },
          { rev: 2, text: 'Free for 90 days, then Smart required to create new shared lists.', at: '2026-10-12T12:00:00.000Z', tentative: false },
          { rev: 3, text: 'Free until general availability; Smart not required to join a shared list during beta.', at: '2026-10-12T14:00:00.000Z', tentative: false },
        ];
        charge.answerRev = 3;
        charge.answer = charge.answerRevisions[2].text;
        charge.decidedAt = charge.answerRevisions[2].at;
      }

      const nApi = refNum(apiId);
      const nRollout = refNum(rolloutId);

      createItem({
        tags: ['allegro', 'fixtures'],
        steps: [
          {
            problem: 'Fixture: !refs and answer revisions for Allegro shared shopping lists.',
            answer: `Topic [list beta rollout](!${nRollout}). Pinned [90-day Smart trial](!${nRollout}/a3@v2). Latest [no Smart in beta](!${nRollout}/a3@v3). API: [!${nApi}](!${nApi}).`,
            decidedAt: '2026-10-31T00:00:00.000Z',
          },
        ],
      });
    }

    function itemsInColumn(needsDecision) {
      return Object.values(items)
        .filter((i) => itemNeedsDecision(i) === needsDecision)
        .sort((a, b) => a.id.localeCompare(b.id));
    }

    function allItemsOrdered() {
      return Object.values(items).sort((a, b) => a.id.localeCompare(b.id));
    }

    function renderGroupedCards(itemList) {
      if (!itemList.length) return '';
      const cards = itemList.map((item) => renderCard(item)).join('');
      return `<div class="list-cards">${cards}</div>`;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeAttr(s) {
      return escapeHtml(s).replace(/'/g, '&#39;');
    }

    function issueRefTitle(id) {
      const item = items[id];
      if (!item) return 'Missing decision';
      return item.steps[0]?.problem || id;
    }

    function truncateLabel(text, max = 52) {
      if (!text || text.length <= max) return text;
      return `${text.slice(0, max - 1)}…`;
    }

    function normalizeIssueId(ref) {
      const s = String(ref ?? '').trim();
      const m = s.match(/^item-(\d+)$/i) || s.match(/^(\d+)$/);
      return m ? `item-${m[1]}` : null;
    }

    /** @returns {{ itemId: string, stepIndex: number|null, focusAnswer: boolean, revision: number|null } | null} */
    function parseIssueRef(ref) {
      const s = String(ref ?? '').trim().replace(/^[!#]+/, '');
      const m = s.match(/^(?:(item-\d+)|(\d+))(?:\/(?:step-)?(\d+)|\/a(\d+))?(?:@v(\d+))?$/i);
      if (!m) {
        const itemId = normalizeIssueId(s.replace(/@v\d+$/i, ''));
        return itemId ? { itemId, stepIndex: null, focusAnswer: false, revision: null } : null;
      }
      const itemId = normalizeIssueId(m[1] || m[2]);
      if (!itemId) return null;
      let stepIndex = null;
      let focusAnswer = false;
      if (m[3]) {
        const stepNum = parseInt(m[3], 10);
        if (stepNum >= 1) stepIndex = stepNum - 1;
      } else if (m[4]) {
        const stepNum = parseInt(m[4], 10);
        if (stepNum >= 1) {
          stepIndex = stepNum - 1;
          focusAnswer = true;
        }
      }
      const revision = m[5] ? parseInt(m[5], 10) : null;
      return { itemId, stepIndex, focusAnswer, revision };
    }

    function formatIssueRefSuffix(parsed) {
      return parsed.revision != null ? `@v${parsed.revision}` : '';
    }

    /** @param {{ itemId: string, stepIndex: number|null, focusAnswer?: boolean, revision?: number|null }} parsed */
    function formatIssueRefToken(parsed) {
      const num = parsed.itemId.replace(/^item-/i, '');
      const suffix = formatIssueRefSuffix(parsed);
      if (parsed.focusAnswer && parsed.stepIndex != null) {
        return `item-${num}/a${parsed.stepIndex + 1}${suffix}`;
      }
      if (parsed.stepIndex != null) return `item-${num}/${parsed.stepIndex + 1}${suffix}`;
      return parsed.itemId;
    }

    /** Visible ref label (no @v). */
    function formatIssueRefDisplay(parsed) {
      const num = parsed.itemId.replace(/^item-/i, '');
      if (parsed.focusAnswer && parsed.stepIndex != null) {
        return `!${num}/a${parsed.stepIndex + 1}`;
      }
      if (parsed.stepIndex != null) return `!${num}/${parsed.stepIndex + 1}`;
      return `!${num}`;
    }

    /** Stored ref string including @v when pinned. */
    function formatIssueRefInText(parsed) {
      return `${formatIssueRefDisplay(parsed)}${formatIssueRefSuffix(parsed)}`;
    }

    function isIssueRefStale(parsed) {
      if (parsed.stepIndex == null) return false;
      const item = items[parsed.itemId];
      const step = item?.steps[parsed.stepIndex];
      if (!item || !step) return false;
      const field = parsed.focusAnswer ? 'answer' : 'problem';
      const headRev = stepFieldHeadRev(step, field);
      if (parsed.revision == null) return false;
      return parsed.revision !== headRev;
    }

    function issueRefSameTarget(a, b) {
      if (!a || !b) return false;
      return a.itemId === b.itemId
        && a.stepIndex === b.stepIndex
        && !!a.focusAnswer === !!b.focusAnswer;
    }

    /** Href strings that may appear inside markdown for a pinned ref. */
    function issueRefHrefNeedles(parsed) {
      if (parsed.revision == null) return [];
      const num = parsed.itemId.replace(/^item-/i, '');
      const suffix = `@v${parsed.revision}`;
      const needles = new Set([formatIssueRefInText({ ...parsed, revision: parsed.revision })]);
      if (parsed.focusAnswer && parsed.stepIndex != null) {
        const sn = parsed.stepIndex + 1;
        needles.add(`!${num}/a${sn}${suffix}`);
        needles.add(`#${num}/a${sn}${suffix}`);
        needles.add(`item-${num}/a${sn}${suffix}`);
        needles.add(`${num}/a${sn}${suffix}`);
      } else if (parsed.stepIndex != null) {
        const sn = parsed.stepIndex + 1;
        needles.add(`!${num}/${sn}${suffix}`);
        needles.add(`#${num}/${sn}${suffix}`);
        needles.add(`item-${num}/${sn}${suffix}`);
        needles.add(`${num}/${sn}${suffix}`);
      } else {
        needles.add(`!${num}${suffix}`);
        needles.add(`#${num}${suffix}`);
        needles.add(`item-${num}${suffix}`);
        needles.add(`${num}${suffix}`);
      }
      return [...needles];
    }

    function issueRefNewHrefForNeedle(needle, newParsed) {
      const newDisplay = formatIssueRefInText(newParsed);
      if (needle.startsWith('item-')) return formatIssueRefToken(newParsed);
      if (needle.startsWith('!') || needle.startsWith('#')) return newDisplay;
      return newDisplay.replace(/^!/, '');
    }

    function replaceIssueRefRevisionInText(text, parsed, newRevision, { unpinAtHead = false } = {}) {
      const oldParsed = { ...parsed, revision: parsed.revision };
      const storedRevision = unpinAtHead ? null : newRevision;
      const newParsed = { ...parsed, revision: storedRevision };
      const oldNeedles = issueRefHrefNeedles(oldParsed);
      if (!oldNeedles.length) return text;
      const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      let out = text;
      for (const oldHref of oldNeedles) {
        const newHref = issueRefNewHrefForNeedle(oldHref, newParsed);
        if (oldHref === newHref) continue;
        out = out
          .replace(new RegExp(`\\(${esc(oldHref)}\\)`, 'g'), `(${newHref})`)
          .replace(new RegExp(esc(oldHref), 'g'), newHref);
      }
      return out;
    }

    /** Where the ref markdown lives (not the ref target). */
    function findFieldContainingIssueRef(parsed) {
      if (parsed.revision == null) return null;
      const needles = issueRefHrefNeedles(parsed);
      for (const item of Object.values(items)) {
        for (let si = 0; si < item.steps.length; si++) {
          for (const field of ['problem', 'answer']) {
            const text = item.steps[si][field];
            if (text && needles.some((needle) => text.includes(needle))) {
              return { item, step: item.steps[si], field };
            }
          }
        }
      }
      return null;
    }

    function resolveIssueRefSourceField(anchorEl, parsed) {
      const editable = anchorEl?.closest?.('[data-editable]');
      if (editable) {
        const field = editable.dataset.editable;
        if (field === 'problem' || field === 'answer') {
          const item = items[editable.dataset.id];
          const step = item?.steps[Number(editable.dataset.step)];
          if (item && step) return { item, step, field };
        }
      }
      if (issuePreviewEl?.dataset?.sourceItem) {
        const field = issuePreviewEl.dataset.sourceField;
        if (field === 'problem' || field === 'answer') {
          const item = items[issuePreviewEl.dataset.sourceItem];
          const step = item?.steps[Number(issuePreviewEl.dataset.sourceStep)];
          if (item && step) return { item, step, field };
        }
      }
      return findFieldContainingIssueRef(parsed);
    }

    function upgradeIssueRefLink(anchorEl) {
      const refId = anchorEl?.dataset?.issueRef || issuePreviewEl?.dataset?.refId || issueDrawerRefId;
      if (!refId) return false;
      const parsed = parseIssueRef(refId);
      if (!parsed || parsed.revision == null || parsed.stepIndex == null) return false;
      if (!isIssueRefStale(parsed)) return false;
      const targetItem = items[parsed.itemId];
      const targetStep = targetItem?.steps[parsed.stepIndex];
      if (!targetItem || !targetStep) return false;
      const revField = parsed.focusAnswer ? 'answer' : 'problem';
      const headRev = stepFieldHeadRev(targetStep, revField);
      const drawerParsed = issueDrawerRefId ? parseIssueRef(issueDrawerRefId) : null;
      let source = resolveIssueRefSourceField(anchorEl, parsed);
      if (!source && issuePanelUpgradeSource && issueRefSameTarget(drawerParsed, parsed)) {
        source = issuePanelUpgradeSource;
      }
      if (!source) source = findFieldContainingIssueRef(parsed);
      if (!source) return false;
      const { step, field } = source;
      const before = field === 'answer'
        ? (getAnswerText(step) ?? step.answer ?? '')
        : (getProblemText(step) ?? step.problem ?? '');
      const updated = replaceIssueRefRevisionInText(before, parsed, headRev, { unpinAtHead: false });
      if (updated === before) return false;
      setStepFieldHeadText(step, field, updated);
      if (issueDrawerRefId && issueRefSameTarget(drawerParsed, parsed)) {
        issueDrawerRefId = formatIssueRefToken({ ...parsed, revision: headRev });
      }
      issuePanelViewRev = headRev;
      issuePanelDiffOpen = false;
      issuePanelUpgradeSource = source;
      removeIssuePreview();
      render();
      return true;
    }

    function issueRefPanelUpgradeHtml(parsed) {
      if (!isIssueRefStale(parsed)) return '';
      const token = formatIssueRefToken(parsed);
      return `<button type="button" class="issue-ref-preview-upgrade" data-action="upgrade-issue-ref" data-issue-ref="${escapeAttr(token)}">Update link to current</button>`;
    }

    function panelRefField(parsed) {
      return parsed.focusAnswer ? 'answer' : 'problem';
    }

    function panelRefStep(parsed) {
      return items[parsed.itemId]?.steps[parsed.stepIndex];
    }

    function panelAllRevisionNumbers(parsed) {
      const step = panelRefStep(parsed);
      if (!step) return [];
      return stepFieldRevisions(step, panelRefField(parsed))
        .map((entry) => entry.rev)
        .sort((a, b) => a - b);
    }

    function panelRevisionFloor(parsed) {
      return parsed?.revision ?? null;
    }

    function panelHiddenOlderRevisionCount(parsed) {
      const floor = panelRevisionFloor(parsed);
      if (floor == null) return 0;
      return panelAllRevisionNumbers(parsed).filter((r) => r < floor).length;
    }

    function panelRevisionNumbers(parsed) {
      const all = panelAllRevisionNumbers(parsed);
      if (issuePanelShowOlderRevisions) return all;
      const floor = panelRevisionFloor(parsed);
      if (floor == null) return all;
      return all.filter((r) => r >= floor);
    }

    function ensurePanelViewRev(parsed) {
      const step = panelRefStep(parsed);
      if (!step) return null;
      const headRev = stepFieldHeadRev(step, panelRefField(parsed));
      const linkRev = parsed.revision;
      if (linkRev == null) {
        issuePanelViewRev = headRev;
      } else if (issuePanelViewRev == null) {
        issuePanelViewRev = linkRev;
      } else if (linkRev >= headRev) {
        issuePanelViewRev = headRev;
      }
      return issuePanelViewRev;
    }

    function panelHighlightRef(parsed) {
      if (parsed.stepIndex == null && issuePanelCardHistoryView) {
        const { eventIndex, snapshotAt, stepIndex, field, rev } = issuePanelCardHistoryView;
        return {
          itemId: parsed.itemId,
          stepIndex,
          focusAnswer: field === 'answer',
          displayRevision: rev,
          cardHistoryEventIndex: eventIndex,
          cardHistorySnapshotAt: snapshotAt,
        };
      }
      const viewRev = ensurePanelViewRev(parsed);
      return viewRev == null ? parsed : { ...parsed, displayRevision: viewRev };
    }

    function collectCardHistoryEvents(item) {
      const num = item.id.replace(/^item-/i, '');
      /** @type {{ stepIndex: number, field: 'problem' | 'answer', rev: number, at: string, text: string, label: string, tentative: boolean, step: object }[]} */
      const events = [];
      item.steps.forEach((step, stepIndex) => {
        ensureStepRevisions(step);
        const sn = stepIndex + 1;
        for (const entry of stepFieldRevisions(step, 'problem')) {
          events.push({
            stepIndex,
            field: 'problem',
            rev: entry.rev,
            at: entry.at || '',
            text: entry.text,
            label: `!${num}/${sn} · question`,
            tentative: !!entry.tentative,
            step,
          });
        }
        for (const entry of stepFieldRevisions(step, 'answer')) {
          if (!entry.text?.trim() && entry.rev > 1) continue;
          events.push({
            stepIndex,
            field: 'answer',
            rev: entry.rev,
            at: entry.at || '',
            text: entry.text,
            label: `!${num}/a${sn} · answer`,
            tentative: !!entry.tentative,
            step,
          });
        }
      });
      events.sort((a, b) => {
        if (a.at !== b.at) return a.at.localeCompare(b.at);
        if (a.stepIndex !== b.stepIndex) return a.stepIndex - b.stepIndex;
        if (a.field !== b.field) return a.field === 'problem' ? -1 : 1;
        return a.rev - b.rev;
      });
      return events;
    }

    function cardHistoryViewFromEvent(ev, eventIndex) {
      return {
        eventIndex,
        snapshotAt: ev.at,
        stepIndex: ev.stepIndex,
        field: ev.field,
        rev: ev.rev,
      };
    }

    function firstHistoryEventIndexForStep(events, stepIndex) {
      const idx = events.findIndex((e) => e.stepIndex === stepIndex);
      return idx === -1 ? Infinity : idx;
    }

    function stepVisibleAtHistoryEvent(events, stepIndex, eventIndex) {
      return firstHistoryEventIndexForStep(events, stepIndex) <= eventIndex;
    }

    function fieldRevAtHistoryEvent(events, stepIndex, field, eventIndex) {
      let rev = null;
      events.forEach((ev, i) => {
        if (i > eventIndex) return;
        if (ev.stepIndex === stepIndex && ev.field === field) rev = ev.rev;
      });
      return rev;
    }

    function isSameCardHistorySelection(view, ev) {
      return view
        && view.stepIndex === ev.stepIndex
        && view.field === ev.field
        && view.rev === ev.rev;
    }

    function initIssuePanelCardHistoryView(item) {
      const events = collectCardHistoryEvents(item);
      if (!events.length) {
        issuePanelCardHistoryView = null;
        return;
      }
      const lastIdx = events.length - 1;
      issuePanelCardHistoryView = cardHistoryViewFromEvent(events[lastIdx], lastIdx);
      issuePanelViewRev = events[lastIdx].rev;
    }

    function stepPanelViewRev(parsed, delta) {
      const nums = panelRevisionNumbers(parsed);
      const current = ensurePanelViewRev(parsed);
      if (current == null) return;
      const idx = nums.indexOf(current);
      if (idx === -1) return;
      const next = nums[idx + delta];
      if (next == null) return;
      issuePanelViewRev = next;
      populateIssueRefDrawer(issueDrawerRefId);
    }

    function revisionFieldText(step, field, rev) {
      if (rev == null) return '';
      return field === 'answer' ? (getAnswerText(step, rev) || '') : (getProblemText(step, rev) || '');
    }

    function tokenizeDiff(text) {
      return String(text ?? '').match(/\S+|\s+/g) || [];
    }

    function diffWordsOps(oldText, newText) {
      const a = tokenizeDiff(oldText);
      const b = tokenizeDiff(newText);
      const m = a.length;
      const n = b.length;
      const dp = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          dp[i][j] = a[i - 1] === b[j - 1]
            ? dp[i - 1][j - 1] + 1
            : Math.max(dp[i - 1][j], dp[i][j - 1]);
        }
      }
      const ops = [];
      let i = m;
      let j = n;
      while (i > 0 || j > 0) {
        if (i > 0 && j > 0 && a[i - 1] === b[j - 1]) {
          ops.unshift({ type: 'equal', text: a[i - 1] });
          i -= 1;
          j -= 1;
        } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
          ops.unshift({ type: 'insert', text: b[j - 1] });
          j -= 1;
        } else {
          ops.unshift({ type: 'delete', text: a[i - 1] });
          i -= 1;
        }
      }
      return ops;
    }

    function renderWordDiffHtml(oldText, newText) {
      if (oldText === newText) {
        return `<span class="diff-same">${escapeHtml(newText || '(empty)')}</span>`;
      }
      return diffWordsOps(oldText, newText)
        .map((op) => {
          if (op.type === 'equal') return escapeHtml(op.text);
          if (op.type === 'delete') return `<del class="diff-del">${escapeHtml(op.text)}</del>`;
          return `<ins class="diff-ins">${escapeHtml(op.text)}</ins>`;
        })
        .join('');
    }

    function canShowLinkedVsCurrentDiff(parsed) {
      if (!parsed || parsed.revision == null || parsed.stepIndex == null) return false;
      const step = panelRefStep(parsed);
      if (!step) return false;
      const headRev = stepFieldHeadRev(step, panelRefField(parsed));
      return parsed.revision !== headRev;
    }

    function buildIssuePanelDiffHtml(parsed) {
      if (!issuePanelDiffOpen) return '';
      const step = panelRefStep(parsed);
      if (!step || parsed.revision == null) return '';
      const field = panelRefField(parsed);
      const headRev = stepFieldHeadRev(step, field);
      const refRev = parsed.revision;
      const oldText = revisionFieldText(step, field, refRev);
      const newText = revisionFieldText(step, field, headRev);
      if (refRev === headRev) {
        return `<div class="issue-ref-panel-diff-body"><p class="issue-ref-panel-diff-caption">Linked revision is already current (v${headRev})</p></div>`;
      }
      const caption = `Linked v${refRev} → current v${headRev}`;
      return `<div class="issue-ref-panel-diff-body"><p class="issue-ref-panel-diff-caption">${escapeHtml(caption)}</p>${renderWordDiffHtml(oldText, newText)}</div>`;
    }

    function buildIssuePanelRefChrome(parsed) {
      if (!parsed || parsed.stepIndex == null) return '';
      const step = panelRefStep(parsed);
      if (!step) return '';
      const field = panelRefField(parsed);
      const revisions = stepFieldRevisions(step, field);
      const headRev = stepFieldHeadRev(step, field);
      const viewRev = ensurePanelViewRev(parsed);
      const revNums = panelRevisionNumbers(parsed);
      const idx = revNums.indexOf(viewRev);
      const parts = [];
      if (revisions.length > 1) {
        parts.push(`<div class="issue-ref-panel-rev-stepper">
          <button type="button" class="issue-ref-panel-rev-btn" data-action="panel-rev-prev" aria-label="Previous revision"${idx <= 0 ? ' disabled' : ''}>←</button>
          <span class="issue-ref-panel-rev-label">${viewRev === headRev ? `Latest · v${viewRev}` : `Viewing v${viewRev} · latest v${headRev}`}</span>
          <button type="button" class="issue-ref-panel-rev-btn" data-action="panel-rev-next" aria-label="Next revision"${idx >= revNums.length - 1 ? ' disabled' : ''}>→</button>
        </div>`);
      } else if (viewRev != null) {
        parts.push(`<div class="issue-ref-panel-view-rev">Revision v${viewRev}</div>`);
      }
      if (isIssueRefStale(parsed)) {
        parts.push('<p class="issue-ref-panel-stale">This link pins an older revision — bar on the referenced answer is yellow for that snapshot, gray at latest; use “Diff linked → current” below.</p>');
        parts.push(issueRefPanelUpgradeHtml(parsed));
      }
      if (canShowLinkedVsCurrentDiff(parsed)) {
        parts.push(`<div class="issue-ref-panel-diff-controls">
          <button type="button" class="issue-ref-panel-diff-toggle" data-action="toggle-panel-diff" aria-pressed="${issuePanelDiffOpen ? 'true' : 'false'}">${issuePanelDiffOpen ? 'Hide diff' : 'Diff linked → current'}</button>
        </div>`);
        parts.push(buildIssuePanelDiffHtml(parsed));
      }
      if (revisions.length >= 1) {
        const hiddenOlder = panelHiddenOlderRevisionCount(parsed);
        parts.push('<p class="issue-ref-panel-revisions-title">Revisions</p>');
        if (hiddenOlder > 0) {
          const label = issuePanelShowOlderRevisions
            ? 'Hide earlier revisions'
            : `Show ${hiddenOlder} earlier revision${hiddenOlder === 1 ? '' : 's'}`;
          parts.push(`<button type="button" class="issue-ref-panel-revisions-toggle" data-action="toggle-panel-older-revisions" aria-pressed="${issuePanelShowOlderRevisions ? 'true' : 'false'}">${label}</button>`);
        }
        const minRev = !issuePanelShowOlderRevisions ? panelRevisionFloor(parsed) : null;
        parts.push(`<div class="issue-ref-panel-revisions issue-ref-preview-revisions">${renderRevisionHistoryHtml(step, field, viewRev, { selectable: true, fullText: true, linkedRev: parsed.revision, minRev })}</div>`);
      }
      if (!parts.length) return '';
      return `<div class="issue-ref-panel-ref-meta">${parts.join('')}</div>`;
    }

    function renderCardHistoryTimelineHtml(item, activeView) {
      const events = collectCardHistoryEvents(item);
      if (!events.length) return '';
      const items = events.map((ev, eventIndex) => {
        const active = activeView?.eventIndex === eventIndex;
        const head = stepFieldHeadRev(ev.step, ev.field);
        const date = ev.at ? formatDecisionDate(ev.at) : '';
        const body = ev.text;
        const meta = `<div class="issue-ref-preview-revision-meta">v${ev.rev} · ${escapeHtml(ev.label)}${ev.tentative ? ' · tentative' : ''}${ev.rev === head ? ' · current' : ''}</div>`;
        const content = `<span class="revision-timeline-content">${meta}${escapeHtml(body)}</span>`;
        const dateHtml = date
          ? `<time class="revision-timeline-date" datetime="${escapeAttr(ev.at)}">${escapeHtml(date)}</time>`
          : '<span class="revision-timeline-date" aria-hidden="true"></span>';
        const node = `<span class="revision-timeline-node"><span class="revision-timeline-stem-top" aria-hidden="true"></span><span class="revision-timeline-marker" aria-hidden="true"></span><span class="revision-timeline-stem-bottom" aria-hidden="true"></span></span>`;
        const className = `revision-timeline-item${active ? ' is-active' : ''}`;
        return `<button type="button" class="${className}" data-action="panel-rev-select" data-card-history="1" data-event-index="${eventIndex}" data-rev="${ev.rev}" data-field="${ev.field}" data-step="${ev.stepIndex}" data-history-at="${escapeAttr(ev.at)}">${dateHtml}${node}${content}</button>`;
      }).join('');
      return `<div class="revision-timeline issue-ref-panel-card-history-timeline">${items}</div>`;
    }

    function buildIssuePanelCardHistoryChrome(item) {
      const timeline = renderCardHistoryTimelineHtml(item, issuePanelCardHistoryView);
      if (!timeline) return '';
      return `<div class="issue-ref-panel-ref-meta issue-ref-panel-card-history">
        <p class="issue-ref-panel-revisions-title">Card history</p>
        ${timeline}
      </div>`;
    }

    /** Pin @v to the current head revision for the referenced field (mutates parsed). */
    function pinCurrentIssueRefRevision(parsed) {
      if (!parsed) return parsed;
      const item = items[parsed.itemId];
      if (!item?.steps?.length) return parsed;

      let step = null;
      /** @type {'problem' | 'answer'} */
      let field = 'problem';

      if (parsed.focusAnswer && parsed.stepIndex != null) {
        step = item.steps[parsed.stepIndex];
        field = 'answer';
      } else if (parsed.stepIndex != null) {
        step = item.steps[parsed.stepIndex];
        field = 'problem';
      } else {
        step = item.steps[0];
        field = item.steps.length === 1 && getAnswerText(item.steps[0]) ? 'answer' : 'problem';
      }

      if (!step) return parsed;
      ensureStepRevisions(step);
      parsed.revision = stepFieldHeadRev(step, field);
      return parsed;
    }

    function issueRefRevisionExists(step, parsed) {
      if (parsed.revision == null) return true;
      const field = parsed.focusAnswer ? 'answer' : 'problem';
      return stepFieldRevisions(step, field).some((entry) => entry.rev === parsed.revision);
    }

    function issueRefExists(parsed) {
      const item = items[parsed.itemId];
      if (!item) return false;
      if (parsed.stepIndex == null) return true;
      const step = item.steps[parsed.stepIndex];
      if (!step) return false;
      return issueRefRevisionExists(step, parsed);
    }

    const REF_PLACEHOLDER_PREFIX = '\uE000ref';
    const REF_PLACEHOLDER_SUFFIX = '\uE001';

    /** @type {string[] | null} */
    let issueRefPlaceholderStash = null;

    function issueRefPartsToToken(num, stepNum, answerNum, revisionNum) {
      const base = answerNum ? `${num}/a${answerNum}` : stepNum ? `${num}/${stepNum}` : num;
      return revisionNum ? `${base}@v${revisionNum}` : base;
    }

    function issueRefAutocompleteLabel(parsed) {
      const item = items[parsed.itemId];
      if (!item) return formatIssueRefDisplay(parsed);
      if (parsed.focusAnswer && parsed.stepIndex != null) {
        const step = item.steps[parsed.stepIndex];
        const answer = step ? getAnswerText(step) : null;
        return truncateLabel(answer || 'Answer', 48);
      }
      if (parsed.stepIndex != null) {
        return truncateLabel(item.steps[parsed.stepIndex]?.problem || item.id, 48);
      }
      return truncateLabel(item.steps[0]?.problem || item.id, 48);
    }

    function renderIssueRef(refToken, displayLabel) {
      const parsed = parseIssueRef(refToken);
      if (!parsed) return escapeHtml(String(refToken));
      const exists = issueRefExists(parsed);
      const miss = exists ? '' : ' issue-ref-missing';
      const stale = isIssueRefStale(parsed) ? ' issue-ref-stale' : '';
      const hasLabel = displayLabel != null && displayLabel !== '';
      const inner = hasLabel ? displayLabel : escapeHtml(formatIssueRefDisplay(parsed));
      const linkClass = hasLabel ? 'issue-ref issue-ref-link' : 'issue-ref';
      const token = formatIssueRefToken(parsed);
      const num = parsed.itemId.replace(/^item-/i, '');
      const stepHint = parsed.stepIndex != null
        ? (parsed.focusAnswer ? `, answer ${parsed.stepIndex + 1}` : `, step ${parsed.stepIndex + 1}`)
        : '';
      const staleHint = stale ? ', outdated revision' : '';
      const staleTitle = stale ? ' title="Outdated link — click to open panel, or Shift+click to update"' : '';
      const buttonHtml = `<button type="button" class="${linkClass}${miss}${stale}" data-action="goto-issue" data-issue-ref="${escapeHtml(token)}" aria-label="Go to decision !${escapeHtml(num)}${stepHint}${staleHint}"${staleTitle}>${inner}</button>`;
      if (issueRefPlaceholderStash) {
        const idx = issueRefPlaceholderStash.length;
        issueRefPlaceholderStash.push(buttonHtml);
        return `${REF_PLACEHOLDER_PREFIX}${idx}${REF_PLACEHOLDER_SUFFIX}`;
      }
      return buttonHtml;
    }

    function expandIssueRefPlaceholders(html) {
      if (!issueRefPlaceholderStash?.length) return html;
      return html.replace(
        new RegExp(`${REF_PLACEHOLDER_PREFIX}(\\d+)${REF_PLACEHOLDER_SUFFIX}`, 'g'),
        (_, index) => issueRefPlaceholderStash[Number(index)] ?? '',
      );
    }

    function formatRichText(text) {
      if (!text) return '';
      issueRefPlaceholderStash = [];
      let html = escapeHtml(text);

      // Decision refs (!) before #tags and @people — @v2 in href is a revision pin, not a mention
      html = html.replace(
        /\[([^\]]+)\]\(([!#])(\d+)(?:\/(\d+)|\/a(\d+))?(?:@v(\d+))?\)/g,
        (full, label, _sigil, num, stepNum, answerNum, revisionNum) => {
          const ref = issueRefPartsToToken(num, stepNum, answerNum, revisionNum);
          return parseIssueRef(ref) ? renderIssueRef(ref, label) : full;
        },
      );

      html = html.replace(
        /!(\d+)(?:\/(\d+)|\/a(\d+))?(?:@v(\d+))?/g,
        (full, num, stepNum, answerNum, revisionNum) => {
          const ref = issueRefPartsToToken(num, stepNum, answerNum, revisionNum);
          return parseIssueRef(ref) ? renderIssueRef(ref) : full;
        },
      );

      html = html.replace(
        /#(\d+)(?:\/(\d+)|\/a(\d+))?(?:@v(\d+))?/g,
        (full, num, stepNum, answerNum, revisionNum) => {
          const ref = issueRefPartsToToken(num, stepNum, answerNum, revisionNum);
          return parseIssueRef(ref) ? renderIssueRef(ref) : full;
        },
      );

      html = html.replace(/@(?!v\d+)([\w.-]+)/g, '<span class="mention">@$1</span>');

      html = expandIssueRefPlaceholders(html);
      issueRefPlaceholderStash = null;
      return html;
    }

    function removeMentionMenu() {
      if (mentionMenuEl) {
        mentionMenuEl.remove();
        mentionMenuEl = null;
      }
    }

    function isRefLinkPickerOpen() {
      return !!refLinkPickerEl && !refLinkPickerEl.hidden;
    }

    function refTargetMatchesQuery(haystack, query) {
      if (!query) return true;
      const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
      const h = haystack.toLowerCase();
      return terms.every((term) => h.includes(term));
    }

    function resetRefLinkPickerFilters() {
      refLinkPickerQuery = '';
      refLinkPickerActiveTags = [];
      refLinkPickerKindFilter = 'all';
    }

    function refLinkPickerHasActiveFilters() {
      return refLinkPickerActiveTags.length > 0
        || refLinkPickerKindFilter !== 'all'
        || refLinkPickerQuery.trim().length > 0;
    }

    function refLinkPickerItemPassesTags(item) {
      if (!refLinkPickerActiveTags.length) return true;
      return refLinkPickerActiveTags.every((tag) => item.tags.includes(tag));
    }

    function refLinkPickerRowPassesKind(kind) {
      if (refLinkPickerKindFilter === 'all') return true;
      return kind === refLinkPickerKindFilter;
    }

    function collectRefLinkPickerTags() {
      const counts = new Map();
      for (const item of Object.values(items)) {
        for (const tag of item.tags) {
          counts.set(tag, (counts.get(tag) || 0) + 1);
        }
      }
      return [...counts.entries()].sort((a, b) => {
        if (b[1] !== a[1]) return b[1] - a[1];
        return a[0].localeCompare(b[0]);
      });
    }

    function renderRefLinkPickerTagButton(tag, { count = null } = {}) {
      const pressed = refLinkPickerActiveTags.includes(tag);
      const label = count != null ? `${tag} (${count})` : tag;
      return `<button type="button" class="tag ref-link-picker-tag-btn" style="${tagStyle(tag)}" data-action="ref-picker-toggle-tag" data-tag="${escapeAttr(tag)}" aria-pressed="${pressed ? 'true' : 'false'}">${escapeHtml(label)}</button>`;
    }

    function renderRefLinkPickerFilterChrome() {
      const shell = refLinkPickerEl;
      if (!shell) return;
      const tagStrip = shell.querySelector('#ref-link-picker-tag-strip');
      const clearBtn = shell.querySelector('[data-action="ref-picker-clear-filters"]');
      const meta = shell.querySelector('#ref-link-picker-results-meta');
      if (tagStrip) {
        const tags = collectRefLinkPickerTags();
        tagStrip.innerHTML = tags.length
          ? tags.map(([tag, count]) => renderRefLinkPickerTagButton(tag, { count })).join('')
          : '<span class="ref-link-picker-empty" style="margin:0;text-align:left;font-size:0.75rem">No tags yet</span>';
      }
      shell.querySelectorAll('[data-action="ref-picker-kind"]').forEach((btn) => {
        const kind = btn.dataset.kind;
        btn.setAttribute('aria-pressed', refLinkPickerKindFilter === kind ? 'true' : 'false');
      });
      if (clearBtn) clearBtn.hidden = !refLinkPickerHasActiveFilters();
      if (meta) {
        meta.textContent = meta.dataset.summary || '';
      }
    }

    function toggleRefLinkPickerTag(tag) {
      const idx = refLinkPickerActiveTags.indexOf(tag);
      if (idx >= 0) refLinkPickerActiveTags.splice(idx, 1);
      else refLinkPickerActiveTags.push(tag);
      populateRefLinkPickerResults();
    }

    function syncIssueRefPanelOpenClass() {
      const open = (issueDrawerEl && !issueDrawerEl.hidden) || isRefLinkPickerOpen();
      document.body.classList.toggle('issue-ref-panel-open', open);
    }

    function closeRefLinkPickerPanel() {
      if (refLinkPickerEl) refLinkPickerEl.hidden = true;
      resetRefLinkPickerFilters();
      syncIssueRefPanelOpenClass();
    }

    function cancelRefLinkPicker() {
      closeRefLinkPickerPanel();
      selectionRefPick = null;
      removeMentionMenu();
      const commit = pendingInlineEditCommit;
      pendingInlineEditCommit = null;
      commit?.();
    }

    function ensureRefLinkPickerShell() {
      if (refLinkPickerEl) return refLinkPickerEl;
      refLinkPickerEl = document.createElement('aside');
      refLinkPickerEl.className = 'issue-ref-panel ref-link-picker-panel';
      refLinkPickerEl.hidden = true;
      refLinkPickerEl.setAttribute('role', 'complementary');
      refLinkPickerEl.setAttribute('aria-labelledby', 'ref-link-picker-title');
      refLinkPickerEl.innerHTML = `
          <div class="issue-ref-panel-toolbar">
            <div class="ref-link-picker-heading">
              <span class="issue-ref-panel-title" id="ref-link-picker-title">Link to decision</span>
              <p class="ref-link-picker-selection" id="ref-link-picker-selection"></p>
            </div>
            <button type="button" class="issue-ref-panel-close" data-action="close-ref-link-picker" aria-label="Close">×</button>
          </div>
          <div class="ref-link-picker-search-wrap">
            <input type="search" class="ref-link-picker-search" id="ref-link-picker-search" placeholder="Search words, !id, tags, questions…" autocomplete="off" />
          </div>
          <div class="ref-link-picker-filters">
            <span class="ref-link-picker-filter-label">Filter by tag</span>
            <div class="ref-link-picker-tag-strip" id="ref-link-picker-tag-strip"></div>
            <div class="ref-link-picker-kind-strip">
              <button type="button" class="ref-link-picker-chip-btn" data-action="ref-picker-kind" data-kind="all" aria-pressed="true">All</button>
              <button type="button" class="ref-link-picker-chip-btn" data-action="ref-picker-kind" data-kind="answer" aria-pressed="false">Answers</button>
              <button type="button" class="ref-link-picker-chip-btn" data-action="ref-picker-kind" data-kind="question" aria-pressed="false">Questions</button>
              <button type="button" class="ref-link-picker-chip-btn" data-action="ref-picker-kind" data-kind="card" aria-pressed="false">Whole cards</button>
            </div>
            <div class="ref-link-picker-filter-actions">
              <span class="ref-link-picker-filter-label" style="margin:0">Click tags in results too</span>
              <button type="button" class="ref-link-picker-clear-filters" data-action="ref-picker-clear-filters" hidden>Clear filters</button>
            </div>
          </div>
          <div class="ref-link-picker-results-meta" id="ref-link-picker-results-meta"></div>
          <div class="issue-ref-panel-body ref-link-picker-body" id="ref-link-picker-results"></div>
      `;
      refLinkPickerEl.querySelector('#ref-link-picker-search').addEventListener('input', (e) => {
        refLinkPickerQuery = e.target.value;
        populateRefLinkPickerResults();
      });
      refLinkPickerEl.querySelector('#ref-link-picker-search').addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          e.preventDefault();
          e.stopPropagation();
          cancelRefLinkPicker();
        }
      });
      document.getElementById('app-body').appendChild(refLinkPickerEl);
      return refLinkPickerEl;
    }

    function renderRefLinkPickerRow(refToken, kind, idLabel, questionText, answerText) {
      const answerHtml = answerText?.trim()
        ? `<div class="ref-link-picker-preview-a">${escapeHtml(truncateLabel(answerText, 220))}</div>`
        : `<div class="ref-link-picker-preview-a is-empty">No answer yet</div>`;
      const qHtml = questionText?.trim()
        ? `<div class="ref-link-picker-preview-q">${escapeHtml(truncateLabel(questionText, 200))}</div>`
        : '';
      const kindLabel = kind === 'card' ? 'Whole card' : kind === 'question' ? 'Question' : 'Answer';
      return `<button type="button" class="ref-link-picker-row" data-action="pick-ref-target" data-ref-token="${escapeAttr(refToken)}">
        <div class="ref-link-picker-row-meta">
          <span class="ref-link-picker-id">${escapeHtml(idLabel)}</span>
          <span class="ref-link-picker-kind">${kindLabel}</span>
        </div>
        <div class="ref-link-picker-preview">${qHtml}${kind === 'question' ? '' : answerHtml}</div>
      </button>`;
    }

    function populateRefLinkPickerResults() {
      const root = document.getElementById('ref-link-picker-results');
      if (!root) return;
      const q = refLinkPickerQuery.trim();
      const groups = [];
      let rowCount = 0;
