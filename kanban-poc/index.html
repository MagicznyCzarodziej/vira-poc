        surface.scrollLeft = canvasViewport.scrollLeft;
        surface.scrollTop = canvasViewport.scrollTop;
        canvasScrollSyncing = false;
      }
      canvasViewportUserSet = true;
      scheduleCanvasShellOverlayUpdate();
      scheduleSaveState();
    }

    function bindCanvasSurfaceWheel(surface) {
      if (surface.dataset.wheelBound) return;
      surface.dataset.wheelBound = '1';
      surface.addEventListener('wheel', onCanvasWheel, { passive: false });
      surface.addEventListener('scroll', onCanvasSurfaceScroll, { passive: true });
      if (!surface.dataset.resizeBound) {
        surface.dataset.resizeBound = '1';
        new ResizeObserver(() => {
          if (canvasPanState) return;
          applyCanvasScrollLayout();
        }).observe(surface);
      }
    }

    function applyCanvasViewport() {
      const surface = canvasSurfaceEl();
      if (!surface) return;
      bindCanvasSurfaceWheel(surface);
      requestAnimationFrame(() => {
        if (applyCanvasViewportLock(surface)) {
          updateCanvasZoomControlLabel();
          updateCanvasFakeScrollbars();
          requestAnimationFrame(() => {
            syncCanvasSurfaceScrollImmediate(surface);
            updateCanvasFakeScrollbars();
          });
          return;
        }
        applyCanvasScrollLayout();
        if (!canvasViewportInitialized && !canvasViewportUserSet) {
          centerCanvasViewport(surface);
        }
        canvasViewportInitialized = true;
        updateCanvasZoomControlLabel();
        updateCanvasFakeScrollbars();
      });
    }

    function canvasSpawnPreviewItem() {
      return {
        id: 'item-new',
        tags: [],
        archivedAt: null,
        steps: [normalizeStep({ problem: 'New decision', answer: null })],
      };
    }

    function prepareCanvasSpawnDragGhost() {
      if (!canvasSpawnDragGhostEl) {
        canvasSpawnDragGhostEl = document.createElement('div');
        canvasSpawnDragGhostEl.className = 'canvas-spawn-drag-ghost';
        canvasSpawnDragGhostEl.setAttribute('aria-hidden', 'true');
        document.body.appendChild(canvasSpawnDragGhostEl);

      canvasSpawnDragGhostEl.innerHTML = renderCard(canvasSpawnPreviewItem(), { idPrefix: CANVAS_CARD_ID_PREFIX });

    function renderCanvasSpawnControlHtml() {

        </div>

    function migrateCanvasPlacementsToCenteredWorld() {
      const positions = Object.values(canvasPlacements);
      if (!positions.length) return;
      const maxX = Math.max(...positions.map((p) => p.x));
      const maxY = Math.max(...positions.map((p) => p.y));
      if (maxX > CANVAS_WORLD_MIN_W * 0.35) return;
      const shiftX = Math.round(CANVAS_WORLD_MIN_W / 2 - 480);
      const shiftY = Math.round(CANVAS_WORLD_MIN_H / 2 - 360);
      for (const id of Object.keys(canvasPlacements)) {
        canvasPlacements[id] = {
          x: canvasPlacements[id].x + shiftX,
          y: canvasPlacements[id].y + shiftY,
        };
      }
    }

    function canvasTypingFocus() {
      const el = document.activeElement;
      if (!el) return false;
      if (el.matches('textarea, input, select, [contenteditable="true"]')) return true;
      return !!el.closest('[contenteditable="true"]');
    }

    function syncCanvasHotspot(clientX, clientY) {
      if (viewMode !== 'list') {
        canvasHotspot.over = false;
        return;
      }
      const surface = canvasSurfaceEl();
      if (!surface) {
        canvasHotspot.over = false;
        return;
      }
      const r = surface.getBoundingClientRect();
      const inside = clientX >= r.left && clientX <= r.right
        && clientY >= r.top && clientY <= r.bottom;
      canvasHotspot.over = inside;
      if (inside) {
        canvasHotspot.x = clientX;
        canvasHotspot.y = clientY;
      }
    }

    function canvasClientPointAtViewportCenter() {
      const surface = canvasSurfaceEl();
      if (!surface) return null;
      const r = surface.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }

    function createNewCardOnList() {
      if (viewMode !== 'list') return;

      scheduleSaveState();
      render();
      scrollListToItem(id);
    }

    function createNewCardOnCanvasAtClient(clientX, clientY) {
      if (viewMode !== 'list' || !canvasSurfaceEl()) return;
      const id = createItem({ problem: 'New decision' });
      if (!id) return;
      pendingFocus = { id, field: 'problem', step: 0, canvas: true };
      placeCardOnCanvas(id, clientX, clientY);
      popCanvasPlacedCard(id);
    }

    function createCardOnCanvasAtPointer() {
      if (!canvasHotspot.over || viewMode !== 'list' || !canvasSurfaceEl()) return;
      createNewCardOnCanvasAtClient(canvasHotspot.x, canvasHotspot.y);
    }

    function canvasWorldExtent() {
      return { w: CANVAS_WORLD_MIN_W, h: CANVAS_WORLD_MIN_H };
    }

    function clampAllCanvasPlacementsToWorld() {
      const { w, h } = canvasWorldExtent();
      for (const id of Object.keys(canvasPlacements)) {
        const p = canvasPlacements[id];
        if (!p) continue;
        p.x = Math.max(8, Math.min(p.x, w - CANVAS_CARD_WIDTH - 8));
        p.y = Math.max(8, Math.min(p.y, h - 120));
      }
    }

    function endCanvasSpawnDragSession() {
      if (!canvasSpawnDragActive) return;
      canvasSpawnDragActive = false;
      render();
    }

    function saveActiveFieldEditWithoutRender() {
      const el = document.activeElement;
      if (!el?.matches('textarea.inline-input, textarea[data-followup-input], input.inline-input.single, textarea[data-composer-input]')) {
        return;
      }
      lockCanvasViewportFromSurface();
      removeMentionMenu();
      pendingInlineEditCommit = null;

      if (el.matches('textarea[data-composer-input]')) {
        scheduleSaveState();
        return;
      }

      if (el.matches('[data-followup-input]')) {
        followupDrafts[el.dataset.id] = el.value;
        scheduleSaveState();
        return;
      }

      if (el.matches('input.inline-input.single')) {
        const editable = el.closest('[data-editable]');
        const id = editable?.dataset.id;
        if (id && items[id]) items[id].tags = parseTags(el.value);
        scheduleSaveState();
        return;
      }

      inlineEditCommitByTa.delete(el);
      consumeTrailingHashTag(el);
      const id = el.dataset.refItemId;
      const field = el.dataset.refField;
      const stepIndex = Number(el.dataset.refStep);
      const step = items[id]?.steps[stepIndex];
      if (!step) return;
      const val = el.value.trim();
      const isProblem = field === 'problem';
      if (isProblem) {
        if (val) recordProblemEdit(step, val);
      } else if (val) {
        recordAnswerEdit(step, val);
      } else {
        step.answer = null;
        step.decidedAt = null;
        step.answerTentative = false;
      }
      scheduleSaveState();
    }

    function prepareCanvasSpawnDragPointer() {
      canvasSpawnPointerActive = true;
      saveActiveFieldEditWithoutRender();
    }

    function activeInlineFieldEdit() {
      const el = document.activeElement;
      if (!el?.matches('textarea.inline-input, textarea[data-followup-input], input.inline-input.single')) return null;
      if (el.closest('.canvas-placed-card, .workspace-list, .issue-ref-panel-body')) return el;
      return null;
    }

    function shouldFlushCanvasFieldEditForTarget(target) {
      if (target.closest('[data-canvas-spawn]')) return false;
      const ta = activeInlineFieldEdit();
      if (!ta) return false;
      if (ta === target || ta.contains(target)) return false;
      if (mentionMenuEl?.contains(target)) return false;
      if (selectionRefToolbarEl?.contains(target)) return false;
      return true;
    }

    function noteEditableSwitchFromTarget(target, activeEl) {
      if (!activeEl?.matches('textarea.inline-input, input.inline-input.single, [data-followup-input]')) return;

      const followup = target.closest('[data-followup-input]');
      if (followup) {
        if (followup === activeEl) return;
        pendingFollowupFocus = {
          id: followup.dataset.id,
          ...editSurfaceFromElement(followup),
        };
        return;
      }

      const editable = target.closest('[data-editable]');
      if (!editable || editable.closest('.issue-ref-panel-body')) return;
      if (target.closest('[data-action]')) return;
      if (target.closest('textarea, input') && editable.contains(target)) {
        if (activeEl.closest('[data-editable]') === editable || activeEl === target) return;
      }

      const activeEditable = activeEl.closest('[data-editable]');
      const sameField = !activeEl.matches('[data-followup-input]')
        && activeEditable === editable;
      if (sameField) return;

      const surface = editSurfaceFromElement(editable);
      const step = editable.dataset.editable === 'tags' ? 0 : Number(editable.dataset.step);
      const id = editable.dataset.id;
      const field = editable.dataset.editable;
      if (surface.canvas) {
        pendingFocus = {
          id,
          field,
          step,
          panel: false,
          canvas: true,
        };
        return;
      }
      pendingEditableHandoff = {
        id,
        field,
        step,
        panel: !!surface.panel,
        canvas: false,
      };
    }

    function flushActiveCanvasFieldEditForPointer(target) {
      if (!shouldFlushCanvasFieldEditForTarget(target)) return false;
      const ta = activeInlineFieldEdit();
      if (!ta) return false;
      noteEditableSwitchFromTarget(target, ta);
      lockCanvasViewportFromSurface();
      if (ta.matches('input.inline-input.single')) {
        removeMentionMenu();
        const editable = ta.closest('[data-editable]');
        const id = editable?.dataset.id;
        if (id && items[id]) items[id].tags = parseTags(ta.value);
        render();
        return true;
      }
      if (ta.matches('[data-followup-input]')) {
        if (ta.value.trim()) {
          tryCommitFollowupField(ta);
        } else {
          removeMentionMenu();
          if (pendingFocus || pendingEditableHandoff || pendingFollowupFocus) {
            render();
          } else {
            ta.blur();
          }
        }
        return true;
      }
      removeMentionMenu();
      pendingInlineEditCommit = null;
      const commit = inlineEditCommitByTa.get(ta);
      if (commit) commit();
      else ta.blur();
      return true;
    }

    function tryStartCanvasPan(e) {
      if (viewMode !== 'list') return false;
      const surface = e.target.closest('[data-canvas-surface]');
      if (!surface) return false;
      const onCard = e.target.closest('.canvas-placed-card');
      const middle = e.button === 1;
      const spacePan = canvasSpaceHeld && e.button === 0;
      const backgroundPan = e.button === 0 && !onCard;
      if (backgroundPan && flushActiveCanvasFieldEditForPointer(e.target)) return false;
      if (!middle && !spacePan && !backgroundPan) return false;
      if (canvasPointerState || canvasPanState) return false;

      canvasPanState = {
        surface,
        pointerId: e.pointerId,
        startX: e.clientX,
        startY: e.clientY,
        startScrollLeft: surface.scrollLeft,
        startScrollTop: surface.scrollTop,
      };
      surface.classList.add('is-panning');
      surface.setPointerCapture(e.pointerId);
      e.preventDefault();
      return true;
    }

    function endCanvasPan(e) {
      const pan = canvasPanState;
      if (!pan || e.pointerId !== pan.pointerId) return false;
      pan.surface.classList.remove('is-panning');
      canvasPanState = null;
      canvasViewportUserSet = true;
      scheduleSaveState();
      return true;
    }

    function canvasPointFromClient(surface, clientX, clientY) {
      const rect = surface.getBoundingClientRect();
      const mx = clientX - rect.left;
      const my = clientY - rect.top;
      const world = canvasWorldEl();
      const { padX, padY } = canvasWorldPadding(surface, world);
      const zoom = canvasViewport.zoom;
      return {
        x: (surface.scrollLeft + mx - padX) / zoom,
        y: (surface.scrollTop + my - padY) / zoom,
      };
    }

    function clampCanvasPlacement(x, y) {
      const { w, h } = canvasWorldExtent();
      return {
        x: Math.max(8, Math.min(Math.round(x), w - CANVAS_CARD_WIDTH - 8)),
        y: Math.max(8, Math.min(Math.round(y), h - 120)),
      };
    }

    function placeCardOnCanvas(itemId, clientX, clientY) {
      const surface = canvasSurfaceEl();
      if (!surface || !items[itemId]) return;
      const pt = canvasPointFromClient(surface, clientX, clientY);
      const pos = clampCanvasPlacement(
        pt.x - CANVAS_CARD_WIDTH / 2,
        pt.y - CANVAS_DROP_OFFSET_Y,
      );
      canvasPlacements[itemId] = pos;
      ensureCanvasPlacementOrder(itemId);
      canvasAssignOrderAtFront(itemId);
      scheduleSaveState();
      render();
    }

    function renderCanvasPlacedCard(item, pos, layerIndex) {
      return `
        <div class="canvas-placed-card" data-canvas-placed="${escapeAttr(item.id)}" style="left:${pos.x}px;top:${pos.y}px;z-index:${layerIndex}">
          ${renderCard(item, { idPrefix: CANVAS_CARD_ID_PREFIX })}
        </div>
      `;
    }

    function editSurfaceFromElement(el) {
      return {

        canvas: !!el?.closest('.canvas-placed-card'),
      };
    }

    function editableHostForItem(app, itemId, { panel = false, canvas = false } = {}) {
      const root = app || document.getElementById('app');
      if (!root) return null;
      if (panel) return root.querySelector('.issue-ref-panel-body') || root;
      if (canvas) {
        const placed = root.querySelector(`.canvas-placed-card[data-canvas-placed="${itemId}"]`);
        if (placed) return placed;
      }
      return root.querySelector('.workspace-list') || root;
    }

    function findEditableField(app, { id, field, step = 0, panel = false, canvas = false }) {
      const host = editableHostForItem(app, id, { panel, canvas });
      if (!host) return null;
      if (field === 'tags') return host.querySelector(`[data-editable="tags"][data-id="${id}"]`);
      return host.querySelector(`[data-editable="${field}"][data-id="${id}"][data-step="${step}"]`);
    }

    function findFollowupInput(app, { id, panel = false, canvas = false }) {
      const host = editableHostForItem(app, id, { panel, canvas });
      return host?.querySelector(`[data-followup-input][data-id="${id}"]`) || null;
    }

    function renderCanvasSurfaceHtml() {
      const sortedIds = canvasPlacementsSortedIds();
      const placed = sortedIds
        .filter((id) => items[id] && !isItemArchived(items[id]))
        .map((id, i) => renderCanvasPlacedCard(items[id], canvasPlacements[id], i + 1))
        .join('');
      const hint = placed
        ? ''
        : '<p class="canvas-hint">Drag cards from the list · C with pointer on canvas for a new card · Space+drag to pan · pinch or ⌘/Ctrl+scroll to zoom</p>';
      const { w, h } = canvasWorldExtent();
      return `
        <div class="spatial-canvas" data-canvas-surface role="region" aria-label="Decision canvas">
          <div class="canvas-scroll-content" data-canvas-scroll-content>
            <div class="canvas-world" style="width:${w}px;height:${h}px">

    function renderCanvasFrameHtml() {
      return `
        <div class="canvas-frame" data-canvas-frame>

            ${renderCanvasSurfaceHtml()}
            <svg class="canvas-ref-links" data-canvas-ref-links aria-hidden="true"></svg>

                <div class="canvas-fake-scrollbar-track" data-canvas-scrollbar-v-track>
                  <div class="canvas-fake-scrollbar-thumb" data-canvas-scrollbar-v-thumb></div>
                </div>
              </div>
              <div class="canvas-fake-scrollbar canvas-fake-scrollbar--h" data-canvas-scrollbar-h hidden>
                <div class="canvas-fake-scrollbar-track" data-canvas-scrollbar-h-track>
                  <div class="canvas-fake-scrollbar-thumb" data-canvas-scrollbar-h-thumb></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    /** @type {{ anchorId: string, targetId: string } | null} */
    let canvasRefLinkHover = null;
    /** @type {{ id: string, surface: string } | null} */
    let workspaceLinkHover = null;

    function clearWorkspaceListCanvasHover() {
      workspaceLinkHover = null;
      document.querySelectorAll('.is-workspace-link-hover').forEach((el) => {
        el.classList.remove('is-workspace-link-hover');
      });
    }

    function clearWorkspaceLinkHover() {
      clearCanvasRefLinkHover();
      clearWorkspaceListCanvasHover();
    }

    function canvasRefLinksSvgEl() {
      return document.querySelector('[data-canvas-frame] [data-canvas-ref-links]');
    }

    function clientRectBorderToward(rect, targetX, targetY) {
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      let dx = targetX - cx;
      let dy = targetY - cy;
      const len = Math.hypot(dx, dy);
      if (len < 1e-6) return { x: cx, y: cy };
      dx /= len;
      dy /= len;
      const hw = rect.width / 2;
      const hh = rect.height / 2;
      const t = Math.min(
        Math.abs(dx) > 1e-9 ? hw / Math.abs(dx) : Infinity,
        Math.abs(dy) > 1e-9 ? hh / Math.abs(dy) : Infinity,
      );
      return { x: cx + dx * t, y: cy + dy * t };
    }

    function clearCanvasRefLinkHover() {
      canvasRefLinkHover = null;
      canvasRefLinksSvgEl()?.replaceChildren();
    }

    function updateCanvasRefLinkLines(anchorId, targetId) {
      const svg = canvasRefLinksSvgEl();
      const surface = canvasSurfaceEl();
      const world = canvasWorldEl();
      if (!svg || !surface || !world) return;
      svg.replaceChildren();
      if (!targetId || !canvasPlacements[anchorId] || !canvasPlacements[targetId]) return;
      const anchorEl = world.querySelector(`[data-canvas-placed="${anchorId}"]`);
      const targetEl = world.querySelector(`[data-canvas-placed="${targetId}"]`);
      if (!anchorEl || !targetEl) return;
      const viewportRect = surface.getBoundingClientRect();
      if (viewportRect.width <= 0 || viewportRect.height <= 0) return;
      svg.setAttribute('width', String(viewportRect.width));
      svg.setAttribute('height', String(viewportRect.height));
      svg.setAttribute('viewBox', `0 0 ${viewportRect.width} ${viewportRect.height}`);
      const anchorRect = anchorEl.getBoundingClientRect();
      const targetRect = targetEl.getBoundingClientRect();
      const anchorCx = anchorRect.left + anchorRect.width / 2;
      const anchorCy = anchorRect.top + anchorRect.height / 2;
      const targetCx = targetRect.left + targetRect.width / 2;
      const targetCy = targetRect.top + targetRect.height / 2;
      const start = clientRectBorderToward(anchorRect, targetCx, targetCy);
      const end = clientRectBorderToward(targetRect, anchorCx, anchorCy);
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', String(start.x - viewportRect.left));
      line.setAttribute('y1', String(start.y - viewportRect.top));
      line.setAttribute('x2', String(end.x - viewportRect.left));
      line.setAttribute('y2', String(end.y - viewportRect.top));
      svg.appendChild(line);
    }

    function updateCanvasRefLinkLinesIfHover() {
      if (!canvasRefLinkHover) return;
      updateCanvasRefLinkLines(canvasRefLinkHover.anchorId, canvasRefLinkHover.targetId);
    }

    function applyWorkspaceListCanvasHover(link) {
      if (!link?.id || !canvasPlacements[link.id]) {
        clearWorkspaceListCanvasHover();
        return;
      }
      if (
        workspaceLinkHover
        && workspaceLinkHover.id === link.id
        && workspaceLinkHover.surface === link.surface
      ) {
        return;
      }
      clearWorkspaceListCanvasHover();
      workspaceLinkHover = { id: link.id, surface: link.surface };
      const app = document.getElementById('app');
      if (!app) return;
      const peerSelector = link.surface === 'list'
        ? `.canvas-placed-card[data-canvas-placed="${link.id}"]`
        : `.workspace-list .list-cards .card[data-id="${link.id}"]`;
      app.querySelector(peerSelector)?.classList.add('is-workspace-link-hover');
    }

    function applyCanvasRefLinkHover(anchorId, targetId) {
      if (!anchorId || !targetId || anchorId === targetId || viewMode !== 'list') {
        clearCanvasRefLinkHover();
        return;
      }
      if (
        canvasRefLinkHover
        && canvasRefLinkHover.anchorId === anchorId
        && canvasRefLinkHover.targetId === targetId
      ) {
        return;
      }
      canvasRefLinkHover = { anchorId, targetId };
      updateCanvasRefLinkLines(anchorId, targetId);
    }

    function workspaceLinkFromNode(node) {
      if (!node?.closest) return null;
      const listCard = node.closest('.workspace-list .list-cards .card[data-id]');
      if (listCard) return { id: listCard.dataset.id, surface: 'list' };
      const canvasWrap = node.closest('.canvas-placed-card[data-canvas-placed]');
      if (canvasWrap) return { id: canvasWrap.dataset.canvasPlaced, surface: 'canvas' };
      return null;
    }

    function workspaceLinkItemIdFromNode(node) {
      return workspaceLinkFromNode(node)?.id ?? null;
    }

    function bindCanvasInteractions() {
      if (canvasInteractionsBound) return;
      canvasInteractionsBound = true;
      const app = document.getElementById('app');

      app.addEventListener(
        'pointerdown',
        (e) => {
          if (e.target.closest('[data-canvas-scrollbar-v-thumb], [data-canvas-scrollbar-v-track]')) {
            canvasFakeScrollbarDragStart('v', e);
            return;
          }
          if (e.target.closest('[data-canvas-scrollbar-h-thumb], [data-canvas-scrollbar-h-track]')) {
            canvasFakeScrollbarDragStart('h', e);
          }
        },
        true,
      );

      app.addEventListener(
        'pointermove',
        (e) => {
          if (canvasFakeScrollbarDrag) canvasFakeScrollbarDragMove(e);
        },
        true,
      );

      app.addEventListener('pointerup', canvasFakeScrollbarDragEnd, true);
      app.addEventListener('pointercancel', canvasFakeScrollbarDragEnd, true);

      app.addEventListener('mouseover', (e) => {
        if (viewMode !== 'list') return;
        const refBtn = e.target.closest('[data-action="goto-issue"][data-issue-ref]');
        if (refBtn) {
          clearWorkspaceListCanvasHover();
          const from = workspaceLinkFromNode(refBtn);
          const parsed = parseIssueRef(refBtn.dataset.issueRef);
          if (from && parsed?.itemId) {
            applyCanvasRefLinkHover(from.id, parsed.itemId);
          } else {
            clearCanvasRefLinkHover();
          }
          return;
        }
        clearCanvasRefLinkHover();
        const link = workspaceLinkFromNode(e.target);
        if (!link) {
          clearWorkspaceListCanvasHover();
          return;
        }
        applyWorkspaceListCanvasHover(link);
      });

      app.addEventListener('mouseout', (e) => {
        if (viewMode !== 'list') return;
        if (canvasRefLinkHover && e.target.closest('[data-action="goto-issue"]')) {
          if (!e.relatedTarget?.closest('[data-action="goto-issue"]')) {
            clearCanvasRefLinkHover();
          }
        }
        if (!workspaceLinkHover) return;
        const from = workspaceLinkFromNode(e.target);
        if (!from || from.id !== workspaceLinkHover.id || from.surface !== workspaceLinkHover.surface) return;
        const to = e.relatedTarget ? workspaceLinkFromNode(e.relatedTarget) : null;
        if (to?.id === workspaceLinkHover.id) return;
        clearWorkspaceListCanvasHover();
      });

      let listDragBlockedPointer = null;

      const endListDragBlocked = (e) => {
        if (!listDragBlockedPointer || e.pointerId !== listDragBlockedPointer.pointerId) return;
        listDragBlockedPointer.card?.classList.remove('is-list-drag-blocked');
        listDragBlockedPointer = null;
        document.body.classList.remove('canvas-list-drag-blocked-active');
      };

      app.addEventListener(
        'pointerdown',
        (e) => {
          if (e.button !== 0) return;
          const card = e.target.closest('.workspace-list .list-cards .card.canvas-list-drag-blocked');
          if (!card) return;
          listDragBlockedPointer = {
            pointerId: e.pointerId,
            startX: e.clientX,
            startY: e.clientY,
            card,
            dragging: false,
          };
        },
        true,
      );

      app.addEventListener(
        'pointermove',
        (e) => {
          const state = listDragBlockedPointer;
          if (!state || e.pointerId !== state.pointerId) return;
          if (state.dragging) return;
          const dx = e.clientX - state.startX;
          const dy = e.clientY - state.startY;
          if (dx * dx + dy * dy <= 9) return;
          state.dragging = true;
          state.card.classList.add('is-list-drag-blocked');
          document.body.classList.add('canvas-list-drag-blocked-active');
          const itemId = state.card.dataset.id;
          if (itemId) centerCanvasViewportOnCard(itemId);
          e.preventDefault();
        },
        true,
      );

      app.addEventListener('pointerup', endListDragBlocked, true);
      app.addEventListener('pointercancel', endListDragBlocked, true);

      app.addEventListener('selectstart', (e) => {
        if (e.target.closest('.workspace-list .list-cards .card.canvas-list-drag-blocked.is-list-drag-blocked')) {
          e.preventDefault();
        }
      });

      app.addEventListener('dragstart', (e) => {
        const spawn = e.target.closest('[data-canvas-spawn]');
        if (spawn) {
          canvasSpawnDragActive = true;
          canvasSpawnPointerActive = false;
          e.dataTransfer.setData('text/plain', CANVAS_SPAWN_DRAG_TYPE);
          e.dataTransfer.effectAllowed = 'copy';
          setCanvasSpawnDragImage(e);
          return;
        }
        const source = e.target.closest('[data-canvas-drag-id]');
        if (!source) return;
        if (e.target.closest('textarea, input, button, [data-editable], [contenteditable="true"]')) {
          e.preventDefault();
          return;
        }
        const id = source.dataset.canvasDragId;
        if (!id || canvasPlacements[id]) {
          e.preventDefault();
          return;
        }
        e.dataTransfer.setData('text/plain', id);
        e.dataTransfer.effectAllowed = 'copyMove';
        if (source.hasAttribute('aria-grabbed')) source.setAttribute('aria-grabbed', 'true');
      });

      app.addEventListener('dragend', (e) => {
        if (e.target.closest('[data-canvas-spawn]')) {
          canvasSpawnSuppressClickUntil = Date.now() + 400;
          endCanvasSpawnDragSession();
        }
        const source = e.target.closest('[data-canvas-drag-id]');
        if (source?.hasAttribute('aria-grabbed')) source.setAttribute('aria-grabbed', 'false');
      });

      app.addEventListener('dragover', (e) => {
        const onList = e.target.closest('.workspace-list');
        const onCanvas = e.target.closest('[data-canvas-surface]');
        if (!onList && !onCanvas) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
      });

      app.addEventListener('drop', (e) => {
        const payload = e.dataTransfer.getData('text/plain');
        if (payload === CANVAS_SPAWN_DRAG_TYPE) {
          if (e.target.closest('.workspace-list')) {
            e.preventDefault();
            createNewCardOnList();
            return;
          }
          const surface = e.target.closest('[data-canvas-surface]');
          if (!surface) return;
          e.preventDefault();
          createNewCardOnCanvasAtClient(e.clientX, e.clientY);
          return;
        }
        const surface = e.target.closest('[data-canvas-surface]');
        if (!surface) return;
        e.preventDefault();
        if (payload && items[payload]) placeCardOnCanvas(payload, e.clientX, e.clientY);
      });

      app.addEventListener('auxclick', (e) => {
        if (e.button === 1 && e.target.closest('[data-canvas-surface]')) e.preventDefault();
      });

      app.addEventListener('pointerdown', (e) => {
        if (tryStartCanvasPan(e)) return;
        if (e.button !== 0) return;
        if (canvasSpaceHeld) return;
        const placed = e.target.closest('.canvas-placed-card');
        if (!placed) return;
        if (e.target.closest('[data-action], [data-followup-input], textarea.inline-input, input.inline-input.single')) {
          return;
        }
        const id = placed.dataset.canvasPlaced;
        if (!id || !canvasPlacements[id]) return;
        const surface = canvasSurfaceEl();
        if (!surface) return;
        const pt = canvasPointFromClient(surface, e.clientX, e.clientY);
        canvasPointerState = {
          placed,
          id,
          pointerId: e.pointerId,
          offX: pt.x - canvasPlacements[id].x,
          offY: pt.y - canvasPlacements[id].y,
          startX: e.clientX,
          startY: e.clientY,
          dragging: false,
        };
      }, true);

      app.addEventListener('pointermove', (e) => {
        const pan = canvasPanState;
        if (pan && e.pointerId === pan.pointerId) {
          e.preventDefault();
          pan.surface.scrollLeft = pan.startScrollLeft - (e.clientX - pan.startX);
          pan.surface.scrollTop = pan.startScrollTop - (e.clientY - pan.startY);
          canvasViewport.scrollLeft = pan.surface.scrollLeft;
          canvasViewport.scrollTop = pan.surface.scrollTop;
          clampCanvasViewportScroll(pan.surface);
          pan.surface.scrollLeft = canvasViewport.scrollLeft;
          pan.surface.scrollTop = canvasViewport.scrollTop;
          canvasViewportUserSet = true;
          scheduleCanvasShellOverlayUpdate();
          return;
        }
        const state = canvasPointerState;
        if (!state || e.pointerId !== state.pointerId) return;
        if (!state.dragging) {
          const dx = e.clientX - state.startX;
          const dy = e.clientY - state.startY;
          if (dx * dx + dy * dy <= 16) return;
          state.dragging = true;
          state.placed.classList.add('is-dragging');
          state.placed.setPointerCapture(e.pointerId);
          if (canvasPlacements[state.id]) {
            canvasAssignOrderAtFront(state.id);
            const world = canvasWorldEl();
            if (world) {
              canvasPlacementsSortedIds().forEach((cid, i) => {
                const el = world.querySelector(`[data-canvas-placed="${cid}"]`);
                if (el) el.style.zIndex = String(i + 1);
              });
            }
          }
        }
        e.preventDefault();
        const surface = canvasSurfaceEl();
        if (!surface) return;
        const pt = canvasPointFromClient(surface, e.clientX, e.clientY);
        canvasPlacements[state.id] = clampCanvasPlacement(
          pt.x - state.offX,
          pt.y - state.offY,
        );
        state.placed.style.left = `${canvasPlacements[state.id].x}px`;
        state.placed.style.top = `${canvasPlacements[state.id].y}px`;
        scheduleCanvasShellOverlayUpdate();
      }, true);

      const endCanvasPointer = (e) => {
        if (endCanvasPan(e)) return;
        const state = canvasPointerState;
        if (!state || e.pointerId !== state.pointerId) return;
        if (state.dragging) {
          e.preventDefault();
          canvasSuppressClickUntil = Date.now() + 350;
          state.placed.classList.remove('is-dragging');
          scheduleSaveState();
        }
        clearWorkspaceLinkHover();
        canvasPointerState = null;
      };
      app.addEventListener('pointerup', endCanvasPointer, true);
      app.addEventListener('pointercancel', endCanvasPointer, true);

      app.addEventListener('click', (e) => {
        if (Date.now() < canvasSuppressClickUntil && e.target.closest('.canvas-placed-card')) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);

      window.addEventListener('pointermove', (e) => {
        syncCanvasHotspot(e.clientX, e.clientY);
      }, { passive: true });

      window.addEventListener('keydown', (e) => {
        if ((e.key === 'c' || e.key === 'C') && !e.repeat
          && !e.metaKey && !e.ctrlKey && !e.altKey) {
          if (canvasTypingFocus() || isRefLinkPickerOpen()) return;
          if (viewMode !== 'list' || !canvasSurfaceEl() || !canvasHotspot.over) return;
          e.preventDefault();
          createCardOnCanvasAtPointer();
          return;
        }
        if (e.code !== 'Space' || e.repeat) return;
        if (canvasTypingFocus()) return;
        if (viewMode !== 'list' || !canvasSurfaceEl()) return;
        canvasSpaceHeld = true;
        document.body.classList.add('canvas-space-pan');
        e.preventDefault();
      });

      window.addEventListener('keyup', (e) => {
        if (e.code !== 'Space') return;
        canvasSpaceHeld = false;
        document.body.classList.remove('canvas-space-pan');
      });

      window.addEventListener('blur', () => {
        canvasSpaceHeld = false;
        document.body.classList.remove('canvas-space-pan');
      });
    }

    function composerTagChipsHtml() {
      return itemTagChipsHtml(composerPendingTags);
    }

    function syncComposerTagsRow() {
      const row = document.querySelector('[data-composer-tags-row]');
      if (!row) return;
      const chips = composerTagChipsHtml();
      if (!chips) {
        row.hidden = true;
        row.replaceChildren();
        return;
      }
      row.hidden = false;
      row.innerHTML = `<span class="tags-row-tags">${chips}</span>`;
    }

    function renderComposerHtml() {
      const chips = composerTagChipsHtml();
      const tagsRow = chips
        ? `<div class="composer-tags-row tags-row" data-composer-tags-row><span class="tags-row-tags">${chips}</span></div>`
        : '<div class="composer-tags-row tags-row" data-composer-tags-row hidden></div>';
      return `
        <div class="composer" data-composer="root">
          ${tagsRow}
          <textarea placeholder="Type anything, @mention, !reference, #tag" autofocus data-composer-input></textarea>
        </div>
      `;
    }

    function commitFollowup(itemId, text, { inPanel = false, ta = null, focusAnswer = true } = {}) {
      if (ta) consumeTrailingHashTag(ta);
      const trimmed = (ta ? ta.value : text).trim();
      if (!trimmed || !items[itemId]) return;
      addStep(itemId, trimmed);
      delete followupDrafts[itemId];
      if (focusAnswer) {
        const stepIndex = items[itemId].steps.length - 1;
        const inCanvas = !!ta?.closest('.canvas-placed-card');
        pendingFocus = {
          id: itemId,
          field: 'answer',
          step: stepIndex,
          panel: inPanel,
          canvas: inCanvas && !inPanel,
        };
      }
      render();
    }

    function tryCommitFollowupField(followup) {
      if (!followup?.matches('[data-followup-input]')) return;
      if (!document.body.contains(followup)) return;
      if (!followup.value.trim()) return;
      lockCanvasViewportFromSurface();
      commitFollowup(followup.dataset.id, followup.value, {
        inPanel: !!followup.closest('.issue-ref-panel-body'),
        ta: followup,
        focusAnswer: !pendingEditableHandoff && !pendingFocus,
      });
    }

    function finishEditableHandoff(root = document.getElementById('app')) {
      if (!pendingEditableHandoff || !root) return;
      const h = pendingEditableHandoff;
      pendingEditableHandoff = null;
      const el = findEditableField(root, {
        id: h.id,
        field: h.field,
        step: h.step,
        panel: !!h.panel,
        canvas: !!h.canvas,
      });
      if (el) startInlineEdit(el, h.field, h.id, h.step);
    }

    function renderTagsHtml(item, { readOnly = false } = {}) {
      const num = item.id.replace(/^item-/i, '');
      const chips = itemTagChipsHtml(item.tags);
      const editAttrs = readOnly ? '' : ` data-editable="tags" data-id="${item.id}"`;
      const tagsInner = chips
        ? `<span class="tags-row-tags">${chips}</span>`
        : (readOnly ? '' : '<span class="tags-add">Tags</span>');
      const tagsBlock = readOnly
        ? tagsInner
        : `<div class="tags-row-edit"${editAttrs}>${tagsInner}</div>`;
      return `
        <div class="tags-row" aria-label="Decision !${escapeAttr(num)}">
          <button type="button" class="card-id" data-action="open-card-history" data-id="${escapeAttr(item.id)}" aria-label="Open card history for !${escapeAttr(num)}">!${escapeHtml(num)}</button>
          ${tagsBlock}
        </div>
      `;
    }

    function stepMatchesHighlight(highlightRef, index) {
      if (!highlightRef || highlightRef.stepIndex == null) return false;
      return highlightRef.stepIndex === index;
    }

    function renderTimelineStep(item, step, index, { highlightRef = null, idPrefix = '', historyEvents = null, historyEventIndex = null } = {}) {
      const inRefPanel = idPrefix === PANEL_CARD_ID_PREFIX;
      const refStep = inRefPanel && stepMatchesHighlight(highlightRef, index);
      const refField = highlightRef?.focusAnswer ? 'answer' : 'problem';
      const pinRev = refStep
        ? (highlightRef.displayRevision ?? highlightRef.revision ?? null)
        : null;
      const headRevForStep = refStep
        ? stepFieldHeadRev(step, refField)
        : null;
      const viewRev = pinRev ?? headRevForStep;
      const viewingSnapshot = refStep && viewRev != null && headRevForStep != null && viewRev !== headRevForStep;
      let problemText;
      let answerText;
      if (historyEvents && historyEventIndex != null) {
        const pRev = fieldRevAtHistoryEvent(historyEvents, index, 'problem', historyEventIndex);
        problemText = pRev != null ? getProblemText(step, pRev) : getProblemText(step);
        const aRev = fieldRevAtHistoryEvent(historyEvents, index, 'answer', historyEventIndex);
        answerText = aRev != null ? getAnswerText(step, aRev, { live: false }) : null;
      } else {
        const answerLive = !inRefPanel;
        problemText = refStep && !highlightRef.focusAnswer && pinRev != null
          ? getProblemText(step, pinRev)
          : getProblemText(step);
        answerText = refStep && highlightRef.focusAnswer && pinRev != null
          ? getAnswerText(step, pinRev, { live: answerLive })
          : getAnswerText(step, null, { live: answerLive });
      }
      const answerEmpty = !answerText?.trim();
      const showAsAnswered = historyEventIndex != null
        ? !answerEmpty
        : (stepFullyResolved(step) || (!answerEmpty && pinRev != null && highlightRef?.focusAnswer));
      const highlightStep = !inRefPanel && stepMatchesHighlight(highlightRef, index);
      const highlightAnswer = highlightStep && highlightRef?.focusAnswer;
      const dateHtml = step.decidedAt
        ? `<time class="decision-date" datetime="${escapeAttr(step.decidedAt)}">${escapeHtml(formatDecisionDate(step.decidedAt))}</time>`
        : '';
      const refTargetBar = refStep
        ? (viewingSnapshot ? ' panel-ref-target panel-ref-target--snapshot' : ' panel-ref-target panel-ref-target--current')
        : '';
      const refBarOnAnswer = refStep && highlightRef.focusAnswer;
      const refBarOnProblem = refStep && !highlightRef.focusAnswer;
      const fieldEditAttrs = (field) => inRefPanel
        ? ''
        : ` data-editable="${field}" data-id="${item.id}" data-step="${index}"`;
      const answerClearBtn = !inRefPanel && !answerEmpty
        ? `<button type="button" class="field-remove-btn" data-action="clear-answer" data-id="${item.id}" data-step="${index}" aria-label="Archive answer">${ICON_TRASH_HTML}</button>`
        : '';
      const answerMetaHtml = inRefPanel
        ? (dateHtml ? `<div class="answer-meta">${dateHtml}</div>` : '')
        : `<div class="answer-meta">
                <div class="answer-meta-actions">
                  ${answerClearBtn}
                  <button type="button" class="answer-mark-btn" data-action="toggle-answer-tentative" data-id="${item.id}" data-step="${index}" aria-pressed="${step.answerTentative ? 'true' : 'false'}" aria-label="${step.answerTentative ? 'Clear tentative mark' : 'Mark answer as tentative'}" title="Still needs specify, refine, or further thought"><span class="answer-mark-icon" aria-hidden="true">⚑</span></button>
                </div>
                ${dateHtml}
              </div>`;
      const answerHtml = answerEmpty
        ? `<div class="answer-block${inRefPanel ? '' : ' editable'} empty${highlightAnswer ? ' highlight' : ''}${refBarOnAnswer ? refTargetBar : ''}" id="${idPrefix}answer-${item.id}-${index}"${fieldEditAttrs('answer')}>${inRefPanel ? '' : 'Add decision'}</div>`
        : `<div class="answer-block${step.answerTentative ? ' answer-marked' : ''}${highlightAnswer ? ' highlight' : ''}${refBarOnAnswer ? refTargetBar : ''}" id="${idPrefix}answer-${item.id}-${index}">
            <div class="answer-inner">
              <span class="answer-text${inRefPanel ? '' : ' editable'}"${fieldEditAttrs('answer')}>${formatRichText(answerText)}</span>
              ${answerMetaHtml}
            </div>
          </div>`;
      const stepRemoveBtn = !inRefPanel && !isStepArchived(step) && itemActiveSteps(item).length > 1
        ? `<button type="button" class="field-remove-btn field-remove-btn--problem" data-action="remove-step" data-id="${item.id}" data-step="${index}" aria-label="Archive question">${ICON_TRASH_HTML}</button>`
        : '';
      const problemHtml = `<div class="problem-row">${stepRemoveBtn}<div class="problem${inRefPanel ? '' : ' editable'}${refBarOnProblem ? refTargetBar : ''}"${fieldEditAttrs('problem')}>${formatRichText(problemText)}</div></div>`;
      const stepHighlight = highlightStep && !highlightRef?.focusAnswer ? ' highlight' : '';
      return `
        <div class="timeline-step${showAsAnswered ? ' answered' : ''}${stepHighlight}" id="${idPrefix}step-${item.id}-${index}">
          ${problemHtml}
          ${answerHtml}
        </div>
      `;
    }

    function renderCard(item, { highlightRef = null, idPrefix = '', draggableToCanvas = false } = {}) {
      const inRefPanel = idPrefix === PANEL_CARD_ID_PREFIX;
      const inCanvasSurface = idPrefix === CANVAS_CARD_ID_PREFIX;
      const historyEventIndex = inRefPanel ? highlightRef?.cardHistoryEventIndex : null;
      const historyEvents = historyEventIndex != null ? collectCardHistoryEvents(item) : null;
      const timeline = item.steps
        .map((step, i) => {
          if (!inRefPanel && isStepArchived(step)) return '';
          if (historyEvents && !stepVisibleAtHistoryEvent(historyEvents, i, historyEventIndex)) return '';
          return renderTimelineStep(item, step, i, { highlightRef, idPrefix, historyEvents, historyEventIndex });
        })
        .join('');
      const draft = followupDrafts[item.id] || '';
      const cardHighlight = idPrefix && highlightRef && highlightRef.stepIndex == null ? ' highlight' : '';
      const onCanvas = !!canvasPlacements[item.id];
      const canvasListDragBlocked = draggableToCanvas && !inRefPanel && onCanvas;
      const canvasDragAttrs = draggableToCanvas && !inRefPanel && !onCanvas
        ? ` draggable="true" data-canvas-drag-id="${escapeAttr(item.id)}"`
        : '';

      return `
        <article class="card ${cardStatusClass(item)}${cardHighlight}${inRefPanel ? ' card-readonly' : ''}${canvasListDragBlocked ? ' canvas-list-drag-blocked' : ''}" data-id="${item.id}" id="${idPrefix}card-${item.id}"${canvasDragAttrs}>
          <div class="card-top">
            <div class="card-main">
              <div class="card-header">
                ${renderTagsHtml(item, { readOnly: inRefPanel })}
                ${inCanvasSurface
                  ? `<button type="button" class="btn-delete btn-delete--dismiss" data-action="remove-from-canvas" data-id="${item.id}" aria-label="Remove from canvas">${ICON_DISMISS_HTML}</button>`
                  : `<button type="button" class="btn-delete btn-delete--archive" data-action="delete" data-id="${item.id}" aria-label="Archive card">${ICON_TRASH_HTML}</button>`}
              </div>
              <div class="timeline">${timeline}</div>
              ${inRefPanel ? '' : `<div class="followup-slot">
                <div class="followup-slot-inner">
                  <textarea
                    class="followup-input"
                    data-followup-input
                    data-id="${item.id}"
                    placeholder="Follow-up question"
                    rows="1"
                  >${escapeHtml(draft)}</textarea>
                </div>
              </div>`}
            </div>
          </div>
        </article>
      `;
    }

    function renderBoardView() {
      const cols = [
        { needs: true, title: 'Needs decision', class: 'needs' },
        { needs: false, title: 'Answered', class: 'answered' },
      ];

      return cols
        .map((col) => {
          const columnItems = itemsInColumn(col.needs);
          const cards = renderGroupedCards(columnItems);
          const showRootComposer = openComposer?.type === 'root' && col.needs;
          const addBtn = col.needs
            ? (showRootComposer
              ? renderComposerHtml()
              : `<button type="button" class="add-trigger" data-action="add-root">New decision</button>`)
            : '';
          return `
            <section class="column" data-column="${col.needs ? 'needs_decision' : 'answered'}">
              <div class="column-header ${col.class}">
                <span class="title-row"><span class="dot"></span>${col.title}</span>
              </div>
              <div class="column-body">
                ${cards || ''}
                ${addBtn}
              </div>
            </section>
          `;
        })
        .join('');
    }

    function renderListView() {
      const ordered = listItemsForView();
      const showRootComposer = openComposer?.type === 'root';
      const cards = renderGroupedCards(ordered, { draggableToCanvas: true });
      const addBlock = showRootComposer
        ? renderComposerHtml()
        : `<button type="button" class="add-trigger" data-action="add-root">New decision</button>`;
      const listEmpty = listFilterNotOnCanvas
        ? '<p style="color:var(--muted);font-size:0.85rem;margin:0">Every decision is on the canvas. Switch to <strong>All</strong> or remove one from the canvas to see it here.</p>'
        : '<p style="color:var(--muted);font-size:0.85rem;margin:0">No decisions yet</p>';

      return `
        <section class="workspace-view">
          <div class="workspace-list">
            <section class="list-view">
              <div class="list-header">
                <span class="list-header-title">Decisions</span>
                <div class="list-filter-toggle" role="group" aria-label="List filter">
                  <button type="button" class="list-filter-chip" data-action="set-list-filter" data-list-filter="all" aria-pressed="${listFilterNotOnCanvas ? 'false' : 'true'}">All</button>
                  <button type="button" class="list-filter-chip" data-action="set-list-filter" data-list-filter="not-on-canvas" aria-pressed="${listFilterNotOnCanvas ? 'true' : 'false'}">Not on canvas</button>
                </div>
              </div>
              <div class="list-body">
                ${cards || listEmpty}
                ${addBlock}
              </div>
            </section>
          </div>
          <div class="workspace-canvas">
            ${renderCanvasFrameHtml()}
            ${renderCanvasSpawnControlHtml()}
            ${renderCanvasZoomControlsHtml()}
          </div>
        </section>
      `;
    }

    function lockCanvasViewportFromSurface() {
      if (viewMode !== 'list') return;
      if (canvasViewportLock) return;
      const surface = canvasSurfaceEl();
      const fromState = {
        scrollLeft: canvasViewport.scrollLeft,
        scrollTop: canvasViewport.scrollTop,
        zoom: canvasViewport.zoom,
      };
      if (!surface) {
        canvasViewportLock = fromState;
        canvasViewportUserSet = true;
        return;
      }
      const fromSurface = {
        scrollLeft: surface.scrollLeft,
        scrollTop: surface.scrollTop,
        zoom: canvasViewport.zoom,
      };
      const surfaceUnset = !fromSurface.scrollLeft && !fromSurface.scrollTop
        && (fromState.scrollLeft || fromState.scrollTop);
      canvasViewportLock = surfaceUnset ? fromState : fromSurface;
      canvasViewport.scrollLeft = canvasViewportLock.scrollLeft;
      canvasViewport.scrollTop = canvasViewportLock.scrollTop;
      canvasViewportUserSet = true;
    }

    function applyCanvasViewportLock(surface) {
      if (!canvasViewportLock || !surface) return false;
      canvasViewport.scrollLeft = canvasViewportLock.scrollLeft;
      canvasViewport.scrollTop = canvasViewportLock.scrollTop;
      canvasViewport.zoom = canvasViewportLock.zoom;
      canvasViewportLock = null;
      applyCanvasScrollLayout({ syncOverlays: false });
      syncCanvasSurfaceScrollImmediate(surface);
      return true;
    }

    function render() {
      removeIssuePreview();
      clearWorkspaceLinkHover();
      lockCanvasViewportFromSurface();
      invalidateCanvasPlacedSizeCache();
      const drawerRef = issueDrawerRefId;
      const app = document.getElementById('app');
      app.className = viewMode;
      app.innerHTML = viewMode === 'board' ? renderBoardView() : renderListView();

      document.body.classList.toggle('show-dates', showAllDates);
      document.querySelectorAll('.view-tab[data-view]').forEach((tab) => {
        tab.classList.toggle('active', tab.dataset.view === viewMode);
      });
      const datesBtn = document.querySelector('[data-action="toggle-dates"]');
      if (datesBtn) {
        datesBtn.classList.toggle('active', showAllDates);
        datesBtn.setAttribute('aria-pressed', String(showAllDates));
      }
      if (pendingFocus) {
        const { id, field, step = 0, panel = false, canvas = false } = pendingFocus;
        pendingFocus = null;
        const el = findEditableField(document.getElementById('app'), { id, field, step, panel, canvas });
        if (el) startInlineEdit(el, field, id, step);
      } else if (pendingEditableHandoff) {
        finishEditableHandoff(document.getElementById('app'));
      } else if (pendingFollowupFocus) {
        const focusTarget = pendingFollowupFocus;
        pendingFollowupFocus = null;
        const followup = findFollowupInput(document.getElementById('app'), focusTarget);
        followup?.focus();
      } else {
        const composerInput = document.querySelector('[data-composer-input]');
        if (composerInput) composerInput.focus();
      }

      if (drawerRef) populateIssueRefDrawer(drawerRef);

      syncAutoGrowTextareas(document.getElementById('app'));
      document.querySelectorAll(REF_EDITABLE_TEXTAREA_SEL).forEach((ta) => bindRichTextAutocomplete(ta));
      if (viewMode === 'list') {
        bindCanvasInteractions();
        applyCanvasViewport();
      }
      scheduleSaveState();
    }

    function setView(mode) {
      if (mode !== 'board' && mode !== 'list') return;
      viewMode = mode;
      render();
    }

    function isEnterSubmit(e) {
      return e.key === 'Enter' && !e.shiftKey && !e.isComposing;
    }

    const AUTO_GROW_TEXTAREA_SEL = 'textarea.inline-input, textarea.followup-input, textarea[data-composer-input]';

    function autoGrowTextarea(ta) {
      if (!ta || ta.nodeName !== 'TEXTAREA') return;
      ta.style.height = 'auto';
      ta.style.height = `${ta.scrollHeight}px`;
    }

    function syncAutoGrowTextareas(root = document) {
      root.querySelectorAll(AUTO_GROW_TEXTAREA_SEL).forEach(autoGrowTextarea);
    }

    function startInlineEdit(el, field, id, stepIndex) {
      const item = items[id];
      if (!item) return;

      if (field === 'tags') {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'inline-input single';
        input.value = item.tags.join(', ');
        const syncTagsInputSize = () => {
          const len = Math.max(input.value.length, 1);
          input.size = Math.min(Math.max(len, 4), 48);
        };
        el.replaceChildren(input);
        syncTagsInputSize();
        input.addEventListener('input', syncTagsInputSize);
        input.focus();
        input.select();
        const commit = () => {
          item.tags = parseTags(input.value);
          render();
        };
        input.addEventListener('blur', () => {
          setTimeout(() => {
            if (canvasSpawnDragActive) return;
            commit();
          }, 0);
        });
        input.addEventListener('keydown', (e) => {
          if (isEnterSubmit(e)) { e.preventDefault(); input.blur(); }
          if (e.key === 'Escape') { pendingFocus = null; render(); }
        });
        return;
      }

      const step = item.steps[stepIndex];
      if (!step) return;

      const isProblem = field === 'problem';
      const current = isProblem ? step.problem : (step.answer || '');
      const ta = document.createElement('textarea');
      ta.className = isProblem ? 'inline-input inline-input-problem' : 'inline-input inline-input-answer';
      ta.dataset.refItemId = id;
      ta.dataset.refField = field;
      ta.dataset.refStep = String(stepIndex);
      ta.value = current;
      ta.rows = 1;
      const emptyAnswerBlock = !isProblem
        && el.classList.contains('answer-block')
        && el.classList.contains('empty');
      const problemBlock = isProblem && el.classList.contains('problem');
      if (emptyAnswerBlock) {
        el.classList.remove('empty', 'editable');
        el.replaceChildren(ta);
      } else if (problemBlock) {
        el.classList.remove('editable');
        el.replaceChildren(ta);
      } else {
        el.replaceWith(ta);
      }
      autoGrowTextarea(ta);
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);

      const commit = () => {
        inlineEditCommitByTa.delete(ta);
        consumeTrailingHashTag(ta);
        const val = ta.value.trim();
        if (isProblem) {
          if (!val) { render(); return; }
          recordProblemEdit(step, val);
        } else if (val) {
          recordAnswerEdit(step, val);
        } else {
          step.answer = null;
          step.decidedAt = null;
          step.answerTentative = false;
        }
        render();
      };

      inlineEditCommitByTa.set(ta, commit);

      bindRichTextAutocomplete(ta);

      ta.addEventListener('blur', () => {
        setTimeout(hideSelectionRefToolbar, 120);
        setTimeout(() => {
          if (!document.body.contains(ta)) return;
          if (canvasSpawnDragActive) return;
          if (isRefLinkPickerOpen() || selectionRefPick) {
            pendingInlineEditCommit = commit;
            return;
          }
          if (getTextareaSelectionLabel(ta)) {
            return;
          }
          removeMentionMenu();
          commit();
        }, 0);
      });
      ta.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          removeMentionMenu();
          pendingFocus = null;
          render();
          return;
        }
        if (mentionMenuEl && mentionMenuAnchorTa === ta) return;
        if (isEnterSubmit(e) && tryConfirmTagAtCursor(ta)) {
          e.preventDefault();
          return;
        }
        if (isEnterSubmit(e)) {
          e.preventDefault();
          ta.blur();
        }
      });
    }

    function closeComposer() {
      openComposer = null;
      composerPendingTags = [];
      render();
    }

    function saveComposer(composerEl) {
      if (!openComposer || !composerEl) return;
      const input = composerEl.querySelector('[data-composer-input]');
      if (!input) return;
      consumeTrailingHashTag(input);
      const text = input.value.trim();
      if (!text) {
        closeComposer();
        return;
      }
      const tags = [...composerPendingTags];
      const id = createItem({ problem: text, tags });
      composerPendingTags = [];
      if (id) pendingFocus = { id, field: 'answer', step: 0 };
      openComposer = null;
      render();
    }

    function tryCommitComposerField(input) {
      if (!input?.matches('[data-composer-input]') || !openComposer) return;
      const composer = input.closest('[data-composer]');
      if (!composer) return;
      saveComposer(composer);
    }

    function flushComposerOnOutsideClick(target) {
      if (canvasSpawnDragActive) return false;
      const input = document.activeElement;
      if (!input?.matches('[data-composer-input]') || !openComposer) return false;
      if (target.closest('[data-composer]')) return false;
      if (target.closest('[data-canvas-spawn]')) return false;
      if (mentionMenuEl?.contains(target)) return false;
      if (selectionRefToolbarEl?.contains(target)) return false;
      tryCommitComposerField(input);
      return true;
    }

    document.querySelector('.header-right').addEventListener('click', (e) => {
      if (e.target.closest('[data-action="toggle-dates"]')) {
        showAllDates = !showAllDates;
        render();
        return;
      }
      if (e.target.closest('[data-action="add-random-cards"]')) {
        addRandomCards();
        return;
      }
      if (e.target.closest('[data-action="remove-all-cards"]')) {
        removeAllCards();
        return;
      }
      const tab = e.target.closest('[data-view]');
      if (tab) setView(tab.dataset.view);
    });

    document.getElementById('app-body').addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      if (!flushActiveCanvasFieldEditForPointer(e.target)) {
        flushComposerOnOutsideClick(e.target);
      } else if (activeInlineFieldEdit()?.closest('.canvas-placed-card')) {
        e.preventDefault();
      }
      if (!e.target.closest('[data-canvas-spawn]')) return;
      prepareCanvasSpawnDragPointer();
    }, true);

    document.getElementById('app-body').addEventListener('pointerup', (e) => {
      if (!canvasSpawnPointerActive) return;
      canvasSpawnPointerActive = false;
      if (!canvasSpawnDragActive) render();
    }, true);

    document.getElementById('app-body').addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      if (Date.now() < canvasSuppressClickUntil && e.target.closest('.canvas-placed-card')) return;
      if (e.target.closest('.issue-ref-panel-body')) return;

      if (!e.target.closest('[data-editable], [data-followup-input]')) return;

      const active = document.activeElement;
      if (!active?.matches('textarea.inline-input, input.inline-input.single, [data-followup-input]')) return;

      noteEditableSwitchFromTarget(e.target, active);
      if (!pendingEditableHandoff && !pendingFollowupFocus && !pendingFocus) return;

      e.preventDefault();
      active.blur();
    }, true);

    document.getElementById('app-body').addEventListener('click', (e) => {
      if (Date.now() < canvasSuppressClickUntil && e.target.closest('.canvas-placed-card')) return;

      const editable = e.target.closest('[data-editable]');
      if (editable && !editable.closest('.issue-ref-panel-body') && !e.target.closest('textarea, input, [data-action]')) {
        const active = document.activeElement;
        if (active?.matches('textarea.inline-input, input.inline-input.single')
          && (editable.contains(active) || active.closest('[data-editable]') === editable)) {
          return;
        }
        pendingEditableHandoff = null;
        pendingFocus = null;
        const id = editable.dataset.id;
        const field = editable.dataset.editable;
        const step = field === 'tags' ? 0 : Number(editable.dataset.step);
        startInlineEdit(editable, field, id, step);
        return;
      }

      const actionEl = e.target.closest('[data-action]');
      if (!actionEl) return;

      const action = actionEl.dataset.action;
      const id = actionEl.dataset.id;

      if (action === 'set-list-filter') {
        const mode = actionEl.dataset.listFilter;
        const next = mode === 'not-on-canvas';
        if (listFilterNotOnCanvas === next) return;
        listFilterNotOnCanvas = next;
        scheduleSaveState();
        render();
        return;
      }

      if (action === 'pick-ref-target') {
        e.preventDefault();
        e.stopPropagation();
        applySelectionRefPick(actionEl.dataset.refToken);
        return;
      }

      if (action === 'close-ref-link-picker') {
        e.preventDefault();
        e.stopPropagation();
        cancelRefLinkPicker();
        return;
      }

      if (action === 'ref-picker-toggle-tag') {
        e.preventDefault();
        e.stopPropagation();
        const tag = actionEl.dataset.tag;
        if (tag) toggleRefLinkPickerTag(tag);
        return;
      }

      if (action === 'ref-picker-kind') {
        e.preventDefault();
        e.stopPropagation();
        const kind = actionEl.dataset.kind;
        if (kind === 'all' || kind === 'answer' || kind === 'question' || kind === 'card') {
          refLinkPickerKindFilter = kind;
          populateRefLinkPickerResults();
        }
        return;
      }

      if (action === 'ref-picker-clear-filters') {
        e.preventDefault();
        e.stopPropagation();
        refLinkPickerActiveTags = [];
        refLinkPickerKindFilter = 'all';
        refLinkPickerQuery = '';
        const search = refLinkPickerEl?.querySelector('#ref-link-picker-search');
        if (search) search.value = '';
        populateRefLinkPickerResults();
        search?.focus();
        return;
      }

      if (action === 'ref-picker-filter-id') {
        e.preventDefault();
        e.stopPropagation();
        const query = actionEl.dataset.refQuery;
        if (!query) return;
        refLinkPickerQuery = query;
        const search = refLinkPickerEl?.querySelector('#ref-link-picker-search');
        if (search) search.value = query;
        populateRefLinkPickerResults();
        search?.focus();
        return;
      }

      if (action === 'close-issue-drawer') {
        e.preventDefault();
        closeIssueRefDrawer();
        return;
      }

      if (action === 'add-root') {
        composerPendingTags = [];
        openComposer = { type: 'root' };
        render();
        return;
      }

      if (action === 'goto-issue') {
        if (e.shiftKey && actionEl.classList.contains('issue-ref-stale')) {
          e.preventDefault();
          e.stopPropagation();
          upgradeIssueRefLink(actionEl);
          return;
        }
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
          e.stopPropagation();
          revealReferencedItemInWorkspace(actionEl.dataset.issueRef);
          return;
        }
        e.preventDefault();
        e.stopPropagation();
        goToIssue(actionEl.dataset.issueRef, actionEl);
        return;
      }

      if (action === 'upgrade-issue-ref') {
        e.preventDefault();
        e.stopPropagation();
        const refEl = actionEl.dataset.issueRef
          ? actionEl
          : issuePreviewAnchor || actionEl.closest('[data-action="goto-issue"]');
        upgradeIssueRefLink(refEl);
        return;
      }

      if (action === 'toggle-panel-diff') {
        e.preventDefault();
        e.stopPropagation();
        issuePanelDiffOpen = !issuePanelDiffOpen;
        if (issueDrawerRefId) populateIssueRefDrawer(issueDrawerRefId);
        return;
      }

      if (action === 'toggle-panel-older-revisions') {
        e.preventDefault();
        e.stopPropagation();
        const parsed = issueDrawerRefId ? parseIssueRef(issueDrawerRefId) : null;
        issuePanelShowOlderRevisions = !issuePanelShowOlderRevisions;
        if (parsed && !issuePanelShowOlderRevisions) {
          const floor = panelRevisionFloor(parsed);
          const view = ensurePanelViewRev(parsed);
          if (floor != null && view != null && view < floor) issuePanelViewRev = floor;
        }
        if (issueDrawerRefId) populateIssueRefDrawer(issueDrawerRefId);
        return;
      }

      if (action === 'panel-rev-prev' || action === 'panel-rev-next') {
        e.preventDefault();
        e.stopPropagation();
        const parsed = issueDrawerRefId ? parseIssueRef(issueDrawerRefId) : null;
        if (parsed) stepPanelViewRev(parsed, action === 'panel-rev-prev' ? -1 : 1);
        return;
      }

      if (action === 'open-card-history') {
        e.preventDefault();
        e.stopPropagation();
        const itemId = actionEl.dataset.id;
        if (!itemId || !items[itemId]) return;
        openIssueRefDrawer(itemId);
        return;
      }

      if (action === 'panel-rev-select') {
        e.preventDefault();
        e.stopPropagation();
        const rev = Number(actionEl.dataset.rev);
        if (!Number.isFinite(rev) || !issueDrawerRefId) return;
        const parsed = parseIssueRef(issueDrawerRefId);
        if (parsed?.stepIndex == null && actionEl.dataset.cardHistory === '1') {
          const eventIndex = Number(actionEl.dataset.eventIndex);
          const stepIndex = Number(actionEl.dataset.step);
          const field = actionEl.dataset.field === 'answer' ? 'answer' : 'problem';
          if (!Number.isFinite(eventIndex) || !Number.isFinite(stepIndex)) return;
          issuePanelCardHistoryView = {
            eventIndex,
            snapshotAt: actionEl.dataset.historyAt || '',
            stepIndex,
            field,
            rev,
          };
        }
        issuePanelViewRev = rev;
        populateIssueRefDrawer(issueDrawerRefId);
        return;
      }

      if (action === 'panel-rev-jump-current') {
        e.preventDefault();
        e.stopPropagation();
        const parsed = issueDrawerRefId ? parseIssueRef(issueDrawerRefId) : null;
        const step = parsed ? panelRefStep(parsed) : null;
        if (!parsed || !step) return;
        issuePanelViewRev = stepFieldHeadRev(step, panelRefField(parsed));
        populateIssueRefDrawer(issueDrawerRefId);
        return;
      }

      if (action === 'toggle-answer-tentative' && id && items[id]) {
        const stepIndex = Number(actionEl.dataset.step);
        const step = items[id].steps[stepIndex];
        if (step) {
          toggleAnswerTentative(step);
          render();
        }
        return;
      }

      if (action === 'clear-answer' && id && items[id]) {
        archiveStepAnswer(id, Number(actionEl.dataset.step));
        return;
      }

      if (action === 'remove-step' && id && items[id]) {
        archiveStep(id, Number(actionEl.dataset.step));
        return;
      }

      if (action === 'remove-from-canvas' && id) {
        removeFromCanvas(id);
        return;
      }

      if (action === 'canvas-spawn-card') {
        if (Date.now() < canvasSpawnSuppressClickUntil) return;
        e.preventDefault();
        canvasSpawnDragActive = false;
        const pt = canvasClientPointAtViewportCenter();
        if (!pt) return;
        createNewCardOnCanvasAtClient(pt.x, pt.y);
        return;
      }

      if (action === 'canvas-zoom-in') {
        canvasZoomByFactor(1.15);
        return;
      }
      if (action === 'canvas-zoom-out') {
        canvasZoomByFactor(1 / 1.15);
        return;
      }
      if (action === 'canvas-zoom-reset') {
        canvasZoomReset();
        return;
      }

      if (action === 'delete' && id && items[id]) {
        deleteItem(id);
      }
    });

    document.getElementById('app-body').addEventListener('mousedown', (e) => {
      const ta = e.target.closest('textarea');
      selectionDragTa = isRefEditableTextarea(ta) ? ta : null;
    }, true);

    document.addEventListener('mouseup', (e) => {
      if (selectionRefToolbarEl?.contains(e.target) || mentionMenuEl?.contains(e.target)) return;
      const ta = refEditableTextareaForSelection(e.target);
      selectionDragTa = null;
      if (!ta) {
        hideSelectionRefToolbar();
        return;
      }
      finishTextareaSelectionRefToolbar(ta, e.clientX, e.clientY);
    });

    document.getElementById('app-body').addEventListener('keyup', (e) => {
      const ta = e.target.closest('textarea');
      if (!isRefEditableTextarea(ta)) return;
      if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End', 'Shift'].includes(e.key)) return;
      updateSelectionRefToolbar(ta);
    });

    document.getElementById('app-body').addEventListener('input', (e) => {
      const ta = e.target.closest('textarea');
      if (ta?.matches(AUTO_GROW_TEXTAREA_SEL)) autoGrowTextarea(ta);
      if (ta && selectionRefToolbarTa === ta && !getTextareaSelectionLabel(ta)) hideSelectionRefToolbar();
      const followup = e.target.closest('[data-followup-input]');
      if (followup) followupDrafts[followup.dataset.id] = followup.value;
    });

    document.getElementById('app-body').addEventListener('focusout', (e) => {
      const composerInput = e.target.matches('[data-composer-input]') ? e.target : null;
      const followup = e.target.matches('[data-followup-input]') ? e.target : null;
      if (!composerInput && !followup) return;
      setTimeout(() => {
        if (canvasSpawnDragActive) return;
        if (composerInput) {
          const active = document.activeElement;
          const composer = composerInput.closest('[data-composer]');
          if (composer?.contains(active)) return;
          if (mentionMenuEl && mentionMenuAnchorTa === composerInput) return;
          if (isRefLinkPickerOpen() || selectionRefPick) return;
          tryCommitComposerField(composerInput);
          return;
        }
        const handoff = pendingEditableHandoff;
        if (mentionMenuEl && mentionMenuAnchorTa === followup) return;
        if (isRefLinkPickerOpen() || selectionRefPick) {
          if (handoff && pendingEditableHandoff) finishEditableHandoff();
          return;
        }
        tryCommitFollowupField(followup);
        if (handoff && pendingEditableHandoff) {
          finishEditableHandoff();
        }
      }, 0);
    });

    document.getElementById('app-body').addEventListener('keydown', (e) => {
      const followup = e.target.closest('[data-followup-input]');
      if (followup && isEnterSubmit(e)) {
        if (e.defaultPrevented) return;
        if (tryConfirmTagAtCursor(followup)) {
          e.preventDefault();
          return;
        }
        e.preventDefault();
        tryCommitFollowupField(followup);
        return;
      }

      const composer = e.target.closest('[data-composer]');
      if (!composer) return;
      const composerInput = e.target.closest('[data-composer-input]');
      if (composerInput && isEnterSubmit(e)) {
        if (e.defaultPrevented) return;
        if (tryConfirmTagAtCursor(composerInput)) {
          e.preventDefault();
          return;
        }
        e.preventDefault();
        saveComposer(composer);
        return;
      }
      if (e.key === 'Escape') {
        closeComposer();
      }
    });

    bindIssueRefPreviewEvents();

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isRefLinkPickerOpen()) {
        e.preventDefault();
        cancelRefLinkPicker();
        return;
      }
      if (e.key !== 'Escape' || !issueDrawerRefId) return;
      if (e.target.closest('textarea, input:not([type="button"])')) return;
      if (isRefLinkPickerOpen()) return;
      closeIssueRefDrawer();
    });

    window.addEventListener('beforeunload', () => {
      if (saveStateTimer) {
        clearTimeout(saveStateTimer);
        saveStateTimer = null;
      }
      saveState();
    });

    window.addEventListener('canvas-fidx-ready', () => {
      migrateCanvasPlacementOrders();
    });

    initState();
    render();
  </script>
</body>
</html>
