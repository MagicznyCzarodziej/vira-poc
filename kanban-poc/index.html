<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>Kanban decisions PoC</title>
  <style>
    :root {
      --page: #d4d4d8;
      --bg: #ffffff;
      --surface: #d4d4d8;
      --tone-1: #f4f4f5;
      --tone-2: #e4e4e7;
      --tone-3: #c4c4c8;
      --text: #09090b;
      --subtle: #3f3f46;
      --muted: #71717a;
      --faint: #a1a1aa;
      --link: #27272a;
      --accent: #18181b;
      --hover-fill: rgba(0, 0, 0, 0.05);
      --focus-ring: rgba(9, 9, 11, 0.12);
      --card-text-x: 0.85rem;
      --answer-indent: 0.65rem;
      --qa-py: 0.55rem;
      --qa-join-py: 0.35rem;
      --question-bg: #ffad9f;
      --question-text: #09090b;
      --answer-bg: #afe9b9;
      --answer-card-bg: #c8f5d0;
      --answer-text: #09090b;
      --answer-tentative-bg: #fef3c7;
      --answer-tentative-text: #09090b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--page);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
    }
    header {
      padding: 0.875rem 1.5rem;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    header h1 { margin: 0; font-size: 1rem; font-weight: 600; letter-spacing: -0.02em; }
    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .view-tabs {
      display: flex;
      padding: 3px;
      background: var(--tone-2);
      border-radius: 8px;
      gap: 2px;
    }
    .view-tab {
      font: inherit;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.35rem 0.75rem;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .view-tab.active {
      background: var(--bg);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }
    .dates-toggle {
      margin-left: 0.25rem;
      border-radius: 8px;
      background: var(--tone-2);
    }
    .dates-toggle[aria-pressed="true"] {
      background: var(--bg);
      color: var(--text);
    }
    .badge-proto {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    main { padding: 1.25rem 1.5rem 2.5rem; max-width: 1200px; margin: 0 auto; }
    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      align-items: start;
    }
    @media (max-width: 720px) { .board { grid-template-columns: 1fr; } }
    .column {
      background: var(--surface);
      border-radius: 12px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
    }
    .column-header {
      padding: 0.875rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .column-header .dot {
      width: 8px; height: 8px; border-radius: 50%; margin-right: 0.5rem;
    }
    .column-header .title-row { display: flex; align-items: center; }
    .column-header.needs .dot { background: var(--text); }
    .column-header.answered .dot { background: var(--faint); }
    .count {
      font-weight: 500;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .column-body {
      padding: 0 0 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      flex: 1;
    }
    .card {
      border-radius: 10px;
      padding: 0;
      position: relative;
      overflow: hidden;
      background: var(--bg);
      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.07),
        0 4px 14px rgba(0, 0, 0, 0.08);
    }
    .card.card-complete {
      background: var(--answer-card-bg);
      color: var(--answer-text);
    }
    .card.card-complete .timeline-step {
      background: transparent;
    }
    .card.card-complete .problem,
    .card.card-complete .timeline-step.answered .problem,
    .card.card-complete .answer-block:not(.empty) {
      background: var(--answer-bg);
      color: var(--answer-text);
    }
    .card.card-complete .btn-delete {
      background: var(--answer-card-bg);
    }
    .timeline-step.answered .problem {
      background: var(--answer-bg);
      color: var(--answer-text);
    }
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .timeline-step {
      min-width: 0;
      overflow: hidden;
      border-radius: 0;
      background: transparent;
    }
    .timeline-step .answer-block {
      margin-top: 0;
      border: none;
      border-radius: 0;
    }
    .timeline-step .answer-block.empty {
      display: none;
      border: none;
      background: var(--tone-1);
    }
    .timeline-step:hover .answer-block.empty,
    .timeline-step:focus-within .answer-block.empty {
      display: block;
    }
    .card-top {
      min-height: 1.5rem;
    }
    .card-main { min-width: 0; }
    .btn-delete {
      position: absolute;
      top: 0.35rem;
      right: var(--card-text-x);
      z-index: 1;
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 6px;
      background: var(--bg);
      color: var(--muted);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s, color 0.15s;
    }
    .card:hover .btn-delete { opacity: 1; }
    .btn-delete:hover { background: var(--hover-fill); color: var(--text); }
    .editable {
      cursor: text;
      border-radius: 4px;
      padding: 2px 4px;
      margin: -2px -4px;
      line-height: 1.45;
    }
    .card .editable {
      margin-left: 0;
      margin-right: 0;
      border-radius: 0;
    }
    .card .problem,
    .card .answer-block {
      border-radius: 0;
    }
    .problem.editable {
      margin: 0;
      padding: var(--qa-py) var(--card-text-x);
      padding-bottom: var(--qa-join-py);
    }
    .answer-block.editable {
      margin: 0;
      padding: var(--qa-join-py) var(--card-text-x) var(--qa-py);
      padding-left: calc(var(--card-text-x) + var(--answer-indent));
    }
    .answer-text.editable {
      display: block;
      padding: 0;
      margin: 0;
    }
    .editable:hover { background: var(--hover-fill); }
    .problem.editable:hover {
      background: var(--question-bg);
    }
    .timeline-step.answered .problem.editable:hover,
    .card.card-complete .problem.editable:hover {
      background: var(--answer-bg);
    }
    .answer-block:not(.empty).editable:hover,
    .answer-block:not(.empty) .answer-text.editable:hover {
      background: transparent;
    }
    .answer-block:not(.empty):has(.answer-text.editable:hover) {
      background: var(--answer-bg);
    }
    .answer-block.answer-marked:not(.empty):has(.answer-text.editable:hover),
    .answer-block.answer-marked:not(.empty).editable:hover {
      background: var(--answer-tentative-bg);
    }
    .editable.empty { color: var(--muted); font-style: italic; }
    .problem {
      font-weight: 400;
      font-size: 0.9rem;
      padding: var(--qa-py) var(--card-text-x) var(--qa-join-py);
      background: var(--question-bg);
      color: var(--question-text);
      line-height: 1.45;
    }
    .timeline-step:first-child .problem {
      font-weight: 600;
      font-size: 0.95rem;
      padding-top: var(--qa-py);
      padding-bottom: var(--qa-join-py);
    }
    .timeline-step:last-child:not(:has(.answer-block:not(.empty))) .problem {
      padding-bottom: var(--qa-py);
    }
    .answer-block {
      font-size: 0.85rem;
      padding: var(--qa-join-py) var(--card-text-x) var(--qa-py);
      padding-left: calc(var(--card-text-x) + var(--answer-indent));
      font-weight: 400;
      line-height: 1.45;
    }
    .answer-block:not(.empty) {
      background: var(--answer-bg);
      color: var(--answer-text);
    }
    .answer-block.empty {
      color: var(--muted);
      font-style: italic;
      background: var(--tone-1);
    }
    .answer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--card-text-x);
    }
    .answer-text { flex: 1; min-width: 0; }
    .answer-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.25rem;
      flex-shrink: 0;
    }
    .answer-mark-btn {
      font: inherit;
      font-size: 1rem;
      line-height: 1;
      width: 1.5rem;
      height: 1.5rem;
      padding: 0;
      border: none;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.08);
      color: inherit;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s;
    }
    .answer-block:hover .answer-mark-btn,
    .answer-block:focus-within .answer-mark-btn,
    .answer-mark-btn[aria-pressed="true"] {
      opacity: 1;
    }
    .answer-mark-btn:hover { background: rgba(0, 0, 0, 0.12); }
    .answer-mark-btn[aria-pressed="true"] {
      background: rgba(0, 0, 0, 0.14);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
    }
    .answer-mark-icon {
      display: block;
      font-size: 1.35rem;
      line-height: 1.5rem;
      text-align: center;
    }
    .answer-block.answer-marked {
      background: var(--answer-tentative-bg);
      color: var(--answer-tentative-text);
    }
    .answer-block.answer-marked .answer-mark-btn {
      background: rgba(0, 0, 0, 0.1);
    }
    .decision-date {
      display: none;
      flex-shrink: 0;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      line-height: 1.45;
      white-space: nowrap;
    }
    body.show-dates .decision-date {
      display: block;
    }
    .inline-input {
      width: 100%;
      padding: 0.4rem 0.5rem;
      border-radius: 6px;
      border: none;
      background: var(--tone-2);
      color: var(--text);
      font: inherit;
      resize: vertical;
      min-height: 2.5rem;
      outline: none;
      box-shadow: 0 0 0 3px var(--focus-ring);
    }
    .inline-input.single { min-height: unset; resize: none; }
    .tags-row {
      display: none;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-top: 0.5rem;
      margin-bottom: 0;
      align-items: center;
      padding-left: var(--card-text-x);
      padding-right: calc(var(--card-text-x) + 1.5rem);
    }
    .followup-input {
      display: none;
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.45rem var(--card-text-x);
      border: none;
      border-radius: 6px;
      font: inherit;
      font-size: 0.85rem;
      color: var(--text);
      background: var(--tone-2);
      outline: none;
    }
    .card:hover .followup-input,
    .card:focus-within .followup-input,
    .followup-input:not(:placeholder-shown) {
      display: block;
    }
    .card:has(.timeline:hover) .followup-input:not(:focus):placeholder-shown {
      display: none;
    }
    .followup-input:focus {
      display: block;
      background: var(--bg);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }
    .followup-input::placeholder { color: var(--muted); }
    .tag {
      font-size: 0.68rem;
      font-weight: 500;
      padding: 0.12rem 0.4rem;
      border-radius: 4px;
    }
    .tags-row[data-editable] {
      cursor: text;
      border-radius: 6px;
      padding-top: 2px;
      padding-bottom: 2px;
      padding-left: var(--card-text-x);
      padding-right: calc(var(--card-text-x) + 1.5rem);
      margin: 0.5rem 0 0;
    }
    .tags-row[data-editable]:hover { background: var(--hover-fill); }
    .tags-add {
      font-size: 0.75rem;
      color: var(--muted);
      font-style: italic;
    }
    .card-footer {
      margin-top: 0.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.75rem;
      align-items: center;
    }
    .text-btn {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      font-size: 0.75rem;
      color: var(--link);
      cursor: pointer;
    }
    .text-btn:hover { color: var(--text); text-decoration: underline; }
    .text-btn.muted { color: var(--muted); }
    .links {
      font-size: 0.72rem;
      color: var(--muted);
    }
    .links button {
      background: none; border: none; padding: 0;
      font: inherit; color: var(--link); cursor: pointer;
    }
    .links button:hover { text-decoration: underline; }
    .add-trigger {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      width: 100%;
      padding: 0.55rem 0.65rem;
      border: none;
      border-radius: 8px;
      background: var(--tone-2);
      color: var(--muted);
      font: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: left;
      transition: color 0.15s, background 0.15s;
    }
    .add-trigger:hover {
      color: var(--text);
      background: var(--tone-3);
    }
    .composer {
      background: var(--bg);
      border-radius: 10px;
      padding: 0.75rem;
      box-shadow: 0 0 0 3px var(--focus-ring);
    }
    .composer.linked { margin-left: 0.75rem; }
    .composer textarea {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.9rem;
      resize: none;
      outline: none;
      min-height: 2.75rem;
    }
    .composer-meta {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
      align-items: center;
    }
    .composer-meta input {
      flex: 1;
      border: none;
      background: var(--hover-fill);
      border-radius: 6px;
      padding: 0.35rem 0.5rem;
      font: inherit;
      font-size: 0.75rem;
      color: var(--text);
      outline: none;
    }
    .composer-meta input::placeholder { color: var(--muted); }
    .composer-actions {
      display: flex;
      gap: 0.35rem;
      margin-top: 0.5rem;
      justify-content: flex-end;
    }
    .btn-sm {
      font: inherit;
      font-size: 0.75rem;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      border: none;
      background: var(--tone-2);
      color: var(--subtle);
      cursor: pointer;
    }
    .btn-sm.primary {
      background: var(--text);
      color: var(--bg);
    }
    .btn-sm:hover { filter: brightness(0.96); }
    .state-dump { margin-top: 2rem; font-size: 0.7rem; color: var(--muted); }
    .state-dump summary { cursor: pointer; }
    .state-dump pre {
      overflow: auto; max-height: 200px;
      background: var(--surface);
      padding: 0.75rem; border-radius: 8px; margin-top: 0.5rem;
    }
    .highlight { outline: 2px solid var(--tone-3); outline-offset: 2px; }
    .timeline-step.highlight {
      outline: 2px solid var(--tone-3);
      outline-offset: 0;
      border-radius: 4px;
    }
    .list-view {
      background: var(--surface);
      border-radius: 12px;
      padding: 0.75rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .list-header {
      padding: 0.25rem 0.85rem 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
    }
    .list-body { display: flex; flex-direction: column; gap: 0; }
    .tag-group + .tag-group {
      margin-top: 1.5rem;
    }
    .tag-group-header {
      padding: 0 0.85rem 0.65rem;
    }
    .tag-group-label {
      margin: 0;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .tag-group-body {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .composer-in-card { margin-top: 0.5rem; }
    body.qa-inset .card {
      padding: 0 0.85rem;
    }
    body.qa-inset .timeline-step {
      border-radius: 0;
    }
    body.qa-inset .tags-row,
    body.qa-inset .tags-row[data-editable] {
      padding-left: 0;
      padding-right: 1.5rem;
    }
    body.qa-inset .btn-delete {
      right: 0;
    }
    .mention {
      font-weight: 600;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 3px;
      padding: 0 0.15rem;
    }
    .mention-menu {
      position: fixed;
      z-index: 1000;
      background: var(--bg);
      border-radius: 8px;
      padding: 0.25rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 12rem;
      overflow: auto;
    }
    .mention-menu-item {
      font: inherit;
      font-size: 0.8rem;
      text-align: left;
      padding: 0.35rem 0.5rem;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }
    .mention-menu-item:hover,
    .mention-menu-item.active {
      background: var(--tone-1);
    }
    .issue-ref {
      font: inherit;
      font-size: inherit;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      padding: 0 0.25rem;
      margin: 0 0.05rem;
      border: none;
      border-radius: 3px;
      background: rgba(0, 0, 0, 0.1);
      color: inherit;
      cursor: pointer;
      vertical-align: baseline;
    }
    .issue-ref:hover { background: rgba(0, 0, 0, 0.16); }
    .issue-ref-link {
      font-size: inherit;
      font-weight: 600;
      font-variant-numeric: normal;
      padding: 0;
      margin: 0;
      border-radius: 0;
      background: transparent;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }
    .issue-ref-link:hover {
      background: rgba(0, 0, 0, 0.06);
    }
    .issue-ref-missing {
      opacity: 0.55;
      text-decoration: line-through;
    }
    .issue-ref.issue-ref-stale {
      background: #fde68a;
      color: #78350f;
    }
    .issue-ref.issue-ref-stale:hover {
      background: #fcd34d;
    }
    .issue-ref-link.issue-ref-stale {
      background: transparent;
      color: #92400e;
      text-decoration-color: #d97706;
    }
    .issue-ref-link.issue-ref-stale:hover {
      background: rgba(251, 191, 36, 0.15);
    }
    .issue-ref-preview {
      position: absolute;
      z-index: 10000;
      max-width: min(22rem, calc(100vw - 1.5rem));
      padding: 0.65rem 0.75rem;
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      box-shadow:
        0 4px 24px rgba(0, 0, 0, 0.14),
        0 0 0 1px rgba(0, 0, 0, 0.06);
      pointer-events: auto;
      font-size: 0.8rem;
      line-height: 1.4;
    }
    .issue-ref-preview-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--tone-2);
    }
    .issue-ref-preview-id {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .issue-ref-preview-status {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .issue-ref-preview-step + .issue-ref-preview-step {
      margin-top: 0.55rem;
    }
    .issue-ref-preview-q {
      padding: 0.25rem 0.45rem;
      border-radius: 4px;
      background: var(--question-bg);
      margin-bottom: 0.35rem;
    }
    .issue-ref-preview-a {
      padding: 0.25rem 0.45rem;
      border-radius: 4px;
      background: var(--answer-bg);
      margin-left: 0.45rem;
    }
    .issue-ref-preview-a.issue-ref-preview-pending {
      background: var(--tone-1);
      color: var(--muted);
      font-style: italic;
    }
    .issue-ref-preview-missing {
      margin: 0;
      color: var(--muted);
      font-style: italic;
    }
    .issue-ref-preview-answer-ref .issue-ref-preview-a {
      margin-left: 0;
    }
    .issue-ref-preview-answer-slot .issue-ref-preview-q {
      margin-bottom: 0.35rem;
    }
    .issue-ref-preview-context-before + .issue-ref-preview-answer-slot,
    .issue-ref-preview-answer-slot + .issue-ref-preview-context-after {
      margin-top: 0.55rem;
    }
    .issue-ref-preview-context-toggle {
      display: block;
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.35rem 0.5rem;
      border: none;
      border-radius: 6px;
      background: var(--tone-1);
      color: var(--subtle);
      font: inherit;
      font-size: 0.7rem;

<body>

      <button type="button" class="view-tab dates-toggle" data-action="toggle-qa-inset" aria-pressed="false">Inset</button>
      <span class="badge-proto">PoC · in-memory</span>
    </div>
  </header>
  <main>
    <div id="app"></div>
    <details class="state-dump">
      <summary>Full state (JSON)</summary>
      <pre id="state-json"></pre>
    </details>
  </main>

  <script>
    let nextId = 1;
    /** @type {Record<string, { id: string, tags: string[], steps: object[] }>} */
    let items = {};

    const MENTION_PEOPLE = ['Alex', 'Casey', 'Jordan', 'Morgan', 'Riley', 'Sam'];

    /** @type {{ type: 'root' } | null} */
    let openComposer = null;

    /** @type {HTMLElement | null} */
    let mentionMenuEl = null;

    /** @type {HTMLElement | null} */
    let issuePreviewEl = null;

    /** @type {ReturnType<typeof setTimeout> | null} */
    let issuePreviewShowTimer = null;

    /** @type {ReturnType<typeof setTimeout> | null} */
    let issuePreviewHideTimer = null;

    /** @type {HTMLElement | null} */
    let issuePreviewAnchor = null;

    /** @type {ReturnType<typeof setTimeout> | null} */
    let issuePreviewDismissLockTimer = null;

    let issuePreviewDismissLocked = false;

    /** @type {Record<string, string>} */
    let followupDrafts = {};

    /** @type {{ id: string, field: string, step?: number } | null} */
    let pendingFocus = null;

    /** @type {'board' | 'list'} */
    let viewMode = 'list';

    let showAllDates = false;

    /** Full-bleed Q/A bands vs card horizontal padding */
    let qaInset = false;

    function uid() {
      return 'item-' + nextId++;
    }

    function parseTags(raw) {
      return raw.split(',').map((t) => t.trim()).filter(Boolean);
    }

    const TAG_PALETTE = [
      { bg: '#e4e4e7', text: '#27272a' },
      { bg: '#d4d4d8', text: '#18181b' },
      { bg: '#f4f4f5', text: '#52525b' },
      { bg: '#a1a1aa', text: '#fafafa' },
      { bg: '#71717a', text: '#fafafa' },
      { bg: '#52525b', text: '#f4f4f5' },
      { bg: '#e4e4e7', text: '#3f3f46' },
      { bg: '#d4d4d8', text: '#3f3f46' },
    ];

    function tagColorIndex(name) {
      let hash = 0;
      const key = name.toLowerCase();
      for (let i = 0; i < key.length; i++) {
        hash = ((hash << 5) - hash + key.charCodeAt(i)) | 0;
      }
      return Math.abs(hash) % TAG_PALETTE.length;
    }

    function tagStyle(name) {
      const c = TAG_PALETTE[tagColorIndex(name)];
      return `background:${c.bg};color:${c.text}`;
    }

    function stepResolved(step) {
      return !!(step.answer && step.answer.trim());
    }

    function stepFullyResolved(step) {
      return stepResolved(step) && !step.answerTentative;
    }

    function ensureStepRevisions(step) {
      const now = new Date().toISOString();
      if (!step.problemRevisions?.length) {
        step.problemRevisions = [{ rev: 1, text: step.problem, at: step.problemAt || now }];
        step.problemRev = 1;
      }
      if (step.answer?.trim() && !step.answerRevisions?.length) {
        step.answerRevisions = [{
          rev: 1,
          text: step.answer.trim(),
          at: step.decidedAt || now,
          tentative: !!step.answerTentative,
        }];
        step.answerRev = 1;
      }
    }

    function recordProblemEdit(step, newText) {
      const trimmed = newText.trim();
      if (!trimmed) return;
      ensureStepRevisions(step);
      if (trimmed === getProblemText(step, step.problemRev)) return;
      step.problemRev += 1;
      step.problemRevisions.push({ rev: step.problemRev, text: trimmed, at: new Date().toISOString() });
      step.problem = trimmed;
    }

    function recordAnswerEdit(step, newText) {
      const trimmed = newText.trim();
      if (!trimmed) return;
      if (!step.answerRevisions?.length) {
        step.answerRevisions = [];
        step.answerRev = 0;
      }
      if (trimmed === getAnswerText(step, step.answerRev)) return;
      step.answerRev += 1;
      step.answerRevisions.push({
        rev: step.answerRev,
        text: trimmed,
        at: new Date().toISOString(),
        tentative: !!step.answerTentative,
      });
      step.answer = trimmed;
      step.decidedAt = step.answerRevisions[step.answerRevisions.length - 1].at;
    }

    function getProblemText(step, rev = null) {
      ensureStepRevisions(step);
      const r = rev ?? step.problemRev;
      return step.problemRevisions.find((entry) => entry.rev === r)?.text ?? step.problem;
    }

    function getAnswerText(step, rev = null) {
      if (!step.answer?.trim() && !step.answerRevisions?.length) return null;
      if (!step.answerRevisions?.length) return step.answer?.trim() || null;
      const r = rev ?? step.answerRev;
      return step.answerRevisions.find((entry) => entry.rev === r)?.text ?? step.answer?.trim() ?? null;
    }

    function stepFieldHeadRev(step, field) {
      ensureStepRevisions(step);
      return field === 'answer' ? step.answerRev : step.problemRev;
    }

    function stepFieldRevisions(step, field) {
      ensureStepRevisions(step);
      return field === 'answer' ? (step.answerRevisions || []) : step.problemRevisions;
    }

    function normalizeStep(step) {
      const answer = step.answer?.trim() || null;
      let answerTentative = !!(step.answerTentative || step.answerMark);
      if (!answer) answerTentative = false;
      const normalized = {
        problem: step.problem,
        answer,
        answerTentative,
        decidedAt: answer ? (step.decidedAt || new Date().toISOString()) : null,
        problemRevisions: step.problemRevisions,
        answerRevisions: step.answerRevisions,
        problemRev: step.problemRev,
        answerRev: step.answerRev,
      };
      ensureStepRevisions(normalized);
      return normalized;
    }

    function toggleAnswerTentative(step) {
      if (!stepResolved(step)) return;
      step.answerTentative = !step.answerTentative;
    }

    function formatDecisionDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      return `${dd}.${mm}.${yyyy}`;
    }

    function itemNeedsDecision(item) {
      return item.steps.some((s) => !stepFullyResolved(s));
    }

    function cardStatusClass(item) {
      const resolved = item.steps.filter(stepFullyResolved).length;
      if (resolved === item.steps.length) return 'card-complete';
      if (resolved === 0 && item.steps.every((s) => !stepResolved(s))) return 'card-incomplete';
      return 'card-partial';
    }

    function createItem({ problem, tags = [], answer = null, steps = null }) {
      const id = uid();
      if (steps) {
        items[id] = { id, tags, steps: steps.map(normalizeStep) };
        return id;
      }
      const trimmed = problem?.trim();
      if (!trimmed) return null;
      const ans = answer ? answer.trim() : null;
      items[id] = {
        id,
        tags,
        steps: [normalizeStep({ problem: trimmed, answer: ans })],
      };
      return id;
    }

    function addStep(itemId, problem) {
      const trimmed = problem.trim();
      if (!trimmed || !items[itemId]) return false;
      items[itemId].steps.push(normalizeStep({ problem: trimmed, answer: null }));
      return true;
    }

    function seed() {
      const refNum = (id) => id.replace(/^item-/i, '');

      const archId = createItem({
        tags: ['architecture'],
        steps: [
          {
            problem: 'Should we use a monolith or services for v1? @Alex',

          {

      createItem({
        tags: ['product'],

      createItem({
        tags: ['product', 'ux'],
        steps: [
          {

            decidedAt: '2026-10-26T16:45:00.000Z',

      createItem({
        tags: ['security', 'auth'],
        steps: [
          {
            problem: 'Passkeys, SSO, or email magic links for sign-in?',
            answer: 'SSO for enterprise tenants; magic links for solo users at launch.',
            decidedAt: '2026-10-22T11:00:00.000Z',
          },
          {
            problem: 'Session length for magic-link users?',
            answer: null,
          },
        ],
      });
      const apiId = createItem({
        tags: ['api'],
        steps: [
          {
            problem: 'URL path or header for API versioning?',
            answer: 'Path prefix /v1; sunset policy documented in changelog.',
            decidedAt: '2026-10-20T13:20:00.000Z',
          },
        ],
      });
      createItem({
        tags: ['infra', 'cost'],
        steps: [
          {
            problem: 'Managed Postgres or self-hosted for the first year?',
            answer: 'Managed (Neon) — ops headcount is zero.',
            decidedAt: '2026-10-18T10:00:00.000Z',
          },
          {
            problem: 'Backup RPO / RTO targets?',
            answer: 'RPO 1h, RTO 4h; nightly full + continuous WAL.',

      createItem({

        steps: [{ problem: 'Light mode only, or ship dark mode in v1?', answer: null }],
      });
      createItem({
        tags: ['hiring'],
        steps: [
          {

        ],
      });
      createItem({

        steps: [
          {

          },

      });
      createItem({
        tags: ['integrations', 'product'],
        steps: [
          {
            problem: 'Slack notifications for new decisions — in scope for beta?',

          },

            answer: null,

        ],
      });

      items[archId].steps[1].problem =
        `How do we draw service boundaries when we split? See [API versioning](#${refNum(apiId)}).`;

      const rolloutId = createItem({

            answer: null,
          },
        ],
      });

      {
        const charge = items[rolloutId].steps[2];
        charge.answerRevisions = [
          { rev: 1, text: 'Free for the first 50 teams only.', at: '2026-10-12T10:00:00.000Z', tentative: false },
          { rev: 2, text: 'Free for 90 days, then standard pricing.', at: '2026-10-12T12:00:00.000Z', tentative: false },
          { rev: 3, text: 'Free until general availability; no credit card at signup.', at: '2026-10-12T14:00:00.000Z', tentative: false },
        ];
        charge.answerRev = 3;
        charge.answer = charge.answerRevisions[2].text;
        charge.decidedAt = charge.answerRevisions[2].at;
      }

      const nApi = refNum(apiId);
      const nRollout = refNum(rolloutId);

      createItem({
        tags: ['fixtures'],
        steps: [
          {
            problem: 'Fixture: #refs and answer revisions (hover, click, history).',
            answer: `Topic [beta rollout](#${nRollout}). Pinned [90-day trial](#${nRollout}/a3@v2). Latest [no charge in beta](#${nRollout}/a3@v3).`,
            decidedAt: '2026-10-31T00:00:00.000Z',
          },
        ],
      });
    }

    function itemsInColumn(needsDecision) {
      return Object.values(items)
        .filter((i) => itemNeedsDecision(i) === needsDecision)
        .sort((a, b) => a.id.localeCompare(b.id));
    }

    function allItemsOrdered() {
      return Object.values(items).sort((a, b) => a.id.localeCompare(b.id));
    }

    function groupItemsByTag(itemList) {
      const tagMap = new Map();
      const untagged = [];
      for (const item of itemList) {
        if (!item.tags.length) {
          untagged.push(item);
          continue;
        }
        for (const tag of item.tags) {
          if (!tagMap.has(tag)) tagMap.set(tag, []);
          const bucket = tagMap.get(tag);
          if (!bucket.some((i) => i.id === item.id)) bucket.push(item);
        }
      }
      const groups = [...tagMap.entries()]
        .sort(([a], [b]) => a.localeCompare(b))
        .map(([tag, groupItems]) => ({
          tag,
          items: groupItems.sort((a, b) => a.id.localeCompare(b.id)),
        }));
      if (untagged.length) {
        groups.push({
          tag: null,
          items: untagged.sort((a, b) => a.id.localeCompare(b.id)),
        });
      }
      return groups;
    }

    function renderTagGroupSection(group) {
      const label = group.tag ?? 'Untagged';
      const cards = group.items.map((item) => renderCard(item)).join('');
      return `
        <section class="tag-group">
          <div class="tag-group-header">
            <h2 class="tag-group-label">${escapeHtml(label)}</h2>
          </div>
          <div class="tag-group-body">${cards}</div>
        </section>
      `;
    }

    function renderGroupedCards(itemList) {
      if (!itemList.length) return '';
      return groupItemsByTag(itemList).map((g) => renderTagGroupSection(g)).join('');
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeAttr(s) {
      return escapeHtml(s).replace(/'/g, '&#39;');
    }

    function issueRefTitle(id) {
      const item = items[id];
      if (!item) return 'Missing decision';
      return item.steps[0]?.problem || id;
    }

    function truncateLabel(text, max = 52) {
      if (!text || text.length <= max) return text;
      return `${text.slice(0, max - 1)}…`;
    }

    function normalizeIssueId(ref) {
      const s = String(ref ?? '').trim();
      const m = s.match(/^item-(\d+)$/i) || s.match(/^(\d+)$/);
      return m ? `item-${m[1]}` : null;
    }

    /** @returns {{ itemId: string, stepIndex: number|null, focusAnswer: boolean, revision: number|null } | null} */
    function parseIssueRef(ref) {
      const s = String(ref ?? '').trim().replace(/^#+/, '');
      const m = s.match(/^(?:(item-\d+)|(\d+))(?:\/(?:step-)?(\d+)|\/a(\d+))?(?:@v(\d+))?$/i);
      if (!m) {
        const itemId = normalizeIssueId(s.replace(/@v\d+$/i, ''));
        return itemId ? { itemId, stepIndex: null, focusAnswer: false, revision: null } : null;
      }
      const itemId = normalizeIssueId(m[1] || m[2]);
      if (!itemId) return null;
      let stepIndex = null;
      let focusAnswer = false;
      if (m[3]) {
        const stepNum = parseInt(m[3], 10);
        if (stepNum >= 1) stepIndex = stepNum - 1;
      } else if (m[4]) {
        const stepNum = parseInt(m[4], 10);
        if (stepNum >= 1) {
          stepIndex = stepNum - 1;
          focusAnswer = true;
        }
      }
      const revision = m[5] ? parseInt(m[5], 10) : null;
      return { itemId, stepIndex, focusAnswer, revision };
    }

    function formatIssueRefSuffix(parsed) {
      return parsed.revision != null ? `@v${parsed.revision}` : '';
    }

    /** @param {{ itemId: string, stepIndex: number|null, focusAnswer?: boolean, revision?: number|null }} parsed */
    function formatIssueRefToken(parsed) {
      const num = parsed.itemId.replace(/^item-/i, '');
      const suffix = formatIssueRefSuffix(parsed);
      if (parsed.focusAnswer && parsed.stepIndex != null) {
        return `item-${num}/a${parsed.stepIndex + 1}${suffix}`;
      }
      if (parsed.stepIndex != null) return `item-${num}/${parsed.stepIndex + 1}${suffix}`;
      return parsed.itemId;
    }

    /** Visible ref label (no @v). */
    function formatIssueRefDisplay(parsed) {
      const num = parsed.itemId.replace(/^item-/i, '');
      if (parsed.focusAnswer && parsed.stepIndex != null) {
        return `#${num}/a${parsed.stepIndex + 1}`;
      }
      if (parsed.stepIndex != null) return `#${num}/${parsed.stepIndex + 1}`;
      return `#${num}`;
    }

    /** Stored ref string including @v when pinned. */
    function formatIssueRefInText(parsed) {
      return `${formatIssueRefDisplay(parsed)}${formatIssueRefSuffix(parsed)}`;
    }

    function isIssueRefStale(parsed) {
      if (parsed.revision == null || parsed.stepIndex == null) return false;
      const item = items[parsed.itemId];
      const step = item?.steps[parsed.stepIndex];
      if (!item || !step) return false;
      const field = parsed.focusAnswer ? 'answer' : 'problem';
      return parsed.revision !== stepFieldHeadRev(step, field);
    }

    function replaceIssueRefRevisionInText(text, parsed, newRevision) {
      const oldHref = formatIssueRefInText({ ...parsed, revision: parsed.revision });
      const newHref = formatIssueRefInText({ ...parsed, revision: newRevision });
      if (oldHref === newHref) return text;
      const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return text
        .replace(new RegExp(`\\(${esc(oldHref)}\\)`, 'g'), `(${newHref})`)
        .replace(new RegExp(esc(oldHref), 'g'), newHref);
    }

    /** Where the ref markdown lives (not the ref target). */
    function findFieldContainingIssueRef(parsed) {
      if (parsed.revision == null) return null;
      const oldHref = formatIssueRefInText({ ...parsed, revision: parsed.revision });
      for (const item of Object.values(items)) {
        for (let si = 0; si < item.steps.length; si++) {
          for (const field of ['problem', 'answer']) {
            const text = item.steps[si][field];
            if (text && text.includes(oldHref)) {
              return { item, step: item.steps[si], field };
            }
          }
        }
      }
      return null;
    }

    function resolveIssueRefSourceField(anchorEl, parsed) {
      const editable = anchorEl?.closest?.('[data-editable]');
      if (editable) {
        const field = editable.dataset.editable;
        if (field === 'problem' || field === 'answer') {
          const item = items[editable.dataset.id];
          const step = item?.steps[Number(editable.dataset.step)];
          if (item && step) return { item, step, field };
        }
      }
      if (issuePreviewEl?.dataset?.sourceItem) {
        const field = issuePreviewEl.dataset.sourceField;
        if (field === 'problem' || field === 'answer') {
          const item = items[issuePreviewEl.dataset.sourceItem];
          const step = item?.steps[Number(issuePreviewEl.dataset.sourceStep)];
          if (item && step) return { item, step, field };
        }
      }
      return findFieldContainingIssueRef(parsed);
    }

    function upgradeIssueRefLink(anchorEl) {
      const refId = anchorEl?.dataset?.issueRef || issuePreviewEl?.dataset?.refId;
      if (!refId) return false;
      const parsed = parseIssueRef(refId);
      if (!parsed || parsed.revision == null || parsed.stepIndex == null) return false;
      if (!isIssueRefStale(parsed)) return false;
      const targetItem = items[parsed.itemId];
      const targetStep = targetItem?.steps[parsed.stepIndex];
      if (!targetItem || !targetStep) return false;
      const revField = parsed.focusAnswer ? 'answer' : 'problem';
      const headRev = stepFieldHeadRev(targetStep, revField);
      const source = resolveIssueRefSourceField(anchorEl, parsed);
      if (!source) return false;
      const { step, field } = source;
      const updated = replaceIssueRefRevisionInText(step[field], parsed, headRev);
      if (updated === step[field]) return false;
      step[field] = updated;
      removeIssuePreview();
      render();
      return true;
    }

    function issueRefPreviewUpgradeHtml(parsed) {
      if (!isIssueRefStale(parsed)) return '';
      return '<button type="button" class="issue-ref-preview-upgrade" data-action="upgrade-issue-ref">Update link to current</button>';
    }

    function issueRefRevisionForInsert(step, parsed) {
      ensureStepRevisions(step);
      if (parsed.focusAnswer) return step.answerRev || null;
      if (parsed.stepIndex != null) return step.problemRev || null;
      return null;
    }

    function issueRefRevisionExists(step, parsed) {
      if (parsed.revision == null) return true;
      const field = parsed.focusAnswer ? 'answer' : 'problem';
      return stepFieldRevisions(step, field).some((entry) => entry.rev === parsed.revision);
    }

    function issueRefExists(parsed) {
      const item = items[parsed.itemId];
      if (!item) return false;
      if (parsed.stepIndex == null) return true;
      const step = item.steps[parsed.stepIndex];
      if (!step) return false;
      return issueRefRevisionExists(step, parsed);
    }

    const REF_PLACEHOLDER_PREFIX = '\uE000ref';
    const REF_PLACEHOLDER_SUFFIX = '\uE001';

    /** @type {string[] | null} */
    let issueRefPlaceholderStash = null;

    function issueRefPartsToToken(num, stepNum, answerNum, revisionNum) {
      const base = answerNum ? `${num}/a${answerNum}` : stepNum ? `${num}/${stepNum}` : num;
      return revisionNum ? `${base}@v${revisionNum}` : base;
    }

    function issueRefAutocompleteLabel(parsed) {
      const item = items[parsed.itemId];
      if (!item) return formatIssueRefDisplay(parsed);
      if (parsed.focusAnswer && parsed.stepIndex != null) {
        const step = item.steps[parsed.stepIndex];
        const answer = step ? getAnswerText(step) : null;
        return truncateLabel(answer || 'Answer', 48);
      }
      if (parsed.stepIndex != null) {
        return truncateLabel(item.steps[parsed.stepIndex]?.problem || item.id, 48);
      }
      return truncateLabel(item.steps[0]?.problem || item.id, 48);
    }

    function renderIssueRef(refToken, displayLabel) {
      const parsed = parseIssueRef(refToken);
      if (!parsed) return escapeHtml(String(refToken));
      const exists = issueRefExists(parsed);
      const miss = exists ? '' : ' issue-ref-missing';
      const stale = isIssueRefStale(parsed) ? ' issue-ref-stale' : '';
      const hasLabel = displayLabel != null && displayLabel !== '';
      const inner = hasLabel ? displayLabel : escapeHtml(formatIssueRefDisplay(parsed));
      const linkClass = hasLabel ? 'issue-ref issue-ref-link' : 'issue-ref';
      const token = formatIssueRefToken(parsed);
      const num = parsed.itemId.replace(/^item-/i, '');
      const stepHint = parsed.stepIndex != null
        ? (parsed.focusAnswer ? `, answer ${parsed.stepIndex + 1}` : `, step ${parsed.stepIndex + 1}`)
        : '';
      const staleHint = stale ? ', outdated revision' : '';
      const staleTitle = stale ? ' title="Outdated link — hover for Update, or Shift+click to update"' : '';
      const buttonHtml = `<button type="button" class="${linkClass}${miss}${stale}" data-action="goto-issue" data-issue-ref="${escapeHtml(token)}" aria-label="Go to decision #${escapeHtml(num)}${stepHint}${staleHint}"${staleTitle}>${inner}</button>`;
      if (issueRefPlaceholderStash) {
        const idx = issueRefPlaceholderStash.length;
        issueRefPlaceholderStash.push(buttonHtml);
        return `${REF_PLACEHOLDER_PREFIX}${idx}${REF_PLACEHOLDER_SUFFIX}`;
      }
      return buttonHtml;
    }

    function expandIssueRefPlaceholders(html) {
      if (!issueRefPlaceholderStash?.length) return html;
      return html.replace(
        new RegExp(`${REF_PLACEHOLDER_PREFIX}(\\d+)${REF_PLACEHOLDER_SUFFIX}`, 'g'),
        (_, index) => issueRefPlaceholderStash[Number(index)] ?? '',
      );
    }

    function formatRichText(text) {
      if (!text) return '';
      issueRefPlaceholderStash = [];
      let html = escapeHtml(text);

      // Refs before @mentions — @v2 in (#11/a3@v2) is a revision pin, not a person mention
      html = html.replace(
        /\[([^\]]+)\]\(#(\d+)(?:\/(\d+)|\/a(\d+))?(?:@v(\d+))?\)/g,
        (full, label, num, stepNum, answerNum, revisionNum) => {
          const ref = issueRefPartsToToken(num, stepNum, answerNum, revisionNum);
          return parseIssueRef(ref) ? renderIssueRef(ref, label) : full;
        },
      );

      html = html.replace(
        /#(\d+)(?:\/(\d+)|\/a(\d+))?(?:@v(\d+))?/g,
        (full, num, stepNum, answerNum, revisionNum) => {
          const ref = issueRefPartsToToken(num, stepNum, answerNum, revisionNum);
          return parseIssueRef(ref) ? renderIssueRef(ref) : full;
        },
      );

      html = html.replace(/@(?!v\d+)([\w.-]+)/g, '<span class="mention">@$1</span>');

      html = expandIssueRefPlaceholders(html);
      issueRefPlaceholderStash = null;
      return html;
    }

    function removeMentionMenu() {
      if (mentionMenuEl) {
        mentionMenuEl.remove();
        mentionMenuEl = null;
      }
    }

    function insertMention(ta, name) {
      const pos = ta.selectionStart ?? ta.value.length;
      const before = ta.value.slice(0, pos);
      const match = before.match(/@([\w.-]*)$/);
      if (!match) return;
      const start = pos - match[0].length;
      ta.value = `${ta.value.slice(0, start)}@${name} ${ta.value.slice(pos)}`;
      const newPos = start + name.length + 2;
      ta.focus();
      ta.setSelectionRange(newPos, newPos);
    }

    function insertIssueRef(ta, refToken) {
      const pos = ta.selectionStart ?? ta.value.length;
      const before = ta.value.slice(0, pos);
      const match = before.match(/#\d*(?:\/(?:a?\d*))?(?:@v?\d*)?$/);
      if (!match) return;
      const start = pos - match[0].length;
      const parsed = parseIssueRef(refToken);
      if (!parsed) return;
      const item = items[parsed.itemId];
      const step = parsed.stepIndex != null ? item?.steps[parsed.stepIndex] : null;
      if (step) {
        const rev = issueRefRevisionForInsert(step, parsed);
        if (rev != null) parsed.revision = rev;
      }
      const label = issueRefAutocompleteLabel(parsed);
      const token = `[${label}](${formatIssueRefInText(parsed)}) `;
      ta.value = `${ta.value.slice(0, start)}${token}${ta.value.slice(pos)}`;
      const newPos = start + token.length;
      ta.focus();
      ta.setSelectionRange(newPos, newPos);
    }

    function mountAutocompleteMenu(ta, buildItems) {
      removeMentionMenu();
      const buttons = buildItems();
      if (!buttons.length) return;

      mentionMenuEl = document.createElement('div');
      mentionMenuEl.className = 'mention-menu';
      mentionMenuEl.setAttribute('role', 'listbox');
      buttons.forEach((btn) => mentionMenuEl.appendChild(btn));
      document.body.appendChild(mentionMenuEl);
      const rect = ta.getBoundingClientRect();
      mentionMenuEl.style.left = `${rect.left}px`;
      mentionMenuEl.style.top = `${rect.bottom + 4}px`;
      mentionMenuEl.style.minWidth = `${Math.min(Math.max(rect.width, 200), 320)}px`;
    }

    function bindRichTextAutocomplete(ta) {
      const showMenu = () => {
        removeMentionMenu();
        const pos = ta.selectionStart ?? ta.value.length;
        const before = ta.value.slice(0, pos);
        const mentionMatch = before.match(/@([\w.-]*)$/);
        const issueStepMatch = before.match(/#(\d+)\/(a?)(\d*)$/);
        const issueMatch = before.match(/#(\d*)$/);

        if (mentionMatch) {
          const query = mentionMatch[1].toLowerCase();
          const hits = MENTION_PEOPLE.filter((p) => p.toLowerCase().startsWith(query)).slice(0, 8);
          mountAutocompleteMenu(ta, () => hits.map((name) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'mention-menu-item';
            btn.setAttribute('role', 'option');
            btn.textContent = `@${name}`;
            btn.addEventListener('mousedown', (e) => {
              e.preventDefault();
              insertMention(ta, name);
              removeMentionMenu();
            });
            return btn;
          }));
          return;
        }

        if (issueStepMatch) {
          const itemId = normalizeIssueId(issueStepMatch[1]) || `item-${issueStepMatch[1]}`;
          const answerOnly = issueStepMatch[2] === 'a';
          const query = issueStepMatch[3];
          const item = itemId ? items[itemId] : null;
          if (item) {
            mountAutocompleteMenu(ta, () => item.steps.map((step, index) => {
              const stepNum = String(index + 1);
              if (query && !stepNum.startsWith(query)) return null;
              const btn = document.createElement('button');
              btn.type = 'button';
              btn.className = 'mention-menu-item';
              btn.setAttribute('role', 'option');
              const idSpan = document.createElement('span');
              idSpan.className = 'issue-menu-id';
              idSpan.textContent = answerOnly
                ? `#${item.id.replace('item-', '')}/a${stepNum}`
                : `#${item.id.replace('item-', '')}/${stepNum}`;
              const titleSpan = document.createElement('span');
              titleSpan.className = 'issue-menu-title';
              titleSpan.textContent = answerOnly
                ? truncateLabel(step.answer?.trim() || '(no answer)', 56)
                : truncateLabel(step.problem || item.id, 56);
              btn.append(idSpan, titleSpan);
              const refToken = answerOnly
                ? `${item.id}/a${stepNum}`
                : `${item.id}/${stepNum}`;
              btn.addEventListener('mousedown', (e) => {
                e.preventDefault();
                insertIssueRef(ta, refToken);
                removeMentionMenu();
              });
              return btn;
            }).filter(Boolean));
          }
          return;
        }

        if (issueMatch) {
          const query = issueMatch[1];
          const hits = Object.values(items)
            .filter((item) => {
              const num = item.id.replace(/^item-/i, '');
              const problem = item.steps[0]?.problem || '';
              return num.startsWith(query) || problem.toLowerCase().includes(query.toLowerCase());
            })
            .sort((a, b) => a.id.localeCompare(b.id))
            .slice(0, 8);
          mountAutocompleteMenu(ta, () => hits.map((item) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'mention-menu-item';
            btn.setAttribute('role', 'option');
            const idSpan = document.createElement('span');
            idSpan.className = 'issue-menu-id';
            idSpan.textContent = `#${item.id.replace('item-', '')}`;
            const titleSpan = document.createElement('span');
            titleSpan.className = 'issue-menu-title';
            titleSpan.textContent = truncateLabel(item.steps[0]?.problem || item.id);
            btn.append(idSpan, titleSpan);
            btn.addEventListener('mousedown', (e) => {
              e.preventDefault();
              insertIssueRef(ta, item.id);
              removeMentionMenu();
            });
            return btn;
          }));
        }
      };

      ta.addEventListener('input', showMenu);
      ta.addEventListener('blur', () => setTimeout(removeMentionMenu, 120));
      ta.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') removeMentionMenu();
      });
    }

    function goToIssue(refId) {
      removeIssuePreview();
      const parsed = parseIssueRef(refId);
      if (!parsed) return;
      const { itemId, stepIndex, focusAnswer } = parsed;
      let el = null;
      if (stepIndex != null) {
        el = document.getElementById(
          focusAnswer ? `answer-${itemId}-${stepIndex}` : `step-${itemId}-${stepIndex}`,
        );
      }
      if (!el) el = document.getElementById(`card-${itemId}`);
      if (!el) return;
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.add('highlight');
      window.setTimeout(() => el.classList.remove('highlight'), 1800);
    }

    function renderRevisionHistoryHtml(step, field, activeRev) {
      const revisions = stepFieldRevisions(step, field);
      if (revisions.length <= 1) return '';
      const head = stepFieldHeadRev(step, field);
      const viewRev = activeRev ?? head;
      return revisions
        .slice()
        .reverse()
        .map((entry) => {
          const active = entry.rev === viewRev;
          const date = entry.at ? formatDecisionDate(entry.at) : '';
          const body = field === 'answer'
            ? truncateLabel(entry.text, 180)
            : truncateLabel(entry.text, 160);
          return `<div class="issue-ref-preview-revision-item${active ? ' is-active' : ''}">
            <div class="issue-ref-preview-revision-meta">v${entry.rev}${date ? ` · ${escapeHtml(date)}` : ''}${entry.tentative ? ' · tentative' : ''}</div>
            ${escapeHtml(body)}
          </div>`;
        })
        .join('');
    }

    function renderPreviewStepsHtml(item, fromIndex = 0, toIndex = item.steps.length) {
      return item.steps
        .slice(fromIndex, toIndex)
        .map((step) => {
          ensureStepRevisions(step);
          const q = truncateLabel(getProblemText(step), 160);
          const answerText = getAnswerText(step);
          let answerBlock;
          if (answerText) {
            const tent = step.answerTentative ? ' <span aria-hidden="true">⚑</span>' : '';
            answerBlock = `<div class="issue-ref-preview-a">${escapeHtml(truncateLabel(answerText, 140))}${tent}</div>`;
          } else {
            answerBlock = '<div class="issue-ref-preview-a issue-ref-preview-pending">No decision yet</div>';
          }
          return `<div class="issue-ref-preview-step"><div class="issue-ref-preview-q">${escapeHtml(q)}</div>${answerBlock}</div>`;
        })
        .join('');
    }

    function buildIssuePreviewHtml(refId) {
      const parsed = parseIssueRef(refId);
      if (!parsed) {
        return '<p class="issue-ref-preview-missing">Decision not found</p>';
      }
      const item = items[parsed.itemId];
      if (!item) {
        return '<p class="issue-ref-preview-missing">Decision not found</p>';
      }
      const num = parsed.itemId.replace(/^item-/i, '');
      let statusHtml = '';
      if (parsed.stepIndex == null) {
        const status = itemNeedsDecision(item) ? 'Needs decision' : 'Answered';
        statusHtml = `<span class="issue-ref-preview-status">${status}</span>`;
      } else if (parsed.focusAnswer) {
        statusHtml = isIssueRefStale(parsed)
          ? '<span class="issue-ref-preview-status">Stale link</span>'
          : '<span class="issue-ref-preview-status">Answer</span>';
      } else {
        const status = itemNeedsDecision(item) ? 'Needs decision' : 'Answered';
        statusHtml = `<span class="issue-ref-preview-status">${status}</span>`;
      }
      const headHtml = `
        <div class="issue-ref-preview-head">
          <span class="issue-ref-preview-id">#${escapeHtml(num)}</span>
          ${statusHtml}
        </div>`;

      if (parsed.focusAnswer && parsed.stepIndex != null) {
        const stepIndex = parsed.stepIndex;
        const step = item.steps[stepIndex];
        ensureStepRevisions(step);
        const headRev = stepFieldHeadRev(step, 'answer');
        const viewRev = parsed.revision ?? headRev;
        const answerText = getAnswerText(step, viewRev);
        let answerBlock;
        if (answerText) {
          const revEntry = step.answerRevisions.find((entry) => entry.rev === viewRev);
          const tent = revEntry?.tentative ? ' <span aria-hidden="true">⚑</span>' : '';
          answerBlock = `<div class="issue-ref-preview-a issue-ref-preview-answer-main">${escapeHtml(truncateLabel(answerText, 220))}${tent}</div>`;
        } else {
          answerBlock = '<div class="issue-ref-preview-a issue-ref-preview-pending issue-ref-preview-answer-main">No decision yet</div>';
        }
        const staleHtml = isIssueRefStale(parsed)
          ? `<div class="issue-ref-preview-stale">This link is outdated — text below is what was decided when the link was created.</div>${issueRefPreviewUpgradeHtml(parsed)}`
          : '';
        const hasContext = item.steps.length > 1 || !!getProblemText(step)?.trim();
        const toggleHtml = hasContext
          ? '<button type="button" class="issue-ref-preview-context-toggle" data-action="toggle-preview-context" aria-expanded="false">Show full topic</button>'
          : '';
        const historyHtml = stepFieldRevisions(step, 'answer').length > 1
          ? `<button type="button" class="issue-ref-preview-revision-toggle" data-action="toggle-preview-revisions" aria-expanded="false">Change history</button>
             <div class="issue-ref-preview-revisions" hidden>${renderRevisionHistoryHtml(step, 'answer', parsed.revision)}</div>`
          : '';
        return `${headHtml}<div class="issue-ref-preview-answer-slot">${answerBlock}${staleHtml}</div>${toggleHtml}${historyHtml}`;
      }

      const stepsHtml = renderPreviewStepsHtml(item);
      const upgradeHtml = issueRefPreviewUpgradeHtml(parsed);
      return `${headHtml}${stepsHtml}${upgradeHtml}`;
    }

    function fillAnswerPreviewContext(open) {
      if (!issuePreviewEl) return;
      const parsed = parseIssueRef(issuePreviewEl.dataset.refId);
      const item = parsed ? items[parsed.itemId] : null;
      const stepIndex = parsed?.stepIndex;
      if (!item || stepIndex == null) return;
      const slot = issuePreviewEl.querySelector('.issue-ref-preview-answer-slot');
      if (!slot) return;
      issuePreviewEl.querySelectorAll('[data-preview-context-part]').forEach((el) => el.remove());
      if (!open) return;
      const step = item.steps[stepIndex];
      if (stepIndex > 0) {
        const before = document.createElement('div');
        before.className = 'issue-ref-preview-context-before';
        before.dataset.previewContextPart = '';
        before.innerHTML = renderPreviewStepsHtml(item, 0, stepIndex);
        slot.before(before);
      }
      if (step?.problem?.trim()) {
        const question = document.createElement('div');
        question.className = 'issue-ref-preview-q';
        question.dataset.previewContextPart = '';
        question.textContent = truncateLabel(getProblemText(step), 160);
        slot.prepend(question);
      }
      if (stepIndex < item.steps.length - 1) {
        const after = document.createElement('div');
        after.className = 'issue-ref-preview-context-after';
        after.dataset.previewContextPart = '';
        after.innerHTML = renderPreviewStepsHtml(item, stepIndex + 1);
        slot.after(after);
      }
    }

    function bindIssuePreviewInteractions() {
      if (!issuePreviewEl) return;
      issuePreviewEl.addEventListener('click', (e) => {
        const upgradeBtn = e.target.closest('[data-action="upgrade-issue-ref"]');
        if (upgradeBtn) {
          e.preventDefault();
          e.stopPropagation();
          lockIssuePreviewDismiss(300);
          upgradeIssueRefLink(issuePreviewAnchor);
          return;
        }
        const revBtn = e.target.closest('[data-action="toggle-preview-revisions"]');
        if (revBtn && issuePreviewEl) {
          e.preventDefault();
          e.stopPropagation();
          const open = !issuePreviewEl.classList.contains('is-revisions-open');
          issuePreviewEl.classList.toggle('is-revisions-open', open);
          const panel = issuePreviewEl.querySelector('.issue-ref-preview-revisions');
          if (panel) panel.hidden = !open;
          revBtn.textContent = open ? 'Hide history' : 'Change history';
          revBtn.setAttribute('aria-expanded', String(open));
          lockIssuePreviewDismiss(450);
          if (issuePreviewAnchor) scrollPageToRevealIssuePreview();
          return;
        }
        const btn = e.target.closest('[data-action="toggle-preview-context"]');
        if (!btn || !issuePreviewEl) return;
        e.preventDefault();
        e.stopPropagation();
        const open = !issuePreviewEl.classList.contains('is-context-open');
        issuePreviewEl.classList.toggle('is-context-open', open);
        fillAnswerPreviewContext(open);
        btn.textContent = open ? 'Hide topic' : 'Show full topic';
        btn.setAttribute('aria-expanded', String(open));
        lockIssuePreviewDismiss(450);
        if (issuePreviewAnchor) {
          delete issuePreviewEl.dataset.placement;
          positionIssuePreview(issuePreviewAnchor);
          scrollPageToRevealIssuePreview();
        }
      });
    }

    function lockIssuePreviewDismiss(ms = 400) {
      issuePreviewDismissLocked = true;
      if (issuePreviewHideTimer) {
        clearTimeout(issuePreviewHideTimer);
        issuePreviewHideTimer = null;
      }
      if (issuePreviewDismissLockTimer) clearTimeout(issuePreviewDismissLockTimer);
      issuePreviewDismissLockTimer = setTimeout(() => {
        issuePreviewDismissLockTimer = null;
        issuePreviewDismissLocked = false;
      }, ms);
    }

    function scrollPageToRevealIssuePreview() {
      if (!issuePreviewEl) return;
      issuePreviewEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function positionIssuePreview(anchor) {
      if (!issuePreviewEl) return;
      const gap = 6;
      const margin = 8;
      const vh = window.innerHeight;
      const scrollX = window.scrollX;
      const scrollY = window.scrollY;
      const rect = anchor.getBoundingClientRect();
      issuePreviewEl.style.left = '0';
      issuePreviewEl.style.top = '0';
      const pop = issuePreviewEl.getBoundingClientRect();
      let left = rect.left + rect.width / 2 - pop.width / 2;
      left = Math.max(margin, Math.min(left, window.innerWidth - pop.width - margin));
      const spaceBelow = vh - margin - (rect.bottom + gap);
      const spaceAbove = rect.top - gap - margin;
      if (!issuePreviewEl.dataset.placement) {
        issuePreviewEl.dataset.placement = spaceBelow >= pop.height || spaceBelow >= spaceAbove ? 'below' : 'above';
      }
      let docTop;
      if (issuePreviewEl.dataset.placement === 'above') {
        docTop = scrollY + rect.top - gap - pop.height;
      } else {
        docTop = scrollY + rect.bottom + gap;
      }
      issuePreviewEl.style.left = `${scrollX + left}px`;
      issuePreviewEl.style.top = `${Math.max(scrollY + margin, docTop)}px`;
    }

    function removeIssuePreview() {
      if (issuePreviewShowTimer) {
        clearTimeout(issuePreviewShowTimer);
        issuePreviewShowTimer = null;
      }
      if (issuePreviewHideTimer) {
        clearTimeout(issuePreviewHideTimer);
        issuePreviewHideTimer = null;
      }
      if (issuePreviewDismissLockTimer) {
        clearTimeout(issuePreviewDismissLockTimer);
        issuePreviewDismissLockTimer = null;
      }
      issuePreviewDismissLocked = false;
      issuePreviewAnchor = null;
      if (issuePreviewEl) {
        issuePreviewEl.remove();
        issuePreviewEl = null;
      }
    }

    function scheduleHideIssuePreview() {
      if (issuePreviewDismissLocked) return;
      if (issuePreviewHideTimer) clearTimeout(issuePreviewHideTimer);
      const delay = issuePreviewEl?.classList.contains('is-context-open') ? 320 : 120;
      issuePreviewHideTimer = setTimeout(removeIssuePreview, delay);
    }

    function showIssuePreview(anchor, refId) {
      if (issuePreviewEl && issuePreviewAnchor === anchor) {
        positionIssuePreview(anchor);
        return;
      }
      removeIssuePreview();
      issuePreviewAnchor = anchor;
      issuePreviewEl = document.createElement('div');
      const parsed = parseIssueRef(refId);
      issuePreviewEl.className = 'issue-ref-preview'
        + (parsed?.focusAnswer ? ' issue-ref-preview-answer-ref' : '');
      issuePreviewEl.setAttribute('role', 'tooltip');
      issuePreviewEl.dataset.refId = refId;
      const sourceEditable = anchor.closest('[data-editable]');
      if (sourceEditable) {
        const sf = sourceEditable.dataset.editable;
        if (sf === 'problem' || sf === 'answer') {
          issuePreviewEl.dataset.sourceItem = sourceEditable.dataset.id;
          issuePreviewEl.dataset.sourceField = sf;
          issuePreviewEl.dataset.sourceStep = sourceEditable.dataset.step;
        }
      }
      issuePreviewEl.innerHTML = buildIssuePreviewHtml(refId);
      bindIssuePreviewInteractions();
      issuePreviewEl.addEventListener('mouseenter', () => {
        if (issuePreviewHideTimer) {
          clearTimeout(issuePreviewHideTimer);
          issuePreviewHideTimer = null;
        }
      });
      issuePreviewEl.addEventListener('mouseleave', scheduleHideIssuePreview);
      document.body.appendChild(issuePreviewEl);
      delete issuePreviewEl.dataset.placement;
      positionIssuePreview(anchor);
      scrollPageToRevealIssuePreview();
    }

    function bindIssueRefPreviewEvents() {
      const app = document.getElementById('app');
      app.addEventListener('mouseover', (e) => {
        const ref = e.target.closest('[data-action="goto-issue"]');
        if (!ref) return;
        const from = e.relatedTarget;
        if (from && ref.contains(from)) return;
        if (issuePreviewHideTimer) {
          clearTimeout(issuePreviewHideTimer);
          issuePreviewHideTimer = null;
        }
        if (issuePreviewShowTimer) clearTimeout(issuePreviewShowTimer);
        issuePreviewShowTimer = setTimeout(() => {
          issuePreviewShowTimer = null;
          showIssuePreview(ref, ref.dataset.issueRef);
        }, 220);
      });
      app.addEventListener('mouseout', (e) => {
        const ref = e.target.closest('[data-action="goto-issue"]');
        if (!ref) return;
        const to = e.relatedTarget;
        if (to && ref.contains(to)) return;
        if (to && issuePreviewEl?.contains(to)) return;
        if (issuePreviewShowTimer) {
          clearTimeout(issuePreviewShowTimer);
          issuePreviewShowTimer = null;
        }
        scheduleHideIssuePreview();
      });
      window.addEventListener(
        'scroll',
        () => {
          if (issuePreviewEl && issuePreviewAnchor) {
            positionIssuePreview(issuePreviewAnchor);
          }
        },
        true,
      );
    }

    function deleteItem(id) {
      delete items[id];
      delete followupDrafts[id];
    }

    function renderComposerHtml() {
      return `
        <div class="composer" data-composer="root">
          <textarea placeholder="Question — @people, [label](#5/a1)" autofocus data-composer-input></textarea>
          <div class="composer-meta">
            <input type="text" placeholder="Tags" data-composer-tags />
          </div>
          <div class="composer-actions">
            <button type="button" class="btn-sm" data-composer-cancel>Cancel</button>
            <button type="button" class="btn-sm primary" data-composer-save>Add</button>
          </div>
        </div>
      `;
    }

    function commitFollowup(itemId, text) {
      const trimmed = text.trim();
      if (!trimmed || !items[itemId]) return;
      addStep(itemId, trimmed);
      delete followupDrafts[itemId];
      const stepIndex = items[itemId].steps.length - 1;
      pendingFocus = { id: itemId, field: 'answer', step: stepIndex };
      render();
    }

    function renderTagsHtml(item) {
      const chips = item.tags.map((t) => `<span class="tag" style="${tagStyle(t)}">${escapeHtml(t)}</span>`).join('');
      return `
        <div class="tags-row" data-editable="tags" data-id="${item.id}">
          ${chips || '<span class="tags-add">Tags</span>'}
        </div>
      `;
    }

    function renderTimelineStep(item, step, index) {
      const answerEmpty = !step.answer?.trim();
      const showAsAnswered = stepFullyResolved(step);
      const dateHtml = step.decidedAt
        ? `<time class="decision-date" datetime="${escapeAttr(step.decidedAt)}">${escapeHtml(formatDecisionDate(step.decidedAt))}</time>`
        : '';
      const answerHtml = answerEmpty
        ? `<div class="answer-block editable empty" id="answer-${item.id}-${index}" data-editable="answer" data-id="${item.id}" data-step="${index}">Decision</div>`
        : `<div class="answer-block${step.answerTentative ? ' answer-marked' : ''}" id="answer-${item.id}-${index}">
            <div class="answer-inner">
              <span class="answer-text editable" data-editable="answer" data-id="${item.id}" data-step="${index}">${formatRichText(step.answer)}</span>
              <div class="answer-meta">
                <button type="button" class="answer-mark-btn" data-action="toggle-answer-tentative" data-id="${item.id}" data-step="${index}" aria-pressed="${step.answerTentative ? 'true' : 'false'}" aria-label="${step.answerTentative ? 'Clear tentative mark' : 'Mark answer as tentative'}" title="Still needs specify, refine, or further thought"><span class="answer-mark-icon" aria-hidden="true">⚑</span></button>
                ${dateHtml}
              </div>
            </div>
          </div>`;
      return `
        <div class="timeline-step${showAsAnswered ? ' answered' : ''}" id="step-${item.id}-${index}">
          <div class="problem editable" data-editable="problem" data-id="${item.id}" data-step="${index}">${formatRichText(step.problem)}</div>
          ${answerHtml}
        </div>
      `;
    }

    function renderCard(item) {
      const timeline = item.steps.map((step, i) => renderTimelineStep(item, step, i)).join('');
      const draft = followupDrafts[item.id] || '';

      return `
        <article class="card ${cardStatusClass(item)}" data-id="${item.id}" id="card-${item.id}">
          <div class="card-top">
            <div class="card-main">
              <div class="timeline">${timeline}</div>
              <input
                type="text"
                class="followup-input"
                data-followup-input
                data-id="${item.id}"
                placeholder="Follow-up question"
                value="${escapeAttr(draft)}"
              />
              ${renderTagsHtml(item)}
            </div>
            <button type="button" class="btn-delete" data-action="delete" data-id="${item.id}" aria-label="Delete">×</button>
          </div>
        </article>
      `;
    }

    function renderBoardView() {
      const cols = [
        { needs: true, title: 'Needs decision', class: 'needs' },
        { needs: false, title: 'Answered', class: 'answered' },
      ];

      return cols
        .map((col) => {
          const columnItems = itemsInColumn(col.needs);
          const cards = renderGroupedCards(columnItems);
          const showRootComposer = openComposer?.type === 'root' && col.needs;
          const addBtn = col.needs
            ? (showRootComposer
              ? renderComposerHtml()
              : `<button type="button" class="add-trigger" data-action="add-root">New decision</button>`)
            : '';
          return `
            <section class="column" data-column="${col.needs ? 'needs_decision' : 'answered'}">
              <div class="column-header ${col.class}">
                <span class="title-row"><span class="dot"></span>${col.title}</span>
              </div>
              <div class="column-body">
                ${cards || ''}
                ${addBtn}
              </div>
            </section>
          `;
        })
        .join('');
    }

    function renderListView() {
      const ordered = allItemsOrdered();
      const showRootComposer = openComposer?.type === 'root';
      const cards = renderGroupedCards(ordered);
      const addBlock = showRootComposer
        ? renderComposerHtml()
        : `<button type="button" class="add-trigger" data-action="add-root">New decision</button>`;

      return `
        <section class="list-view">
          <div class="list-header">
            <span>All items</span>
          </div>
          <div class="list-body">
            ${cards || '<p style="color:var(--muted);font-size:0.85rem;margin:0">No items yet</p>'}
            ${addBlock}
          </div>
        </section>
      `;
    }

    function render() {
      removeIssuePreview();
      const app = document.getElementById('app');
      app.className = viewMode === 'board' ? 'board' : '';
      app.innerHTML = viewMode === 'board' ? renderBoardView() : renderListView();

      document.body.classList.toggle('show-dates', showAllDates);
      document.body.classList.toggle('qa-inset', qaInset);
      document.querySelectorAll('.view-tab[data-view]').forEach((tab) => {
        tab.classList.toggle('active', tab.dataset.view === viewMode);
      });
      const datesBtn = document.querySelector('[data-action="toggle-dates"]');
      if (datesBtn) {
        datesBtn.classList.toggle('active', showAllDates);
        datesBtn.setAttribute('aria-pressed', String(showAllDates));
      }
      const insetBtn = document.querySelector('[data-action="toggle-qa-inset"]');
      if (insetBtn) {
        insetBtn.classList.toggle('active', qaInset);
        insetBtn.setAttribute('aria-pressed', String(qaInset));
      }

      document.getElementById('state-json').textContent = JSON.stringify(items, null, 2);

      if (pendingFocus) {
        const { id, field, step = 0 } = pendingFocus;
        pendingFocus = null;
        const el = field === 'tags'
          ? document.querySelector(`[data-editable="tags"][data-id="${id}"]`)
          : document.querySelector(`[data-editable="${field}"][data-id="${id}"][data-step="${step}"]`);
        if (el) startInlineEdit(el, field, id, step);
      } else {
        const composerInput = document.querySelector('[data-composer-input]');
        if (composerInput) {
          composerInput.focus();
          bindRichTextAutocomplete(composerInput);
        }
      }
    }

    function setView(mode) {
      viewMode = mode;
      render();
    }

    function startInlineEdit(el, field, id, stepIndex) {
      const item = items[id];
      if (!item) return;

      if (field === 'tags') {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'inline-input single';
        input.value = item.tags.join(', ');
        el.replaceWith(input);
        input.focus();
        input.select();
        const commit = () => {
          item.tags = parseTags(input.value);
          render();
        };
        input.addEventListener('blur', commit);
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
          if (e.key === 'Escape') { pendingFocus = null; render(); }
        });
        return;
      }

      const step = item.steps[stepIndex];
      if (!step) return;

      const isProblem = field === 'problem';
      const current = isProblem ? step.problem : (step.answer || '');
      const ta = document.createElement('textarea');
      ta.className = 'inline-input';
      ta.value = current;
      if (!isProblem) ta.rows = 3;
      el.replaceWith(ta);
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);

      const commit = () => {
        const val = ta.value.trim();
        if (isProblem) {
          if (!val) { render(); return; }
          recordProblemEdit(step, val);
        } else if (val) {
          recordAnswerEdit(step, val);
        } else {
          step.answer = null;
          step.decidedAt = null;
          step.answerTentative = false;
        }
        render();
      };

      bindRichTextAutocomplete(ta);

      ta.addEventListener('blur', () => {
        removeMentionMenu();
        commit();
      });
      ta.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (isProblem || e.metaKey || e.ctrlKey)) {
          e.preventDefault();
          ta.blur();
        }
        if (e.key === 'Escape') {
          removeMentionMenu();
          pendingFocus = null;
          render();
        }
      });
    }

    function closeComposer() {
      openComposer = null;
      render();
    }

    function saveComposer(composerEl) {
      const text = composerEl.querySelector('[data-composer-input]').value;
      const tags = parseTags(composerEl.querySelector('[data-composer-tags]').value);
      const id = createItem({ problem: text, tags });
      if (id) pendingFocus = { id, field: 'answer', step: 0 };
      openComposer = null;
      render();
    }

    document.querySelector('.header-right').addEventListener('click', (e) => {
      if (e.target.closest('[data-action="toggle-dates"]')) {
        showAllDates = !showAllDates;
        render();
        return;
      }
      if (e.target.closest('[data-action="toggle-qa-inset"]')) {
        qaInset = !qaInset;
        render();
        return;
      }
      const tab = e.target.closest('[data-view]');
      if (tab) setView(tab.dataset.view);
    });

    document.getElementById('app').addEventListener('click', (e) => {
      const editable = e.target.closest('[data-editable]');
      if (editable && !e.target.closest('textarea, input, [data-action]')) {
        const field = editable.dataset.editable;
        const id = editable.dataset.id;
        const step = field === 'tags' ? 0 : Number(editable.dataset.step);
        startInlineEdit(editable, field, id, step);
        return;
      }

      const actionEl = e.target.closest('[data-action]');
      if (!actionEl) return;

      const action = actionEl.dataset.action;
      const id = actionEl.dataset.id;

      if (action === 'add-root') {
        openComposer = { type: 'root' };
        render();
        return;
      }

      if (action === 'goto-issue') {
        if (e.shiftKey && actionEl.classList.contains('issue-ref-stale')) {
          e.preventDefault();
          e.stopPropagation();
          upgradeIssueRefLink(actionEl);
          return;
        }
        e.preventDefault();
        e.stopPropagation();
        goToIssue(actionEl.dataset.issueRef);
        return;
      }

      if (action === 'upgrade-issue-ref') {
        e.preventDefault();
        e.stopPropagation();
        const refEl = issuePreviewAnchor || actionEl.closest('[data-action="goto-issue"]');
        if (refEl) upgradeIssueRefLink(refEl);
        return;
      }

      if (action === 'toggle-answer-tentative' && id && items[id]) {
        const stepIndex = Number(actionEl.dataset.step);
        const step = items[id].steps[stepIndex];
        if (step) {
          toggleAnswerTentative(step);
          render();
        }
        return;
      }

      if (action === 'delete' && id && items[id]) {
        deleteItem(id);
        render();
      }
    });

    document.getElementById('app').addEventListener('click', (e) => {
      if (e.target.closest('[data-composer-save]')) {
        const composer = e.target.closest('[data-composer]');
        if (composer) saveComposer(composer);
        return;
      }
      if (e.target.closest('[data-composer-cancel]')) {
        closeComposer();
      }
    });

    document.getElementById('app').addEventListener('input', (e) => {
      const followup = e.target.closest('[data-followup-input]');
      if (followup) followupDrafts[followup.dataset.id] = followup.value;
    });

    document.getElementById('app').addEventListener('keydown', (e) => {
      const followup = e.target.closest('[data-followup-input]');
      if (followup && e.key === 'Enter') {
        e.preventDefault();
        commitFollowup(followup.dataset.id, followup.value);
        return;
      }

      const composer = e.target.closest('[data-composer]');
      if (!composer) return;
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        saveComposer(composer);
      }
      if (e.key === 'Escape') {
        closeComposer();
      }
    });

    bindIssueRefPreviewEvents();
    seed();
    render();
  </script>
</body>
</html>
