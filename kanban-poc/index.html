      refLinkPickerEl.hidden = true;
      refLinkPickerEl.setAttribute('role', 'complementary');
      refLinkPickerEl.setAttribute('aria-labelledby', 'ref-link-picker-title');
      refLinkPickerEl.innerHTML = `
          <div class="issue-ref-panel-toolbar">
            <div class="ref-link-picker-heading">
              <span class="issue-ref-panel-title" id="ref-link-picker-title">Link to decision</span>
              <p class="ref-link-picker-selection" id="ref-link-picker-selection"></p>
            </div>
            <button type="button" class="issue-ref-panel-close" data-action="close-ref-link-picker" aria-label="Close">×</button>
          </div>
          <div class="ref-link-picker-search-wrap">
            <input type="search" class="ref-link-picker-search" id="ref-link-picker-search" placeholder="Search words, !id, tags, questions…" autocomplete="off" />
          </div>
          <div class="ref-link-picker-filters">
            <span class="ref-link-picker-filter-label">Filter by tag</span>
            <div class="ref-link-picker-tag-strip" id="ref-link-picker-tag-strip"></div>
            <div class="ref-link-picker-kind-strip">
              <button type="button" class="ref-link-picker-chip-btn" data-action="ref-picker-kind" data-kind="all" aria-pressed="true">All</button>
              <button type="button" class="ref-link-picker-chip-btn" data-action="ref-picker-kind" data-kind="answer" aria-pressed="false">Answers</button>
              <button type="button" class="ref-link-picker-chip-btn" data-action="ref-picker-kind" data-kind="question" aria-pressed="false">Questions</button>
              <button type="button" class="ref-link-picker-chip-btn" data-action="ref-picker-kind" data-kind="card" aria-pressed="false">Whole cards</button>
            </div>
            <div class="ref-link-picker-filter-actions">
              <span class="ref-link-picker-filter-label" style="margin:0">Click tags in results too</span>
              <button type="button" class="ref-link-picker-clear-filters" data-action="ref-picker-clear-filters" hidden>Clear filters</button>
            </div>
          </div>
          <div class="ref-link-picker-results-meta" id="ref-link-picker-results-meta"></div>
          <div class="issue-ref-panel-body ref-link-picker-body" id="ref-link-picker-results"></div>
      `;
      refLinkPickerEl.querySelector('#ref-link-picker-search').addEventListener('input', (e) => {
        refLinkPickerQuery = e.target.value;
        populateRefLinkPickerResults();
      });
      refLinkPickerEl.querySelector('#ref-link-picker-search').addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          e.preventDefault();
          e.stopPropagation();
          cancelRefLinkPicker();
        }
      });
      document.getElementById('app-body').appendChild(refLinkPickerEl);
      return refLinkPickerEl;
    }

    function renderRefLinkPickerRow(refToken, kind, idLabel, questionText, answerText) {
      const answerHtml = answerText?.trim()
        ? `<div class="ref-link-picker-preview-a">${escapeHtml(truncateLabel(answerText, 220))}</div>`
        : `<div class="ref-link-picker-preview-a is-empty">No answer yet</div>`;
      const qHtml = questionText?.trim()
        ? `<div class="ref-link-picker-preview-q">${escapeHtml(truncateLabel(questionText, 200))}</div>`
        : '';
      const kindLabel = kind === 'card' ? 'Whole card' : kind === 'question' ? 'Question' : 'Answer';
      return `<button type="button" class="ref-link-picker-row" data-action="pick-ref-target" data-ref-token="${escapeAttr(refToken)}">
        <div class="ref-link-picker-row-meta">
          <span class="ref-link-picker-id">${escapeHtml(idLabel)}</span>
          <span class="ref-link-picker-kind">${kindLabel}</span>
        </div>
        <div class="ref-link-picker-preview">${qHtml}${kind === 'question' ? '' : answerHtml}</div>
      </button>`;
    }

    function populateRefLinkPickerResults() {
      const root = document.getElementById('ref-link-picker-results');
      if (!root) return;
      const q = refLinkPickerQuery.trim();
      const groups = [];
      let rowCount = 0;
      const editingId = selectionRefPick?.itemId || null;
      const sorted = Object.values(items).sort((a, b) => {
        if (editingId) {
          if (a.id === editingId && b.id !== editingId) return -1;
          if (b.id === editingId && a.id !== editingId) return 1;
        }
        return a.id.localeCompare(b.id);
      });

      for (const item of sorted) {
        if (!refLinkPickerItemPassesTags(item)) continue;

        const num = item.id.replace(/^item-/i, '');
        const tagChips = item.tags.map((t) => renderRefLinkPickerTagButton(t)).join('');
        const editingBadge = item.id === editingId
          ? '<span class="ref-link-picker-editing-badge">This card</span>'
          : '';
        const rows = [];
        const firstProblem = item.steps[0] ? getProblemText(item.steps[0]) : '';
        const cardHay = `!${num} ${item.tags.join(' ')} ${firstProblem}`;
        if (refLinkPickerRowPassesKind('card') && refTargetMatchesQuery(cardHay, q)) {
          rows.push(renderRefLinkPickerRow(
            item.id,
            'card',
            `!${num}`,
            firstProblem,
            item.steps.length === 1 ? getAnswerText(item.steps[0]) : null,
          ));
        }

        item.steps.forEach((step, index) => {
          ensureStepRevisions(step);
          const stepNum = index + 1;
          const problem = getProblemText(step);
          const answer = getAnswerText(step);
          const stepHay = `!${num} ${item.tags.join(' ')} ${problem} ${answer || ''}`;
          if (refLinkPickerRowPassesKind('question') && refTargetMatchesQuery(stepHay, q)) {
            rows.push(renderRefLinkPickerRow(
              `${item.id}/${stepNum}`,
              'question',
              `!${num}/${stepNum}`,
              problem,
              null,
            ));
          }
          if (answer?.trim()
            && refLinkPickerRowPassesKind('answer')
            && refTargetMatchesQuery(`!${num}/a${stepNum} ${answer} ${problem}`, q)) {
            rows.push(renderRefLinkPickerRow(
              `${item.id}/a${stepNum}`,
              'answer',
              `!${num}/a${stepNum}`,
              problem,
              answer,
            ));
          }
        });

        if (rows.length) {
          rowCount += rows.length;
          groups.push(`<div class="ref-link-picker-group">
            <div class="ref-link-picker-group-head">
              <button type="button" class="ref-link-picker-card-id" data-action="ref-picker-filter-id" data-ref-query="!${escapeAttr(num)}">!${escapeHtml(num)}</button>
              ${editingBadge}${tagChips}
            </div>
            ${rows.join('')}
          </div>`);
        }
      }

      const meta = document.getElementById('ref-link-picker-results-meta');
      if (meta) {
        const filterBits = [];
        if (refLinkPickerActiveTags.length) filterBits.push(refLinkPickerActiveTags.join(' + '));
        if (refLinkPickerKindFilter !== 'all') filterBits.push(refLinkPickerKindFilter);
        if (q) filterBits.push(`“${q}”`);
        const filterNote = filterBits.length ? ` · ${filterBits.join(' · ')}` : '';
        meta.dataset.summary = rowCount
          ? `${rowCount} target${rowCount === 1 ? '' : 's'}${filterNote}`
          : `No matches${filterNote || ''} — loosen filters or search.`;
        meta.textContent = meta.dataset.summary;
      }

      root.innerHTML = groups.length
        ? groups.join('')
        : '<p class="ref-link-picker-empty">No matches — try another tag, kind filter, or search.</p>';

      renderRefLinkPickerFilterChrome();
    }

    function openRefLinkPickerPanel() {
      if (!selectionRefPick) return;
      if (issueDrawerRefId) closeIssueRefDrawer();
      const shell = ensureRefLinkPickerShell();
      shell.querySelector('#ref-link-picker-selection').textContent = `Selected: “${selectionRefPick.label}”`;
      resetRefLinkPickerFilters();
      const search = shell.querySelector('#ref-link-picker-search');
      search.value = '';
      populateRefLinkPickerResults();
      shell.hidden = false;
      syncIssueRefPanelOpenClass();
      setTimeout(() => search.focus(), 0);
    }

    function buildIssueRefMarkdown(refToken, label) {
      const parsed = parseIssueRef(refToken);
      if (!parsed) return null;
      pinCurrentIssueRefRevision(parsed);
      const linkLabel = (label.trim() || issueRefAutocompleteLabel(parsed)).replace(/[\[\]]/g, '');
      return `[${linkLabel}](${formatIssueRefInText(parsed)})`;
    }

    function buildSelectionRefPick(ta, sel) {
      const pick = {
        ta,
        start: sel.start,
        end: sel.end,
        label: sel.label,
        textSnapshot: ta.value,
        mode: 'inline',
      };
      if (ta.matches('[data-composer-input]')) {
        pick.mode = 'composer';
        return pick;
      }
      if (ta.matches('[data-followup-input]')) {
        pick.mode = 'followup';
        pick.itemId = ta.dataset.id;
        Object.assign(pick, editSurfaceFromElement(ta));
        return pick;
      }
      pick.itemId = ta.dataset.refItemId;
      pick.field = ta.dataset.refField;
      pick.stepIndex = Number(ta.dataset.refStep);
      Object.assign(pick, editSurfaceFromElement(ta));
      return pick;
    }

    function applySelectionRefPick(refToken) {
      const pick = selectionRefPick;
      selectionRefPick = null;
      pendingInlineEditCommit = null;
      removeMentionMenu();
      closeRefLinkPickerPanel();
      hideSelectionRefToolbar();
      if (!pick) return;
      const markdown = buildIssueRefMarkdown(refToken, pick.label);
      if (!markdown) return;
      const newText = `${pick.textSnapshot.slice(0, pick.start)}${markdown}${pick.textSnapshot.slice(pick.end)}`;

      if (pick.mode === 'composer') {
        const input = document.querySelector('[data-composer-input]');
        if (input) {
          input.value = newText;
          input.focus();
          autoGrowTextarea(input);
        }
        return;
      }

      if (pick.mode === 'followup' && pick.itemId) {
        followupDrafts[pick.itemId] = newText;
        let ta = pick.ta && document.body.contains(pick.ta) ? pick.ta : null;
        if (!ta) {
          const host = editableHostForItem(document.getElementById('app'), pick.itemId, {
            panel: pick.panel,
            canvas: pick.canvas,
          });
          ta = host?.querySelector(`[data-followup-input][data-id="${pick.itemId}"]`) || null;
        }
        if (ta) {
          ta.value = newText;
          autoGrowTextarea(ta);
          ta.focus();
        }
        return;
      }

      if (pick.mode === 'inline' && pick.itemId && pick.field && Number.isFinite(pick.stepIndex)) {
        const step = items[pick.itemId]?.steps[pick.stepIndex];
        if (!step) {
          render();
          return;
        }
        if (pick.field === 'problem') recordProblemEdit(step, newText);
        else recordAnswerEdit(step, newText);
        pendingFocus = {
          id: pick.itemId,
          field: pick.field,
          step: pick.stepIndex,
          panel: !!pick.panel,
          canvas: !!pick.canvas,
        };
        render();
      }
    }

    function insertMention(ta, name) {
      const pos = ta.selectionStart ?? ta.value.length;
      const before = ta.value.slice(0, pos);
      const match = before.match(/@([\w.-]*)$/);
      if (!match) return;
      const start = pos - match[0].length;
      ta.value = `${ta.value.slice(0, start)}@${name} ${ta.value.slice(pos)}`;
      const newPos = start + name.length + 2;
      ta.focus();
      ta.setSelectionRange(newPos, newPos);
    }

    function insertIssueRef(ta, refToken) {
      const pos = ta.selectionStart ?? ta.value.length;
      const before = ta.value.slice(0, pos);
      const match = before.match(/!\d*(?:\/(?:a?\d*))?(?:@v?\d*)?$/);
      if (!match) return;
      const start = pos - match[0].length;
      const parsed = parseIssueRef(refToken);
      if (!parsed) return;
      pinCurrentIssueRefRevision(parsed);
      const label = issueRefAutocompleteLabel(parsed);
      const token = `[${label}](${formatIssueRefInText(parsed)}) `;
      ta.value = `${ta.value.slice(0, start)}${token}${ta.value.slice(pos)}`;
      const newPos = start + token.length;
      ta.focus();
      ta.setSelectionRange(newPos, newPos);
    }

    function replaceTextareaRangeWithIssueRef(ta, start, end, label, refToken) {
      const parsed = parseIssueRef(refToken);
      if (!parsed) return false;
      pinCurrentIssueRefRevision(parsed);
      const linkLabel = (label.trim() || issueRefAutocompleteLabel(parsed)).replace(/[\[\]]/g, '');
      const token = `[${linkLabel}](${formatIssueRefInText(parsed)})`;
      ta.value = `${ta.value.slice(0, start)}${token}${ta.value.slice(end)}`;
      const newPos = start + token.length;
      ta.focus();
      ta.setSelectionRange(newPos, newPos);
      autoGrowTextarea(ta);
      ta.dispatchEvent(new Event('input', { bubbles: true }));
      return true;
    }

    function hideSelectionRefToolbar() {
      if (selectionRefToolbarEl) selectionRefToolbarEl.hidden = true;
      selectionRefToolbarTa = null;
      selectionRefToolbarState = null;
    }

    function activateSelectionRefFromToolbar() {
      const state = selectionRefToolbarState;
      if (!state?.ta) return;
      selectionRefPick = buildSelectionRefPick(state.ta, state);
      if (selectionRefToolbarEl) selectionRefToolbarEl.hidden = true;
      selectionRefToolbarTa = null;
      selectionRefToolbarState = null;
      openRefLinkPickerPanel();
    }

    function ensureSelectionRefToolbar() {
      if (selectionRefToolbarEl) return selectionRefToolbarEl;
      selectionRefToolbarEl = document.createElement('div');
      selectionRefToolbarEl.className = 'selection-ref-toolbar';
      selectionRefToolbarEl.hidden = true;
      selectionRefToolbarEl.setAttribute('role', 'toolbar');
      selectionRefToolbarEl.innerHTML = '<button type="button" class="selection-ref-toolbar-btn" data-action="selection-make-ref">Link to decision…</button>';
      selectionRefToolbarEl.addEventListener('mousedown', (e) => e.preventDefault());
      selectionRefToolbarEl.querySelector('[data-action="selection-make-ref"]').addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        activateSelectionRefFromToolbar();
      });
      document.body.appendChild(selectionRefToolbarEl);
      return selectionRefToolbarEl;
    }

    function isRefEditableTextarea(ta) {
      return !!ta?.matches?.(REF_EDITABLE_TEXTAREA_SEL) && !ta.closest('.issue-ref-panel-body');
    }

    function refEditableTextareaForSelection(eventTarget) {
      const fromTarget = eventTarget?.closest?.('textarea');
      if (isRefEditableTextarea(fromTarget)) return fromTarget;
      const active = document.activeElement;
      if (isRefEditableTextarea(active)) return active;
      if (isRefEditableTextarea(selectionDragTa)) return selectionDragTa;
      return null;
    }

    function finishTextareaSelectionRefToolbar(ta, clientX, clientY) {
      if (!ta) {
        hideSelectionRefToolbar();
        return;
      }
      setTimeout(() => updateSelectionRefToolbar(ta, clientX, clientY), 0);
    }

    function getTextareaSelectionLabel(ta) {
      const start = ta.selectionStart ?? 0;
      const end = ta.selectionEnd ?? 0;
      if (start === end) return null;
      const label = ta.value.slice(start, end).trim();
      return label ? { start, end, label } : null;
    }

    /** @type {HTMLDivElement | null} */
    let textareaSelectionMirrorEl = null;

    function getTextareaSelectionAnchor(ta, start, end) {
      if (!ta || start == null || end == null || start >= end) return null;
      if (!textareaSelectionMirrorEl) {
        textareaSelectionMirrorEl = document.createElement('div');
        textareaSelectionMirrorEl.setAttribute('aria-hidden', 'true');
        textareaSelectionMirrorEl.style.position = 'fixed';
        textareaSelectionMirrorEl.style.visibility = 'hidden';
        textareaSelectionMirrorEl.style.pointerEvents = 'none';
        textareaSelectionMirrorEl.style.whiteSpace = 'pre-wrap';
        textareaSelectionMirrorEl.style.overflowWrap = 'anywhere';
        textareaSelectionMirrorEl.style.wordBreak = 'break-word';
        textareaSelectionMirrorEl.style.zIndex = '-1';
        document.body.appendChild(textareaSelectionMirrorEl);
      }
      const taRect = ta.getBoundingClientRect();
      const cs = getComputedStyle(ta);
      const mirror = textareaSelectionMirrorEl;
      mirror.style.left = `${taRect.left}px`;
      mirror.style.top = `${taRect.top}px`;
      mirror.style.width = `${taRect.width}px`;
      mirror.style.height = `${taRect.height}px`;
      mirror.style.overflow = 'auto';
      mirror.style.boxSizing = cs.boxSizing;
      mirror.style.padding = cs.padding;
      mirror.style.border = cs.border;
      mirror.style.font = cs.font;
      mirror.style.lineHeight = cs.lineHeight;
      mirror.style.letterSpacing = cs.letterSpacing;
      mirror.scrollTop = ta.scrollTop;

      const text = ta.value;
      mirror.innerHTML = `${escapeHtml(text.slice(0, start))}<span data-sel-anchor></span>${escapeHtml(text.slice(end))}`;
      const mid = mirror.querySelector('[data-sel-anchor]');
      if (!mid) return null;
      mid.textContent = text.slice(start, end);

      const midRect = mid.getBoundingClientRect();
      if (!midRect.width && !midRect.height) {
        return { x: taRect.left + taRect.width / 2, y: taRect.top };
      }
      return {
        x: midRect.left + midRect.width / 2,
        y: midRect.top,
      };
    }

    function positionSelectionRefToolbar(toolbar, clientX, clientY) {
      toolbar.hidden = false;
      const margin = 8;
      const w = toolbar.offsetWidth || 160;
      const h = toolbar.offsetHeight || 36;
      const left = Math.min(Math.max(margin, clientX - w / 2), window.innerWidth - w - margin);
      const top = Math.max(margin, clientY - h - 6);
      toolbar.style.left = `${left}px`;
      toolbar.style.top = `${top}px`;
    }

    function updateSelectionRefToolbar(ta, clientX, clientY) {
      if (!isRefEditableTextarea(ta)) {
        hideSelectionRefToolbar();
        return;
      }
      const sel = getTextareaSelectionLabel(ta);
      if (!sel) {
        hideSelectionRefToolbar();
        return;
      }
      const toolbar = ensureSelectionRefToolbar();
      selectionRefToolbarTa = ta;
      selectionRefToolbarState = { ta, start: sel.start, end: sel.end, label: sel.label };
      const anchor = getTextareaSelectionAnchor(ta, sel.start, sel.end);
      const x = anchor?.x ?? clientX ?? ta.getBoundingClientRect().left + ta.clientWidth / 2;
      const y = anchor?.y ?? clientY ?? ta.getBoundingClientRect().top;
      positionSelectionRefToolbar(toolbar, x, y);
    }

    function mountAutocompleteMenu(ta, buildItems) {
      removeMentionMenu();
      const buttons = buildItems();
      if (!buttons.length) return;

      mentionMenuEl = document.createElement('div');
      mentionMenuEl.className = 'mention-menu';
      mentionMenuEl.setAttribute('role', 'listbox');
      buttons.forEach((btn) => mentionMenuEl.appendChild(btn));
      document.body.appendChild(mentionMenuEl);
      const rect = ta.getBoundingClientRect();
      mentionMenuEl.style.left = `${rect.left}px`;
      mentionMenuEl.style.top = `${rect.bottom + 4}px`;
      mentionMenuEl.style.minWidth = `${Math.min(Math.max(rect.width, 200), 320)}px`;
    }

    function bindRichTextAutocomplete(ta) {
      const showMenu = () => {
        removeMentionMenu();
        const pos = ta.selectionStart ?? ta.value.length;
        const before = ta.value.slice(0, pos);
        const mentionMatch = before.match(/@([\w.-]*)$/);
        const issueStepMatch = before.match(/!(\d+)\/(a?)(\d*)$/);
        const issueMatch = before.match(/!(\d*)$/);
        const tagMatch = before.match(/#([\w.-]*)$/);

        if (mentionMatch) {
          const query = mentionMatch[1].toLowerCase();
          const hits = MENTION_PEOPLE.filter((p) => p.toLowerCase().startsWith(query)).slice(0, 8);
          mountAutocompleteMenu(ta, () => hits.map((name) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'mention-menu-item';
            btn.setAttribute('role', 'option');
            btn.textContent = `@${name}`;
            btn.addEventListener('mousedown', (e) => {
              e.preventDefault();
              insertMention(ta, name);
              removeMentionMenu();
            });
            return btn;
          }));
          return;
        }

        if (issueStepMatch) {
          const itemId = normalizeIssueId(issueStepMatch[1]) || `item-${issueStepMatch[1]}`;
          const answerOnly = issueStepMatch[2] === 'a';
          const query = issueStepMatch[3];
          const item = itemId ? items[itemId] : null;
          if (item) {
            mountAutocompleteMenu(ta, () => item.steps.map((step, index) => {
              const stepNum = String(index + 1);
              if (query && !stepNum.startsWith(query)) return null;
              const btn = document.createElement('button');
              btn.type = 'button';
              btn.className = 'mention-menu-item';
              btn.setAttribute('role', 'option');
              const idSpan = document.createElement('span');
              idSpan.className = 'issue-menu-id';
              idSpan.textContent = answerOnly
                ? `!${item.id.replace('item-', '')}/a${stepNum}`
                : `!${item.id.replace('item-', '')}/${stepNum}`;
              const titleSpan = document.createElement('span');
              titleSpan.className = 'issue-menu-title';
              titleSpan.textContent = answerOnly
                ? truncateLabel(step.answer?.trim() || '(no answer)', 56)
                : truncateLabel(step.problem || item.id, 56);
              btn.append(idSpan, titleSpan);
              const refToken = answerOnly
                ? `${item.id}/a${stepNum}`
                : `${item.id}/${stepNum}`;
              btn.addEventListener('mousedown', (e) => {
                e.preventDefault();
                insertIssueRef(ta, refToken);
                removeMentionMenu();
              });
              return btn;
            }).filter(Boolean));
          }
          return;
        }

        if (issueMatch) {
          const query = issueMatch[1];
          const hits = Object.values(items)
            .filter((item) => {
              const num = item.id.replace(/^item-/i, '');
              const problem = item.steps[0]?.problem || '';
              return num.startsWith(query) || problem.toLowerCase().includes(query.toLowerCase());
            })
            .sort((a, b) => a.id.localeCompare(b.id))
            .slice(0, 8);
          mountAutocompleteMenu(ta, () => hits.map((item) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'mention-menu-item';
            btn.setAttribute('role', 'option');
            const idSpan = document.createElement('span');
            idSpan.className = 'issue-menu-id';
            idSpan.textContent = `!${item.id.replace('item-', '')}`;
            const titleSpan = document.createElement('span');
            titleSpan.className = 'issue-menu-title';
            titleSpan.textContent = truncateLabel(item.steps[0]?.problem || item.id);
            btn.append(idSpan, titleSpan);
            btn.addEventListener('mousedown', (e) => {
              e.preventDefault();
              insertIssueRef(ta, item.id);
              removeMentionMenu();
            });
            return btn;
          }));
          return;
        }

        if (tagMatch) {
          const query = tagMatch[1].toLowerCase();
          const hits = allKnownTags()
            .filter((t) => t.toLowerCase().startsWith(query))
            .slice(0, 8);
          const options = query && !hits.includes(normalizeTagName(query))
            ? [normalizeTagName(query), ...hits]
            : hits;
          mountAutocompleteMenu(ta, () => options.map((name) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'mention-menu-item';
            btn.setAttribute('role', 'option');
            btn.textContent = `#${name}`;
            btn.addEventListener('mousedown', (e) => {
              e.preventDefault();
              insertHashTag(ta, name);
              removeMentionMenu();
            });
            return btn;
          }));
        }
      };

      ta.addEventListener('input', showMenu);
      ta.addEventListener('blur', () => setTimeout(removeMentionMenu, 120));
      ta.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') removeMentionMenu();
      });
    }

    function goToIssue(refId, anchorEl = null) {
      const parsed = parseIssueRef(refId);
      const upgradeSource = anchorEl && parsed ? resolveIssueRefSourceField(anchorEl, parsed) : null;
      openIssueRefDrawer(refId, upgradeSource);
    }

    function ensureIssueDrawerShell() {
      if (issueDrawerEl) return issueDrawerEl;
      issueDrawerEl = document.createElement('aside');
      issueDrawerEl.className = 'issue-ref-panel';
      issueDrawerEl.hidden = true;
      issueDrawerEl.setAttribute('role', 'complementary');
      issueDrawerEl.setAttribute('aria-labelledby', 'issue-ref-panel-title');
      issueDrawerEl.innerHTML = `
          <div class="issue-ref-panel-toolbar">
            <span class="issue-ref-panel-title" id="issue-ref-panel-title"></span>
            <button type="button" class="issue-ref-panel-close" data-action="close-issue-drawer" aria-label="Close">×</button>
          </div>
          <div class="issue-ref-panel-body"></div>
      `;
      document.getElementById('app-body').appendChild(issueDrawerEl);
      return issueDrawerEl;
    }

    function populateIssueRefDrawer(refId) {
      const parsed = parseIssueRef(refId);
      if (!parsed) {
        closeIssueRefDrawer();
        return;
      }
      const item = items[parsed.itemId];
      if (!item) {
        closeIssueRefDrawer();
        return;
      }
      const shell = ensureIssueDrawerShell();
      const num = parsed.itemId.replace(/^item-/i, '');
      shell.querySelector('.issue-ref-panel-title').textContent = `!${num}`;
      const body = shell.querySelector('.issue-ref-panel-body');
      const refChrome = parsed.stepIndex == null
        ? buildIssuePanelCardHistoryChrome(item)
        : buildIssuePanelRefChrome(parsed);
      body.innerHTML = `${refChrome}${renderCard(item, {
        highlightRef: panelHighlightRef(parsed),
        idPrefix: PANEL_CARD_ID_PREFIX,
      })}`;
      shell.setAttribute('aria-label', `Decision ${num}`);
    }

    function openIssueRefDrawer(refId, upgradeSource = null) {
      removeIssuePreview();
      if (isRefLinkPickerOpen()) cancelRefLinkPicker();
      if (refId !== issueDrawerRefId) {
        issuePanelViewRev = null;
        issuePanelShowOlderRevisions = false;
        issuePanelCardHistoryView = null;
        issuePanelUpgradeSource = upgradeSource;
      } else if (upgradeSource) {
        issuePanelUpgradeSource = upgradeSource;
      }
      issueDrawerRefId = refId;
      const parsed = parseIssueRef(refId);
      if (parsed && parsed.stepIndex == null && items[parsed.itemId]) {
        initIssuePanelCardHistoryView(items[parsed.itemId]);
      }
      const shell = ensureIssueDrawerShell();
      populateIssueRefDrawer(refId);
      shell.hidden = false;
      syncIssueRefPanelOpenClass();
    }

    function closeIssueRefDrawer() {
      issueDrawerRefId = null;
      issuePanelUpgradeSource = null;
      issuePanelViewRev = null;
      issuePanelDiffOpen = false;
      issuePanelShowOlderRevisions = false;
      issuePanelCardHistoryView = null;
      if (issueDrawerEl) issueDrawerEl.hidden = true;
      syncIssueRefPanelOpenClass();
    }

    function renderRevisionHistoryHtml(step, field, activeRev, { selectable = false, fullText = false, linkedRev = null, minRev = null, stepIndex = null } = {}) {
      const revisions = stepFieldRevisions(step, field);
      if (!revisions.length) return '';
      const head = stepFieldHeadRev(step, field);
      const viewRev = activeRev ?? head;
      let ordered = revisions.slice().sort((a, b) => a.rev - b.rev);
      if (minRev != null) ordered = ordered.filter((entry) => entry.rev >= minRev);
      if (!ordered.length) return '';
      const items = ordered.map((entry) => {
        const active = entry.rev === viewRev;
        const linked = linkedRev != null && entry.rev === linkedRev;
        const date = entry.at ? formatDecisionDate(entry.at) : '';
        const body = fullText
          ? entry.text
          : (field === 'answer'
            ? truncateLabel(entry.text, 180)
            : truncateLabel(entry.text, 160));
        const linkedBadge = linked ? '<span class="rev-linked-badge">linked</span>' : '';
        const meta = `<div class="issue-ref-preview-revision-meta">v${entry.rev}${linkedBadge}${entry.tentative ? ' · tentative' : ''}${entry.rev === head ? ' · current' : ''}</div>`;
        const content = `<span class="revision-timeline-content">${meta}${escapeHtml(body)}</span>`;
        const dateHtml = date
          ? `<time class="revision-timeline-date" datetime="${escapeAttr(entry.at)}">${escapeHtml(date)}</time>`
          : '<span class="revision-timeline-date" aria-hidden="true"></span>';
        const node = `<span class="revision-timeline-node"><span class="revision-timeline-stem-top" aria-hidden="true"></span><span class="revision-timeline-marker" aria-hidden="true"></span><span class="revision-timeline-stem-bottom" aria-hidden="true"></span></span>`;
        const className = `revision-timeline-item${active ? ' is-active' : ''}${linked ? ' is-linked-rev' : ''}`;
        if (selectable) {
          const stepAttr = stepIndex != null ? ` data-step="${stepIndex}"` : '';
          return `<button type="button" class="${className}" data-action="panel-rev-select" data-rev="${entry.rev}" data-field="${field}"${stepAttr}>${dateHtml}${node}${content}</button>`;
        }
        return `<div class="${className}">${dateHtml}${node}${content}</div>`;
      }).join('');
      return `<div class="revision-timeline">${items}</div>`;
    }

    function renderPreviewStepsHtml(item, fromIndex = 0, toIndex = item.steps.length) {
      return item.steps
        .slice(fromIndex, toIndex)
        .map((step) => {
          ensureStepRevisions(step);
          const q = truncateLabel(getProblemText(step), 160);
          const answerText = getAnswerText(step);
          let answerBlock;
          if (answerText) {
            const tent = step.answerTentative ? ' <span aria-hidden="true">⚑</span>' : '';
            answerBlock = `<div class="issue-ref-preview-a">${escapeHtml(truncateLabel(answerText, 140))}${tent}</div>`;
          } else {
            answerBlock = '<div class="issue-ref-preview-a issue-ref-preview-pending">No decision yet</div>';
          }
          return `<div class="issue-ref-preview-step"><div class="issue-ref-preview-q">${escapeHtml(q)}</div>${answerBlock}</div>`;
        })
        .join('');
    }

    function issuePreviewStaleFooter(parsed) {
      if (!isIssueRefStale(parsed)) return '';
      return '<p class="issue-ref-preview-stale">Older revision — click to open the panel.</p>';
    }

    function buildIssuePreviewHtml(refId) {
      const parsed = parseIssueRef(refId);
      if (!parsed) {
        return '<p class="issue-ref-preview-missing">Decision not found</p>';
      }
      const item = items[parsed.itemId];
      if (!item) {
        return '<p class="issue-ref-preview-missing">Decision not found</p>';
      }
      const num = parsed.itemId.replace(/^item-/i, '');
      const stale = isIssueRefStale(parsed);
      const headHtml = `
        <div class="issue-ref-preview-head">
          <span class="issue-ref-preview-id">!${escapeHtml(num)}</span>
          <span class="issue-ref-preview-status">${stale ? 'Stale link' : 'Preview'}</span>
        </div>`;
      const staleFooter = issuePreviewStaleFooter(parsed);

      if (parsed.focusAnswer && parsed.stepIndex != null) {
        const step = item.steps[parsed.stepIndex];
        if (!step) {
          return `${headHtml}<p class="issue-ref-preview-missing">Step not found</p>`;
        }
        ensureStepRevisions(step);
        const headRev = stepFieldHeadRev(step, 'answer');
        const viewRev = parsed.revision ?? headRev;
        const answerText = getAnswerText(step, viewRev);
        const qHtml = getProblemText(step)?.trim()
          ? `<div class="issue-ref-preview-q">${escapeHtml(truncateLabel(getProblemText(step), 160))}</div>`
          : '';
        const answerBlock = answerText
          ? `<div class="issue-ref-preview-a issue-ref-preview-answer-main">${escapeHtml(truncateLabel(answerText, 220))}</div>`
          : '<div class="issue-ref-preview-a issue-ref-preview-pending issue-ref-preview-answer-main">No decision yet</div>';
        return `${headHtml}<div class="issue-ref-preview-answer-slot">${qHtml}${answerBlock}</div>${staleFooter}`;
      }

      if (parsed.stepIndex != null) {
        const step = item.steps[parsed.stepIndex];
        if (!step) {
          return `${headHtml}<p class="issue-ref-preview-missing">Step not found</p>`;
        }
        ensureStepRevisions(step);
        const viewRev = parsed.revision ?? stepFieldHeadRev(step, 'problem');
        const q = truncateLabel(getProblemText(step, viewRev), 160);
        const answerText = getAnswerText(step);
        let answerBlock;
        if (answerText) {
          const tent = step.answerTentative ? ' <span aria-hidden="true">⚑</span>' : '';
          answerBlock = `<div class="issue-ref-preview-a">${escapeHtml(truncateLabel(answerText, 140))}${tent}</div>`;
        } else {
          answerBlock = '<div class="issue-ref-preview-a issue-ref-preview-pending">No decision yet</div>';
        }
        return `${headHtml}<div class="issue-ref-preview-step"><div class="issue-ref-preview-q">${escapeHtml(q)}</div>${answerBlock}</div>${staleFooter}`;
      }

      return `${headHtml}${renderPreviewStepsHtml(item)}${staleFooter}`;
    }

    function bindIssuePreviewInteractions() {
      /* Hover preview is read-only; history and updates live in the side panel. */
    }

    function lockIssuePreviewDismiss(ms = 400) {
      issuePreviewDismissLocked = true;
      if (issuePreviewHideTimer) {
        clearTimeout(issuePreviewHideTimer);
        issuePreviewHideTimer = null;
      }
      if (issuePreviewDismissLockTimer) clearTimeout(issuePreviewDismissLockTimer);
      issuePreviewDismissLockTimer = setTimeout(() => {
        issuePreviewDismissLockTimer = null;
        issuePreviewDismissLocked = false;
      }, ms);
    }

    function scrollPageToRevealIssuePreview() {
      if (!issuePreviewEl) return;
      issuePreviewEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function positionIssuePreview(anchor) {
      if (!issuePreviewEl) return;
      const gap = 6;
      const margin = 8;
      const vh = window.innerHeight;
      const scrollX = window.scrollX;
      const scrollY = window.scrollY;
      const rect = anchor.getBoundingClientRect();
      issuePreviewEl.style.left = '0';
      issuePreviewEl.style.top = '0';
      const pop = issuePreviewEl.getBoundingClientRect();
      let left = rect.left + rect.width / 2 - pop.width / 2;
      left = Math.max(margin, Math.min(left, window.innerWidth - pop.width - margin));
      const spaceBelow = vh - margin - (rect.bottom + gap);
      const spaceAbove = rect.top - gap - margin;
      if (!issuePreviewEl.dataset.placement) {
        issuePreviewEl.dataset.placement = spaceBelow >= pop.height || spaceBelow >= spaceAbove ? 'below' : 'above';
      }
      let docTop;
      if (issuePreviewEl.dataset.placement === 'above') {
        docTop = scrollY + rect.top - gap - pop.height;
      } else {
        docTop = scrollY + rect.bottom + gap;
      }
      issuePreviewEl.style.left = `${scrollX + left}px`;
      issuePreviewEl.style.top = `${Math.max(scrollY + margin, docTop)}px`;
    }

    function removeIssuePreview() {
      if (issuePreviewShowTimer) {
        clearTimeout(issuePreviewShowTimer);
        issuePreviewShowTimer = null;
      }
      if (issuePreviewHideTimer) {
        clearTimeout(issuePreviewHideTimer);
        issuePreviewHideTimer = null;
      }
      if (issuePreviewDismissLockTimer) {
        clearTimeout(issuePreviewDismissLockTimer);
        issuePreviewDismissLockTimer = null;
      }
      issuePreviewDismissLocked = false;
      issuePreviewAnchor = null;
      if (issuePreviewEl) {
        issuePreviewEl.remove();
        issuePreviewEl = null;
      }
    }

    function scheduleHideIssuePreview() {
      if (issuePreviewDismissLocked) return;
      if (issuePreviewHideTimer) clearTimeout(issuePreviewHideTimer);
      issuePreviewHideTimer = setTimeout(removeIssuePreview, 120);
    }

    function showIssuePreview(anchor, refId) {
      if (issuePreviewEl && issuePreviewAnchor === anchor) {
        positionIssuePreview(anchor);
        return;
      }
      removeIssuePreview();
      issuePreviewAnchor = anchor;
      issuePreviewEl = document.createElement('div');
      const parsed = parseIssueRef(refId);
      const previewStale = parsed && isIssueRefStale(parsed);
      issuePreviewEl.className = 'issue-ref-preview'
        + (parsed?.focusAnswer ? ' issue-ref-preview-answer-ref' : '')
        + (previewStale ? ' issue-ref-preview-is-stale' : '');
      issuePreviewEl.setAttribute('role', 'tooltip');
      issuePreviewEl.dataset.refId = refId;
      const sourceEditable = anchor.closest('[data-editable]');
      if (sourceEditable) {
        const sf = sourceEditable.dataset.editable;
        if (sf === 'problem' || sf === 'answer') {
          issuePreviewEl.dataset.sourceItem = sourceEditable.dataset.id;
          issuePreviewEl.dataset.sourceField = sf;
          issuePreviewEl.dataset.sourceStep = sourceEditable.dataset.step;
        }
      }
      issuePreviewEl.innerHTML = buildIssuePreviewHtml(refId);
      bindIssuePreviewInteractions();
      issuePreviewEl.addEventListener('mouseenter', () => {
        if (issuePreviewHideTimer) {
          clearTimeout(issuePreviewHideTimer);
          issuePreviewHideTimer = null;
        }
      });
      issuePreviewEl.addEventListener('mouseleave', scheduleHideIssuePreview);
      document.body.appendChild(issuePreviewEl);
      delete issuePreviewEl.dataset.placement;
      positionIssuePreview(anchor);
      scrollPageToRevealIssuePreview();
    }

    function bindIssueRefPreviewEvents() {
      const app = document.getElementById('app-body');
      app.addEventListener('mouseover', (e) => {
        const ref = e.target.closest('[data-action="goto-issue"]');
        if (!ref) return;
        if (ref.closest('.issue-ref-panel-body .card-readonly')) return;
        const from = e.relatedTarget;
        if (from && ref.contains(from)) return;
        if (issuePreviewHideTimer) {
          clearTimeout(issuePreviewHideTimer);
          issuePreviewHideTimer = null;
        }
        if (issuePreviewShowTimer) clearTimeout(issuePreviewShowTimer);
        issuePreviewShowTimer = setTimeout(() => {
          issuePreviewShowTimer = null;
          showIssuePreview(ref, ref.dataset.issueRef);
        }, 220);
      });
      app.addEventListener('mouseout', (e) => {
        const ref = e.target.closest('[data-action="goto-issue"]');
        if (!ref) return;
        if (ref.closest('.issue-ref-panel-body .card-readonly')) return;
        const to = e.relatedTarget;
        if (to && ref.contains(to)) return;
        if (to && issuePreviewEl?.contains(to)) return;
        if (issuePreviewShowTimer) {
          clearTimeout(issuePreviewShowTimer);
          issuePreviewShowTimer = null;
        }
        scheduleHideIssuePreview();
      });
      window.addEventListener(
        'scroll',
        () => {
          if (issuePreviewEl && issuePreviewAnchor) {
            positionIssuePreview(issuePreviewAnchor);
          }
        },
        true,
      );
    }

    function deleteItem(id) {
      delete items[id];
      delete followupDrafts[id];
      delete canvasPlacements[id];
    }

    function removeFromCanvas(id) {
      delete canvasPlacements[id];
      scheduleSaveState();
      render();
    }

    const CANVAS_CARD_WIDTH = 420;
    const CANVAS_DROP_OFFSET_Y = 24;
    const CANVAS_CARD_EST_H = 360;
    const CANVAS_WORLD_MIN_W = 30000;
    const CANVAS_WORLD_MIN_H = 30000;
    const CANVAS_ZOOM_MIN = 0.05;
    const CANVAS_ZOOM_MAX = 2.5;

    // Layer order uses fractional indexing (Figma / Evan Wallace) — one string key per
    // object; sort keys lexicographically; reorder = assign a new key between neighbors.
    function canvasGenerateKeyBetween(a, b) {
      if (window.__canvasFidx) return window.__canvasFidx.generateKeyBetween(a, b);
      return canvasGenerateKeyBetweenFallback(a, b);
    }

    function canvasGenerateKeyBetweenFallback(a, b) {
      if (a == null && b == null) return 'a0';
      if (b == null) return `${a || 'a0'}U`;
      if (a == null) return `Z${b}`;
      if (a >= b) throw new Error('invalid layer order');
      return `${a}U`;
    }

    function canvasPlacementsSortedIds() {
      return Object.keys(canvasPlacements)
        .filter((id) => items[id])
        .sort((a, b) => {
          const oa = canvasPlacements[a].order || '';
          const ob = canvasPlacements[b].order || '';
          if (oa < ob) return -1;
          if (oa > ob) return 1;
          return a.localeCompare(b);
        });
    }

    function ensureCanvasPlacementOrder(id) {
      const placement = canvasPlacements[id];
      if (!placement || placement.order) return;
      const sorted = canvasPlacementsSortedIds().filter((x) => x !== id && canvasPlacements[x].order);
      const back = sorted.length ? canvasPlacements[sorted[sorted.length - 1]].order : null;
      placement.order = canvasGenerateKeyBetween(back, null);
    }

    function migrateCanvasPlacementOrders() {
      for (const id of Object.keys(canvasPlacements)) {
        if (items[id]) ensureCanvasPlacementOrder(id);
      }
    }

    function canvasAssignOrderAtFront(id) {
      if (!canvasPlacements[id]) return;
      const sorted = canvasPlacementsSortedIds();
      if (sorted[sorted.length - 1] === id) return;
      const sortedWithout = sorted.filter((x) => x !== id);
      const backKey = sortedWithout.length
        ? canvasPlacements[sortedWithout[sortedWithout.length - 1]].order
        : null;
      canvasPlacements[id].order = canvasGenerateKeyBetween(backKey, null);
    }

    function canvasSurfaceEl() {
      return document.querySelector('[data-canvas-surface]');
    }

    function canvasWorldEl() {
      return canvasSurfaceEl()?.querySelector('.canvas-world') ?? null;
    }

    function clampCanvasZoom(zoom) {
      return Math.min(CANVAS_ZOOM_MAX, Math.max(CANVAS_ZOOM_MIN, zoom));
    }

    function normalizeCanvasViewport(raw) {
      if (!raw || typeof raw !== 'object') {
        return { scrollLeft: 0, scrollTop: 0, zoom: 1 };
      }
      const zoom = clampCanvasZoom(Number(raw.zoom) || 1);
      if (typeof raw.scrollLeft === 'number' || typeof raw.scrollTop === 'number') {
        return {
          scrollLeft: Math.max(0, Number(raw.scrollLeft) || 0),
          scrollTop: Math.max(0, Number(raw.scrollTop) || 0),
          zoom,
        };
      }
      const panX = Number(raw.panX) || 0;
      const panY = Number(raw.panY) || 0;
      return {
        scrollLeft: Math.max(0, -panX),
        scrollTop: Math.max(0, -panY),
        zoom,
      };
    }

    function canvasScrollContentEl() {
      return canvasSurfaceEl()?.querySelector('[data-canvas-scroll-content]') ?? null;
    }

    function canvasScaledWorldSize() {
      const { w, h } = canvasWorldExtent();
      const zoom = canvasViewport.zoom;
      return {
        w: Math.max(1, Math.ceil(w * zoom)),
        h: Math.max(1, Math.ceil(h * zoom)),
      };
    }

    function canvasWorldPadding() {
      return { padX: 0, padY: 0 };
    }

    function canvasMaxScroll(surface) {
      const scaled = canvasScaledWorldSize();
      return {
        maxLeft: Math.max(0, scaled.w - surface.clientWidth),
        maxTop: Math.max(0, scaled.h - surface.clientHeight),
      };
    }

    function clampCanvasViewportScroll(surface) {
      const { maxLeft, maxTop } = canvasMaxScroll(surface);
      canvasViewport.scrollLeft = Math.min(Math.max(0, canvasViewport.scrollLeft), maxLeft);
      canvasViewport.scrollTop = Math.min(Math.max(0, canvasViewport.scrollTop), maxTop);
    }

    function applyCanvasScrollLayout() {
      const surface = canvasSurfaceEl();
      const world = canvasWorldEl();
      const scrollContent = canvasScrollContentEl();
      if (!surface || !world || !scrollContent) return;

      const { w, h } = canvasWorldExtent();
      world.style.width = `${w}px`;
      world.style.height = `${h}px`;

      const zoom = canvasViewport.zoom;
      world.style.transform = `scale(${zoom})`;
      world.style.transformOrigin = '0 0';
      world.style.marginLeft = '0';
      world.style.marginTop = '0';

      const scaled = canvasScaledWorldSize();
      scrollContent.style.width = `${scaled.w}px`;
      scrollContent.style.height = `${scaled.h}px`;

      clampCanvasViewportScroll(surface);

      canvasScrollSyncing = true;
      surface.scrollLeft = canvasViewport.scrollLeft;
      surface.scrollTop = canvasViewport.scrollTop;
      canvasScrollSyncing = false;
      updateCanvasEdgeIndicators();
    }

    function canvasViewportWorldRect(surface = canvasSurfaceEl()) {
      if (!surface) return null;
      const zoom = canvasViewport.zoom;
      const x0 = canvasViewport.scrollLeft / zoom;
      const y0 = canvasViewport.scrollTop / zoom;
      return {
        x0,
        y0,
        x1: x0 + surface.clientWidth / zoom,
        y1: y0 + surface.clientHeight / zoom,
      };
    }

    const CANVAS_EDGE_TICK_MIN = 8;
    const CANVAS_EDGE_CORNER_INSET = 11;

    function canvasEdgeProjectHorizontal(card, surface) {
      const zoom = canvasViewport.zoom;
      const sl = canvasViewport.scrollLeft;
      const vw = surface.clientWidth;
      let x0 = card.minX * zoom - sl;
      let x1 = card.maxX * zoom - sl;
      if (x1 < 0 || x0 > vw) {
        const cx = ((card.minX + card.maxX) / 2) * zoom - sl;
        const c = Math.max(0, Math.min(vw, cx));
        return { left: c - CANVAS_EDGE_TICK_MIN / 2, width: CANVAS_EDGE_TICK_MIN };
      }
      x0 = Math.max(0, Math.min(vw, x0));
      x1 = Math.max(0, Math.min(vw, x1));
      let width = x1 - x0;
      let left = x0;
      if (width < CANVAS_EDGE_TICK_MIN) {
        const mid = (x0 + x1) / 2;
        left = Math.max(0, Math.min(vw - CANVAS_EDGE_TICK_MIN, mid - CANVAS_EDGE_TICK_MIN / 2));
        width = CANVAS_EDGE_TICK_MIN;
      }
      return { left, width };
    }

    function canvasEdgeProjectVertical(card, surface) {
      const zoom = canvasViewport.zoom;
      const st = canvasViewport.scrollTop;
      const vh = surface.clientHeight;
      let y0 = card.minY * zoom - st;
      let y1 = card.maxY * zoom - st;
      if (y1 < 0 || y0 > vh) {
        const cy = ((card.minY + card.maxY) / 2) * zoom - st;
        const c = Math.max(0, Math.min(vh, cy));
        return { top: c - CANVAS_EDGE_TICK_MIN / 2, height: CANVAS_EDGE_TICK_MIN };
      }
      y0 = Math.max(0, Math.min(vh, y0));
      y1 = Math.max(0, Math.min(vh, y1));
      let height = y1 - y0;
      let top = y0;
      if (height < CANVAS_EDGE_TICK_MIN) {
        const mid = (y0 + y1) / 2;
        top = Math.max(0, Math.min(vh - CANVAS_EDGE_TICK_MIN, mid - CANVAS_EDGE_TICK_MIN / 2));
        height = CANVAS_EDGE_TICK_MIN;
      }
      return { top, height };
    }

    function appendCanvasEdgeTick(root, side, style) {
      const el = document.createElement('span');
      el.className = `canvas-edge-tick canvas-edge-tick--${side}`;
      Object.assign(el.style, style);
      root.appendChild(el);
    }

    function appendCanvasEdgeCorner(root, corner) {
      const el = document.createElement('span');
      el.className = `canvas-edge-corner canvas-edge-corner--${corner}`;
      root.appendChild(el);
    }

    function canvasPlacedCardBoundsWorld(id) {
      const p = canvasPlacements[id];
      if (!p) return null;
      const world = canvasWorldEl();
      const el = world?.querySelector(`[data-canvas-placed="${id}"]`);
      const w = el?.offsetWidth || CANVAS_CARD_WIDTH;
      const h = el?.offsetHeight || CANVAS_CARD_EST_H;
      return {
        minX: p.x,
        minY: p.y,
        maxX: p.x + w,
        maxY: p.y + h,
      };
    }

    function canvasEdgeTrimHorizontalSpan(span, surface, trimStart, trimEnd) {
      const vw = surface.clientWidth;
      let left = span.left;
      let right = span.left + span.width;
      if (trimStart) left = Math.max(left, CANVAS_EDGE_CORNER_INSET);
      if (trimEnd) right = Math.min(right, vw - CANVAS_EDGE_CORNER_INSET);
      const width = right - left;
      if (width < CANVAS_EDGE_TICK_MIN) return null;
      return { left, width };
    }

    function canvasEdgeTrimVerticalSpan(span, surface, trimStart, trimEnd) {
      const vh = surface.clientHeight;
      let top = span.top;
      let bottom = span.top + span.height;
      if (trimStart) top = Math.max(top, CANVAS_EDGE_CORNER_INSET);
      if (trimEnd) bottom = Math.min(bottom, vh - CANVAS_EDGE_CORNER_INSET);
      const height = bottom - top;
      if (height < CANVAS_EDGE_TICK_MIN) return null;
      return { top, height };
    }

    function updateCanvasEdgeIndicators() {
      const surface = canvasSurfaceEl();
      const root = document.querySelector('[data-canvas-edge-indicators]');
      if (!surface || !root) return;

      root.replaceChildren();
      const view = canvasViewportWorldRect(surface);
      if (!view) return;

      for (const id of Object.keys(canvasPlacements)) {
        if (!items[id]) continue;
        const card = canvasPlacedCardBoundsWorld(id);
        if (!card) continue;

        const offTop = card.maxY <= view.y0;
        const offBottom = card.minY >= view.y1;
        const offLeft = card.maxX <= view.x0;
        const offRight = card.minX >= view.x1;

        if (offTop && offLeft) appendCanvasEdgeCorner(root, 'tl');
        if (offTop && offRight) appendCanvasEdgeCorner(root, 'tr');
        if (offBottom && offLeft) appendCanvasEdgeCorner(root, 'bl');
        if (offBottom && offRight) appendCanvasEdgeCorner(root, 'br');

        if (offTop) {
          const trimmed = canvasEdgeTrimHorizontalSpan(
            canvasEdgeProjectHorizontal(card, surface),
            surface,
            offLeft,
            offRight,
          );
          if (trimmed) {
            appendCanvasEdgeTick(root, 'top', {
              left: `${trimmed.left}px`,
              width: `${trimmed.width}px`,
            });
          }
        }
        if (offBottom) {
          const trimmed = canvasEdgeTrimHorizontalSpan(
            canvasEdgeProjectHorizontal(card, surface),
            surface,
            offLeft,
            offRight,
          );
          if (trimmed) {
            appendCanvasEdgeTick(root, 'bottom', {
              left: `${trimmed.left}px`,
              width: `${trimmed.width}px`,
            });
          }
        }
        if (offLeft) {
          const trimmed = canvasEdgeTrimVerticalSpan(
            canvasEdgeProjectVertical(card, surface),
            surface,
            offTop,
            offBottom,
          );
          if (trimmed) {
            appendCanvasEdgeTick(root, 'left', {
              top: `${trimmed.top}px`,
              height: `${trimmed.height}px`,
            });
          }
        }
        if (offRight) {
          const trimmed = canvasEdgeTrimVerticalSpan(
            canvasEdgeProjectVertical(card, surface),
            surface,
            offTop,
            offBottom,
          );
          if (trimmed) {
            appendCanvasEdgeTick(root, 'right', {
              top: `${trimmed.top}px`,
              height: `${trimmed.height}px`,
            });
          }
        }
      }
    }

    function updateCanvasZoomControlLabel() {
      const label = document.querySelector('[data-canvas-zoom-label]');
      if (label) label.textContent = `${Math.round(canvasViewport.zoom * 100)}%`;
    }

    function canvasViewportCenterClient() {
      const surface = canvasSurfaceEl();
      if (!surface) return null;
      const rect = surface.getBoundingClientRect();
      return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    }

    function canvasZoomByFactor(factor) {
      const center = canvasViewportCenterClient();
      if (!center) return;
      canvasZoomAt(center.x, center.y, factor);
    }

    function canvasZoomReset() {
      const center = canvasViewportCenterClient();
      if (!center || canvasViewport.zoom === 1) return;
      canvasZoomAt(center.x, center.y, 1 / canvasViewport.zoom);
    }

    function syncCanvasViewport() {
      applyCanvasScrollLayout();
      updateCanvasZoomControlLabel();
      scheduleSaveState();
    }

    function alignCanvasScrollAfterLayout(surface) {
      const scaled = canvasScaledWorldSize();
      if (scaled.w <= surface.clientWidth && scaled.h <= surface.clientHeight) {
        canvasViewport.scrollLeft = 0;
        canvasViewport.scrollTop = 0;
      } else {
        canvasViewport.scrollLeft = Math.max(
          0,
          Math.round((scaled.w - surface.clientWidth) / 2),
        );
        canvasViewport.scrollTop = Math.max(
          0,
          Math.round((scaled.h - surface.clientHeight) / 2),
        );
      }
      clampCanvasViewportScroll(surface);
      canvasScrollSyncing = true;
      surface.scrollLeft = canvasViewport.scrollLeft;
      surface.scrollTop = canvasViewport.scrollTop;
      canvasScrollSyncing = false;
    }

    function centerCanvasViewport(surface) {
      applyCanvasScrollLayout();
      alignCanvasScrollAfterLayout(surface);
    }

    function popCanvasPlacedCard(itemId) {
      const world = canvasWorldEl();
      const placed = world?.querySelector(`[data-canvas-placed="${itemId}"]`);
      const card = placed?.querySelector('.card');
      if (!placed || !card) return;
      placed.classList.remove('is-canvas-reveal-pop');
      void card.offsetWidth;
      placed.classList.add('is-canvas-reveal-pop');
      const onEnd = (e) => {
        if (e.target !== card) return;
        placed.classList.remove('is-canvas-reveal-pop');
        card.removeEventListener('animationend', onEnd);
      };
      card.addEventListener('animationend', onEnd);
    }

    function centerCanvasViewportOnCard(itemId) {
      const surface = canvasSurfaceEl();
      if (!surface || !itemId || !canvasPlacements[itemId]) return;
      applyCanvasScrollLayout();
      const bounds = canvasPlacedCardBoundsWorld(itemId);
      if (!bounds) return;
      const zoom = canvasViewport.zoom;
      const centerX = (bounds.minX + bounds.maxX) / 2;
      const centerY = (bounds.minY + bounds.maxY) / 2;
      canvasViewport.scrollLeft = centerX * zoom - surface.clientWidth / 2;
      canvasViewport.scrollTop = centerY * zoom - surface.clientHeight / 2;
      clampCanvasViewportScroll(surface);
      canvasScrollSyncing = true;
      surface.scrollLeft = canvasViewport.scrollLeft;
      surface.scrollTop = canvasViewport.scrollTop;
      canvasScrollSyncing = false;
      canvasViewportUserSet = true;
      updateCanvasEdgeIndicators();
      popCanvasPlacedCard(itemId);
    }

    function canvasZoomAt(clientX, clientY, scaleFactor) {
      const surface = canvasSurfaceEl();
      const world = canvasWorldEl();
      if (!surface || !world || !scaleFactor) return;
      const rect = surface.getBoundingClientRect();
      const mx = clientX - rect.left;
      const my = clientY - rect.top;
      const zoom = canvasViewport.zoom;
      const { padX, padY } = canvasWorldPadding(surface, world);
      const worldX = (surface.scrollLeft + mx - padX) / zoom;
      const worldY = (surface.scrollTop + my - padY) / zoom;
      const newZoom = clampCanvasZoom(zoom * scaleFactor);
      canvasViewport.zoom = newZoom;
      applyCanvasScrollLayout();
      const { padX: nextPadX, padY: nextPadY } = canvasWorldPadding(surface, world);
      canvasViewport.scrollLeft = Math.max(0, worldX * newZoom + nextPadX - mx);
      canvasViewport.scrollTop = Math.max(0, worldY * newZoom + nextPadY - my);
      canvasViewportUserSet = true;
      const scaled = canvasScaledWorldSize();
      if (scaled.w <= surface.clientWidth && scaled.h <= surface.clientHeight) {
        canvasViewport.scrollLeft = 0;
        canvasViewport.scrollTop = 0;
      }
      clampCanvasViewportScroll(surface);
      canvasScrollSyncing = true;
      surface.scrollLeft = canvasViewport.scrollLeft;
      surface.scrollTop = canvasViewport.scrollTop;
      canvasScrollSyncing = false;
      updateCanvasZoomControlLabel();
      scheduleSaveState();
    }

    function onCanvasWheel(e) {
      if (!e.target.closest('[data-canvas-surface]')) return;
      const pinchOrZoom = e.ctrlKey || e.metaKey;
      if (pinchOrZoom) {
        e.preventDefault();
        const factor = Math.exp(-e.deltaY * 0.002);
        canvasZoomAt(e.clientX, e.clientY, factor);
      }
    }

    function onCanvasSurfaceScroll() {
      if (canvasScrollSyncing) return;
      const surface = canvasSurfaceEl();
      if (!surface) return;
      canvasViewport.scrollLeft = surface.scrollLeft;
      canvasViewport.scrollTop = surface.scrollTop;
      clampCanvasViewportScroll(surface);
      if (surface.scrollLeft !== canvasViewport.scrollLeft) {
        canvasScrollSyncing = true;
        surface.scrollLeft = canvasViewport.scrollLeft;
        surface.scrollTop = canvasViewport.scrollTop;
        canvasScrollSyncing = false;
      }
      canvasViewportUserSet = true;
      updateCanvasEdgeIndicators();
      scheduleSaveState();
    }

    function bindCanvasSurfaceWheel(surface) {
      if (surface.dataset.wheelBound) return;
      surface.dataset.wheelBound = '1';
      surface.addEventListener('wheel', onCanvasWheel, { passive: false });
      surface.addEventListener('scroll', onCanvasSurfaceScroll, { passive: true });
      if (!surface.dataset.resizeBound) {
        surface.dataset.resizeBound = '1';
        new ResizeObserver(() => {
          if (canvasPanState) return;
          applyCanvasScrollLayout();
        }).observe(surface);
      }
    }

    function applyCanvasViewport() {
      const surface = canvasSurfaceEl();
      if (!surface) return;
      bindCanvasSurfaceWheel(surface);
      requestAnimationFrame(() => {
        applyCanvasScrollLayout();
        if (!canvasViewportUserSet) {
          centerCanvasViewport(surface);
        }
        updateCanvasZoomControlLabel();
        updateCanvasEdgeIndicators();
      });
    }

    function renderCanvasZoomControlsHtml() {
      const pct = Math.round(canvasViewport.zoom * 100);
      return `
        <div class="canvas-zoom-controls" aria-label="Canvas zoom">
          <button type="button" class="canvas-zoom-btn" data-action="canvas-zoom-out" aria-label="Zoom out">−</button>
          <button type="button" class="canvas-zoom-btn canvas-zoom-btn--label" data-action="canvas-zoom-reset" data-canvas-zoom-label aria-label="Reset zoom to 100%">${pct}%</button>
          <button type="button" class="canvas-zoom-btn" data-action="canvas-zoom-in" aria-label="Zoom in">+</button>
        </div>
      `;
    }

    function migrateCanvasPlacementsToCenteredWorld() {
      const positions = Object.values(canvasPlacements);
      if (!positions.length) return;
      const maxX = Math.max(...positions.map((p) => p.x));
      const maxY = Math.max(...positions.map((p) => p.y));
      if (maxX > CANVAS_WORLD_MIN_W * 0.35) return;
      const shiftX = Math.round(CANVAS_WORLD_MIN_W / 2 - 480);
      const shiftY = Math.round(CANVAS_WORLD_MIN_H / 2 - 360);
      for (const id of Object.keys(canvasPlacements)) {
        canvasPlacements[id] = {
          x: canvasPlacements[id].x + shiftX,
          y: canvasPlacements[id].y + shiftY,
        };
      }
    }

    function canvasTypingFocus() {
      const el = document.activeElement;
      if (!el) return false;
      if (el.matches('textarea, input, select, [contenteditable="true"]')) return true;
      return !!el.closest('[contenteditable="true"]');
    }

    function canvasWorldExtent() {
      return { w: CANVAS_WORLD_MIN_W, h: CANVAS_WORLD_MIN_H };
    }

    function clampAllCanvasPlacementsToWorld() {
      const { w, h } = canvasWorldExtent();
      for (const id of Object.keys(canvasPlacements)) {
        const p = canvasPlacements[id];
        if (!p) continue;
        p.x = Math.max(8, Math.min(p.x, w - CANVAS_CARD_WIDTH - 8));
        p.y = Math.max(8, Math.min(p.y, h - 120));
      }
    }

    function tryStartCanvasPan(e) {
      if (viewMode !== 'list') return false;
      const surface = e.target.closest('[data-canvas-surface]');
      if (!surface) return false;
      const onCard = e.target.closest('.canvas-placed-card');
      const middle = e.button === 1;
      const spacePan = canvasSpaceHeld && e.button === 0;
      const backgroundPan = e.button === 0 && !onCard;
      if (!middle && !spacePan && !backgroundPan) return false;
      if (canvasPointerState || canvasPanState) return false;

      canvasPanState = {
        surface,
        pointerId: e.pointerId,
        startX: e.clientX,
        startY: e.clientY,
        startScrollLeft: surface.scrollLeft,
        startScrollTop: surface.scrollTop,
      };
      surface.classList.add('is-panning');
      surface.setPointerCapture(e.pointerId);
      e.preventDefault();
      return true;
    }

    function endCanvasPan(e) {
      const pan = canvasPanState;
      if (!pan || e.pointerId !== pan.pointerId) return false;
      pan.surface.classList.remove('is-panning');
      canvasPanState = null;
      canvasViewportUserSet = true;
      scheduleSaveState();
      return true;
    }

    function canvasPointFromClient(surface, clientX, clientY) {
      const rect = surface.getBoundingClientRect();
      const mx = clientX - rect.left;
      const my = clientY - rect.top;
      const world = canvasWorldEl();
      const { padX, padY } = canvasWorldPadding(surface, world);
      const zoom = canvasViewport.zoom;
      return {
        x: (surface.scrollLeft + mx - padX) / zoom,
        y: (surface.scrollTop + my - padY) / zoom,
      };
    }

    function clampCanvasPlacement(x, y) {
      const { w, h } = canvasWorldExtent();
      return {
        x: Math.max(8, Math.min(Math.round(x), w - CANVAS_CARD_WIDTH - 8)),
        y: Math.max(8, Math.min(Math.round(y), h - 120)),
      };
    }

    function placeCardOnCanvas(itemId, clientX, clientY) {
      const surface = canvasSurfaceEl();
      if (!surface || !items[itemId]) return;
      const pt = canvasPointFromClient(surface, clientX, clientY);
      const pos = clampCanvasPlacement(
        pt.x - CANVAS_CARD_WIDTH / 2,
        pt.y - CANVAS_DROP_OFFSET_Y,
      );
      canvasPlacements[itemId] = pos;
      ensureCanvasPlacementOrder(itemId);
      canvasAssignOrderAtFront(itemId);
      scheduleSaveState();
      render();
    }

    function renderCanvasPlacedCard(item, pos, layerIndex) {
      return `
        <div class="canvas-placed-card" data-canvas-placed="${escapeAttr(item.id)}" style="left:${pos.x}px;top:${pos.y}px;z-index:${layerIndex}">
          ${renderCard(item, { idPrefix: CANVAS_CARD_ID_PREFIX })}
        </div>
      `;
    }

    function editSurfaceFromElement(el) {
      return {
        panel: !!el?.closest('.issue-ref-panel-body'),
        canvas: !!el?.closest('.canvas-placed-card'),
      };
    }

    function editableHostForItem(app, itemId, { panel = false, canvas = false } = {}) {
      const root = app || document.getElementById('app');
      if (!root) return null;
      if (panel) return root.querySelector('.issue-ref-panel-body') || root;
      if (canvas) {
        const placed = root.querySelector(`.canvas-placed-card[data-canvas-placed="${itemId}"]`);
        if (placed) return placed;
      }
      return root.querySelector('.workspace-list') || root;
    }

    function findEditableField(app, { id, field, step = 0, panel = false, canvas = false }) {
      const host = editableHostForItem(app, id, { panel, canvas });
      if (!host) return null;
      if (field === 'tags') return host.querySelector(`[data-editable="tags"][data-id="${id}"]`);
      return host.querySelector(`[data-editable="${field}"][data-id="${id}"][data-step="${step}"]`);
    }

    function renderCanvasSurfaceHtml() {
      const sortedIds = canvasPlacementsSortedIds();
      const placed = sortedIds
        .map((id, i) => renderCanvasPlacedCard(items[id], canvasPlacements[id], i + 1))
        .join('');
      const hint = placed
        ? ''
        : '<p class="canvas-hint">Drag cards from the list · drag or scroll to pan · pinch or ⌘/Ctrl+scroll to zoom</p>';
      const { w, h } = canvasWorldExtent();
      return `
        <div class="spatial-canvas" data-canvas-surface role="region" aria-label="Decision canvas">
          <div class="canvas-scroll-content" data-canvas-scroll-content>
            <div class="canvas-world" style="width:${w}px;height:${h}px">
              ${hint}
              ${placed}
            </div>
          </div>
        </div>
      `;
    }

    function renderCanvasFrameHtml() {
      return `
        <div class="canvas-frame" data-canvas-frame>
          ${renderCanvasSurfaceHtml()}
          <div class="canvas-edge-indicators" data-canvas-edge-indicators aria-hidden="true"></div>
        </div>
      `;
    }

    let workspaceLinkHover = null;

    function clearWorkspaceLinkHover() {
      workspaceLinkHover = null;
      document.querySelectorAll('.is-workspace-link-hover').forEach((el) => {
        el.classList.remove('is-workspace-link-hover');
      });
    }

    function workspaceLinkFromNode(node) {
      if (!node?.closest) return null;
      const listCard = node.closest('.workspace-list .list-cards .card[data-id]');
      if (listCard) return { id: listCard.dataset.id, surface: 'list' };
      const canvasWrap = node.closest('.canvas-placed-card[data-canvas-placed]');
      if (canvasWrap) return { id: canvasWrap.dataset.canvasPlaced, surface: 'canvas' };
      return null;
    }

    function workspaceLinkItemIdFromNode(node) {
      return workspaceLinkFromNode(node)?.id ?? null;
    }

    function applyWorkspaceLinkHover(link) {
      if (!link?.id || !canvasPlacements[link.id]) {
        clearWorkspaceLinkHover();
        return;
      }
      if (
        workspaceLinkHover
        && workspaceLinkHover.id === link.id
        && workspaceLinkHover.surface === link.surface
      ) {
        return;
      }
      clearWorkspaceLinkHover();
      workspaceLinkHover = { id: link.id, surface: link.surface };
      const app = document.getElementById('app');
      if (!app) return;
      const peerSelector = link.surface === 'list'
        ? `.canvas-placed-card[data-canvas-placed="${link.id}"]`
        : `.workspace-list .list-cards .card[data-id="${link.id}"]`;
      app.querySelector(peerSelector)?.classList.add('is-workspace-link-hover');
    }

    function bindCanvasInteractions() {
      if (canvasInteractionsBound) return;
      canvasInteractionsBound = true;
      const app = document.getElementById('app');

      app.addEventListener('mouseover', (e) => {
        if (viewMode !== 'list') return;
        const link = workspaceLinkFromNode(e.target);
        if (!link) {
          if (workspaceLinkHover) clearWorkspaceLinkHover();
          return;
        }
        applyWorkspaceLinkHover(link);
      });

      app.addEventListener('mouseout', (e) => {
        if (viewMode !== 'list' || !workspaceLinkHover) return;
        const from = workspaceLinkFromNode(e.target);
        if (!from || from.id !== workspaceLinkHover.id || from.surface !== workspaceLinkHover.surface) return;
        const to = e.relatedTarget ? workspaceLinkFromNode(e.relatedTarget) : null;
        if (to?.id === workspaceLinkHover.id) return;
        clearWorkspaceLinkHover();
      });

      let listDragBlockedPointer = null;

      const endListDragBlocked = (e) => {
        if (!listDragBlockedPointer || e.pointerId !== listDragBlockedPointer.pointerId) return;
        listDragBlockedPointer.card?.classList.remove('is-list-drag-blocked');
        listDragBlockedPointer = null;
        document.body.classList.remove('canvas-list-drag-blocked-active');
      };

      app.addEventListener(
        'pointerdown',
        (e) => {
          if (e.button !== 0) return;
          const card = e.target.closest('.workspace-list .list-cards .card.canvas-list-drag-blocked');
          if (!card) return;
          listDragBlockedPointer = {
            pointerId: e.pointerId,
            startX: e.clientX,
            startY: e.clientY,
            card,
            dragging: false,
          };
        },
        true,
      );

      app.addEventListener(
        'pointermove',
        (e) => {
          const state = listDragBlockedPointer;
          if (!state || e.pointerId !== state.pointerId) return;
          if (state.dragging) return;
          const dx = e.clientX - state.startX;
          const dy = e.clientY - state.startY;
          if (dx * dx + dy * dy <= 9) return;
          state.dragging = true;
          state.card.classList.add('is-list-drag-blocked');
          document.body.classList.add('canvas-list-drag-blocked-active');
          const itemId = state.card.dataset.id;
          if (itemId) centerCanvasViewportOnCard(itemId);
          e.preventDefault();
        },
        true,
      );

      app.addEventListener('pointerup', endListDragBlocked, true);
      app.addEventListener('pointercancel', endListDragBlocked, true);

      app.addEventListener('selectstart', (e) => {
        if (e.target.closest('.workspace-list .list-cards .card.canvas-list-drag-blocked.is-list-drag-blocked')) {
          e.preventDefault();
        }
      });

      app.addEventListener('dragstart', (e) => {
        const source = e.target.closest('[data-canvas-drag-id]');
        if (!source) return;
        if (e.target.closest('textarea, input, button, [data-editable], [contenteditable="true"]')) {
          e.preventDefault();
          return;
        }
        const id = source.dataset.canvasDragId;
        if (!id || canvasPlacements[id]) {
          e.preventDefault();
          return;
        }
        e.dataTransfer.setData('text/plain', id);
        e.dataTransfer.effectAllowed = 'copyMove';
        if (source.hasAttribute('aria-grabbed')) source.setAttribute('aria-grabbed', 'true');
      });

      app.addEventListener('dragend', (e) => {
        const source = e.target.closest('[data-canvas-drag-id]');
        if (source?.hasAttribute('aria-grabbed')) source.setAttribute('aria-grabbed', 'false');
      });

      app.addEventListener('dragover', (e) => {
        if (!e.target.closest('[data-canvas-surface]')) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
      });

      app.addEventListener('drop', (e) => {
        const surface = e.target.closest('[data-canvas-surface]');
        if (!surface) return;
        e.preventDefault();
        const id = e.dataTransfer.getData('text/plain');
        if (id && items[id]) placeCardOnCanvas(id, e.clientX, e.clientY);
      });

      app.addEventListener('auxclick', (e) => {
        if (e.button === 1 && e.target.closest('[data-canvas-surface]')) e.preventDefault();
      });

      app.addEventListener('pointerdown', (e) => {
        if (tryStartCanvasPan(e)) return;
        if (e.button !== 0) return;
        if (canvasSpaceHeld) return;
        const placed = e.target.closest('.canvas-placed-card');
        if (!placed) return;
        const followup = e.target.closest('[data-followup-input]');
        if (e.target.closest('input') && !followup) return;
        if (e.target.closest('textarea')) {
          if (!followup) return;
          if (document.activeElement === followup) return;
        }
        const id = placed.dataset.canvasPlaced;
        if (!id || !canvasPlacements[id]) return;
        const surface = canvasSurfaceEl();
        if (!surface) return;
        const pt = canvasPointFromClient(surface, e.clientX, e.clientY);
        canvasPointerState = {
          placed,
          id,
          pointerId: e.pointerId,
          offX: pt.x - canvasPlacements[id].x,
          offY: pt.y - canvasPlacements[id].y,
          startX: e.clientX,
          startY: e.clientY,
          dragging: false,
        };
      }, true);

      app.addEventListener('pointermove', (e) => {
        const pan = canvasPanState;
        if (pan && e.pointerId === pan.pointerId) {
          e.preventDefault();
          pan.surface.scrollLeft = pan.startScrollLeft - (e.clientX - pan.startX);
          pan.surface.scrollTop = pan.startScrollTop - (e.clientY - pan.startY);
          canvasViewport.scrollLeft = pan.surface.scrollLeft;
          canvasViewport.scrollTop = pan.surface.scrollTop;
          clampCanvasViewportScroll(pan.surface);
          pan.surface.scrollLeft = canvasViewport.scrollLeft;
          pan.surface.scrollTop = canvasViewport.scrollTop;
          canvasViewportUserSet = true;
          updateCanvasEdgeIndicators();
          return;
        }
        const state = canvasPointerState;
        if (!state || e.pointerId !== state.pointerId) return;
        if (!state.dragging) {
          const dx = e.clientX - state.startX;
          const dy = e.clientY - state.startY;
          if (dx * dx + dy * dy <= 16) return;
          state.dragging = true;
          state.placed.classList.add('is-dragging');
          state.placed.setPointerCapture(e.pointerId);
          if (canvasPlacements[state.id]) {
            canvasAssignOrderAtFront(state.id);
            const world = canvasWorldEl();
            if (world) {
              canvasPlacementsSortedIds().forEach((cid, i) => {
                const el = world.querySelector(`[data-canvas-placed="${cid}"]`);
                if (el) el.style.zIndex = String(i + 1);
              });
            }
          }
        }
        e.preventDefault();
        const surface = canvasSurfaceEl();
        if (!surface) return;
        const pt = canvasPointFromClient(surface, e.clientX, e.clientY);
        canvasPlacements[state.id] = clampCanvasPlacement(
          pt.x - state.offX,
          pt.y - state.offY,
        );
        state.placed.style.left = `${canvasPlacements[state.id].x}px`;
        state.placed.style.top = `${canvasPlacements[state.id].y}px`;
        updateCanvasEdgeIndicators();
      }, true);

      const endCanvasPointer = (e) => {
        if (endCanvasPan(e)) return;
        const state = canvasPointerState;
        if (!state || e.pointerId !== state.pointerId) return;
        if (state.dragging) {
          e.preventDefault();
          canvasSuppressClickUntil = Date.now() + 350;
          state.placed.classList.remove('is-dragging');
          scheduleSaveState();
        }
        clearWorkspaceLinkHover();
        canvasPointerState = null;
      };
      app.addEventListener('pointerup', endCanvasPointer, true);
      app.addEventListener('pointercancel', endCanvasPointer, true);

      app.addEventListener('click', (e) => {
        if (Date.now() < canvasSuppressClickUntil && e.target.closest('.canvas-placed-card')) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);

      window.addEventListener('keydown', (e) => {
        if (e.code !== 'Space' || e.repeat) return;
        if (canvasTypingFocus()) return;
        if (viewMode !== 'list' || !canvasSurfaceEl()) return;
        canvasSpaceHeld = true;
        document.body.classList.add('canvas-space-pan');
        e.preventDefault();
      });

      window.addEventListener('keyup', (e) => {
        if (e.code !== 'Space') return;
        canvasSpaceHeld = false;
        document.body.classList.remove('canvas-space-pan');
      });

      window.addEventListener('blur', () => {
        canvasSpaceHeld = false;
        document.body.classList.remove('canvas-space-pan');
      });
    }

    function renderComposerHtml() {
      return `
        <div class="composer" data-composer="root">
          <textarea placeholder="Question — @people, #tag (adds tag), [label](!5/a1)" autofocus data-composer-input></textarea>
          <div class="composer-meta">
            <input type="text" placeholder="Tags" data-composer-tags />
          </div>
          <div class="composer-actions">
            <button type="button" class="btn-sm" data-composer-cancel>Cancel</button>
            <button type="button" class="btn-sm primary" data-composer-save>Add</button>
          </div>
        </div>
      `;
    }

    function commitFollowup(itemId, text, { inPanel = false, ta = null, focusAnswer = true } = {}) {
      if (ta) consumeTrailingHashTag(ta);
      const trimmed = (ta ? ta.value : text).trim();
      if (!trimmed || !items[itemId]) return;
      addStep(itemId, trimmed);
      delete followupDrafts[itemId];
      if (focusAnswer) {
        const stepIndex = items[itemId].steps.length - 1;
        const inCanvas = !!ta?.closest('.canvas-placed-card');
        pendingFocus = {
          id: itemId,
          field: 'answer',
          step: stepIndex,
          panel: inPanel,
          canvas: inCanvas && !inPanel,
        };
      }
      render();
    }

    function tryCommitFollowupField(followup) {
      if (!followup?.matches('[data-followup-input]')) return;
      if (!followup.value.trim()) return;
      commitFollowup(followup.dataset.id, followup.value, {
        inPanel: !!followup.closest('.issue-ref-panel-body'),
        ta: followup,
        focusAnswer: !pendingEditableHandoff,
      });
    }

    function finishEditableHandoff(root = document.getElementById('app')) {
      if (!pendingEditableHandoff || !root) return;
      const h = pendingEditableHandoff;
      pendingEditableHandoff = null;
      const el = findEditableField(root, {
        id: h.id,
        field: h.field,
        step: h.step,
        panel: !!h.panel,
        canvas: !!h.canvas,
      });
      if (el) startInlineEdit(el, h.field, h.id, h.step);
    }

    function renderTagsHtml(item, { readOnly = false } = {}) {
      const num = item.id.replace(/^item-/i, '');
      const chips = item.tags.map((t) => `<span class="tag" style="${tagStyle(t)}">${escapeHtml(t)}</span>`).join('');
      const editAttrs = readOnly ? '' : ` data-editable="tags" data-id="${item.id}"`;
      const tagsInner = chips
        ? `<span class="tags-row-tags">${chips}</span>`
        : (readOnly ? '' : '<span class="tags-add">Tags</span>');
      const tagsBlock = readOnly
        ? tagsInner
        : `<div class="tags-row-edit"${editAttrs}>${tagsInner}</div>`;
      return `
        <div class="tags-row" aria-label="Decision !${escapeAttr(num)}">
