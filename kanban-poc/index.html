      const editingId = selectionRefPick?.itemId || null;
      const sorted = Object.values(items).sort((a, b) => {
        if (editingId) {
          if (a.id === editingId && b.id !== editingId) return -1;
          if (b.id === editingId && a.id !== editingId) return 1;
        }
        return a.id.localeCompare(b.id);
      });

      for (const item of sorted) {
        if (!refLinkPickerItemPassesTags(item)) continue;

        const num = item.id.replace(/^item-/i, '');
        const tagChips = item.tags.map((t) => renderRefLinkPickerTagButton(t)).join('');
        const editingBadge = item.id === editingId
          ? '<span class="ref-link-picker-editing-badge">This card</span>'
          : '';
        const rows = [];
        const firstProblem = item.steps[0] ? getProblemText(item.steps[0]) : '';
        const cardHay = `!${num} ${item.tags.join(' ')} ${firstProblem}`;
        if (refLinkPickerRowPassesKind('card') && refTargetMatchesQuery(cardHay, q)) {
          rows.push(renderRefLinkPickerRow(
            item.id,
            'card',
            `!${num}`,
            firstProblem,
            item.steps.length === 1 ? getAnswerText(item.steps[0]) : null,
          ));
        }

        item.steps.forEach((step, index) => {
          ensureStepRevisions(step);
          const stepNum = index + 1;
          const problem = getProblemText(step);
          const answer = getAnswerText(step);
          const stepHay = `!${num} ${item.tags.join(' ')} ${problem} ${answer || ''}`;
          if (refLinkPickerRowPassesKind('question') && refTargetMatchesQuery(stepHay, q)) {
            rows.push(renderRefLinkPickerRow(
              `${item.id}/${stepNum}`,
              'question',
              `!${num}/${stepNum}`,
              problem,
              null,
            ));
          }
          if (answer?.trim()
            && refLinkPickerRowPassesKind('answer')
            && refTargetMatchesQuery(`!${num}/a${stepNum} ${answer} ${problem}`, q)) {
            rows.push(renderRefLinkPickerRow(
              `${item.id}/a${stepNum}`,
              'answer',
              `!${num}/a${stepNum}`,
              problem,
              answer,
            ));
          }
        });

        if (rows.length) {
          rowCount += rows.length;
          groups.push(`<div class="ref-link-picker-group">
            <div class="ref-link-picker-group-head">
              <button type="button" class="ref-link-picker-card-id" data-action="ref-picker-filter-id" data-ref-query="!${escapeAttr(num)}">!${escapeHtml(num)}</button>
              ${editingBadge}${tagChips}
            </div>
            ${rows.join('')}
          </div>`);
        }
      }

      const meta = document.getElementById('ref-link-picker-results-meta');
      if (meta) {
        const filterBits = [];
        if (refLinkPickerActiveTags.length) filterBits.push(refLinkPickerActiveTags.join(' + '));
        if (refLinkPickerKindFilter !== 'all') filterBits.push(refLinkPickerKindFilter);
        if (q) filterBits.push(`“${q}”`);
        const filterNote = filterBits.length ? ` · ${filterBits.join(' · ')}` : '';
        meta.dataset.summary = rowCount
          ? `${rowCount} target${rowCount === 1 ? '' : 's'}${filterNote}`
          : `No matches${filterNote || ''} — loosen filters or search.`;
        meta.textContent = meta.dataset.summary;
      }

      root.innerHTML = groups.length
        ? groups.join('')
        : '<p class="ref-link-picker-empty">No matches — try another tag, kind filter, or search.</p>';

      renderRefLinkPickerFilterChrome();
    }

    function openRefLinkPickerPanel() {
      if (!selectionRefPick) return;
      if (issueDrawerRefId) closeIssueRefDrawer();
      const shell = ensureRefLinkPickerShell();
      shell.querySelector('#ref-link-picker-selection').textContent = `Selected: “${selectionRefPick.label}”`;
      resetRefLinkPickerFilters();
      const search = shell.querySelector('#ref-link-picker-search');
      search.value = '';
      populateRefLinkPickerResults();
      shell.hidden = false;
      syncIssueRefPanelOpenClass();
      setTimeout(() => search.focus(), 0);
    }

    function buildIssueRefMarkdown(refToken, label) {
      const parsed = parseIssueRef(refToken);
      if (!parsed) return null;
      pinCurrentIssueRefRevision(parsed);
      const linkLabel = (label.trim() || issueRefAutocompleteLabel(parsed)).replace(/[\[\]]/g, '');
      return `[${linkLabel}](${formatIssueRefInText(parsed)})`;
    }

    function buildSelectionRefPick(ta, sel) {
      const pick = {
        ta,
        start: sel.start,
        end: sel.end,
        label: sel.label,
        textSnapshot: ta.value,
        mode: 'inline',
      };
      if (ta.matches('[data-composer-input]')) {
        pick.mode = 'composer';
        return pick;
      }
      if (ta.matches('[data-followup-input]')) {
        pick.mode = 'followup';
        pick.itemId = ta.dataset.id;
        return pick;
      }
      pick.itemId = ta.dataset.refItemId;
      pick.field = ta.dataset.refField;
      pick.stepIndex = Number(ta.dataset.refStep);
      return pick;
    }

    function applySelectionRefPick(refToken) {
      const pick = selectionRefPick;
      selectionRefPick = null;
      pendingInlineEditCommit = null;
      removeMentionMenu();
      closeRefLinkPickerPanel();
      hideSelectionRefToolbar();
      if (!pick) return;
      const markdown = buildIssueRefMarkdown(refToken, pick.label);
      if (!markdown) return;
      const newText = `${pick.textSnapshot.slice(0, pick.start)}${markdown}${pick.textSnapshot.slice(pick.end)}`;

      if (pick.mode === 'composer') {
        const input = document.querySelector('[data-composer-input]');
        if (input) {
          input.value = newText;
          input.focus();
          autoGrowTextarea(input);
        }
        return;
      }

      if (pick.mode === 'followup' && pick.itemId) {
        followupDrafts[pick.itemId] = newText;
        const ta = document.querySelector(`[data-followup-input][data-id="${pick.itemId}"]`);
        if (ta) {
          ta.value = newText;
          autoGrowTextarea(ta);
          ta.focus();
        }
        return;
      }

      if (pick.mode === 'inline' && pick.itemId && pick.field && Number.isFinite(pick.stepIndex)) {
        const step = items[pick.itemId]?.steps[pick.stepIndex];
        if (!step) {
          render();
          return;
        }
        if (pick.field === 'problem') recordProblemEdit(step, newText);
        else recordAnswerEdit(step, newText);
        pendingFocus = { id: pick.itemId, field: pick.field, step: pick.stepIndex };
        render();
      }
    }

    function insertMention(ta, name) {
      const pos = ta.selectionStart ?? ta.value.length;
      const before = ta.value.slice(0, pos);
      const match = before.match(/@([\w.-]*)$/);
      if (!match) return;
      const start = pos - match[0].length;
      ta.value = `${ta.value.slice(0, start)}@${name} ${ta.value.slice(pos)}`;
      const newPos = start + name.length + 2;
      ta.focus();
      ta.setSelectionRange(newPos, newPos);
    }

    function insertIssueRef(ta, refToken) {
      const pos = ta.selectionStart ?? ta.value.length;
      const before = ta.value.slice(0, pos);
      const match = before.match(/!\d*(?:\/(?:a?\d*))?(?:@v?\d*)?$/);
      if (!match) return;
      const start = pos - match[0].length;
      const parsed = parseIssueRef(refToken);
      if (!parsed) return;
      pinCurrentIssueRefRevision(parsed);
      const label = issueRefAutocompleteLabel(parsed);
      const token = `[${label}](${formatIssueRefInText(parsed)}) `;
      ta.value = `${ta.value.slice(0, start)}${token}${ta.value.slice(pos)}`;
      const newPos = start + token.length;
      ta.focus();
      ta.setSelectionRange(newPos, newPos);
    }

    function replaceTextareaRangeWithIssueRef(ta, start, end, label, refToken) {
      const parsed = parseIssueRef(refToken);
      if (!parsed) return false;
      pinCurrentIssueRefRevision(parsed);
      const linkLabel = (label.trim() || issueRefAutocompleteLabel(parsed)).replace(/[\[\]]/g, '');
      const token = `[${linkLabel}](${formatIssueRefInText(parsed)})`;
      ta.value = `${ta.value.slice(0, start)}${token}${ta.value.slice(end)}`;
      const newPos = start + token.length;
      ta.focus();
      ta.setSelectionRange(newPos, newPos);
      autoGrowTextarea(ta);
      ta.dispatchEvent(new Event('input', { bubbles: true }));
      return true;
    }

    function hideSelectionRefToolbar() {
      if (selectionRefToolbarEl) selectionRefToolbarEl.hidden = true;
      selectionRefToolbarTa = null;
      selectionRefToolbarState = null;
    }

    function activateSelectionRefFromToolbar() {
      const state = selectionRefToolbarState;
      if (!state?.ta) return;
      selectionRefPick = buildSelectionRefPick(state.ta, state);
      if (selectionRefToolbarEl) selectionRefToolbarEl.hidden = true;
      selectionRefToolbarTa = null;
      selectionRefToolbarState = null;
      openRefLinkPickerPanel();
    }

    function ensureSelectionRefToolbar() {
      if (selectionRefToolbarEl) return selectionRefToolbarEl;
      selectionRefToolbarEl = document.createElement('div');
      selectionRefToolbarEl.className = 'selection-ref-toolbar';
      selectionRefToolbarEl.hidden = true;
      selectionRefToolbarEl.setAttribute('role', 'toolbar');
      selectionRefToolbarEl.innerHTML = '<button type="button" class="selection-ref-toolbar-btn" data-action="selection-make-ref">Link to decision…</button>';
      selectionRefToolbarEl.addEventListener('mousedown', (e) => e.preventDefault());
      selectionRefToolbarEl.querySelector('[data-action="selection-make-ref"]').addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        activateSelectionRefFromToolbar();
      });
      document.body.appendChild(selectionRefToolbarEl);
      return selectionRefToolbarEl;
    }

    function isRefEditableTextarea(ta) {
      return !!ta?.matches?.(REF_EDITABLE_TEXTAREA_SEL) && !ta.closest('.issue-ref-panel-body');
    }

    function getTextareaSelectionLabel(ta) {
      const start = ta.selectionStart ?? 0;
      const end = ta.selectionEnd ?? 0;
      if (start === end) return null;
      const label = ta.value.slice(start, end).trim();
      return label ? { start, end, label } : null;
    }

    function positionSelectionRefToolbar(toolbar, clientX, clientY) {
      toolbar.hidden = false;
      const margin = 8;
      const w = toolbar.offsetWidth || 160;
      const h = toolbar.offsetHeight || 36;
      const left = Math.min(Math.max(margin, clientX - w / 2), window.innerWidth - w - margin);
      const top = Math.max(margin, clientY - h - 6);
      toolbar.style.left = `${left}px`;
      toolbar.style.top = `${top}px`;
    }

    function updateSelectionRefToolbar(ta, clientX, clientY) {
      if (!isRefEditableTextarea(ta)) {
        hideSelectionRefToolbar();
        return;
      }
      const sel = getTextareaSelectionLabel(ta);
      if (!sel) {
        hideSelectionRefToolbar();
        return;
      }
      const toolbar = ensureSelectionRefToolbar();
      selectionRefToolbarTa = ta;
      selectionRefToolbarState = { ta, start: sel.start, end: sel.end, label: sel.label };
      positionSelectionRefToolbar(toolbar, clientX, clientY);
    }

    function mountAutocompleteMenu(ta, buildItems) {
      removeMentionMenu();
      const buttons = buildItems();
      if (!buttons.length) return;

      mentionMenuEl = document.createElement('div');
      mentionMenuEl.className = 'mention-menu';
      mentionMenuEl.setAttribute('role', 'listbox');
      buttons.forEach((btn) => mentionMenuEl.appendChild(btn));
      document.body.appendChild(mentionMenuEl);
      const rect = ta.getBoundingClientRect();
      mentionMenuEl.style.left = `${rect.left}px`;
      mentionMenuEl.style.top = `${rect.bottom + 4}px`;
      mentionMenuEl.style.minWidth = `${Math.min(Math.max(rect.width, 200), 320)}px`;
    }

    function bindRichTextAutocomplete(ta) {
      const showMenu = () => {
        removeMentionMenu();
        const pos = ta.selectionStart ?? ta.value.length;
        const before = ta.value.slice(0, pos);
        const mentionMatch = before.match(/@([\w.-]*)$/);
        const issueStepMatch = before.match(/!(\d+)\/(a?)(\d*)$/);
        const issueMatch = before.match(/!(\d*)$/);
        const tagMatch = before.match(/#([\w.-]*)$/);

        if (mentionMatch) {
          const query = mentionMatch[1].toLowerCase();
          const hits = MENTION_PEOPLE.filter((p) => p.toLowerCase().startsWith(query)).slice(0, 8);
          mountAutocompleteMenu(ta, () => hits.map((name) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'mention-menu-item';
            btn.setAttribute('role', 'option');
            btn.textContent = `@${name}`;
            btn.addEventListener('mousedown', (e) => {
              e.preventDefault();
              insertMention(ta, name);
              removeMentionMenu();
            });
            return btn;
          }));
          return;
        }

        if (issueStepMatch) {
          const itemId = normalizeIssueId(issueStepMatch[1]) || `item-${issueStepMatch[1]}`;
          const answerOnly = issueStepMatch[2] === 'a';
          const query = issueStepMatch[3];
          const item = itemId ? items[itemId] : null;
          if (item) {
            mountAutocompleteMenu(ta, () => item.steps.map((step, index) => {
              const stepNum = String(index + 1);
              if (query && !stepNum.startsWith(query)) return null;
              const btn = document.createElement('button');
              btn.type = 'button';
              btn.className = 'mention-menu-item';
              btn.setAttribute('role', 'option');
              const idSpan = document.createElement('span');
              idSpan.className = 'issue-menu-id';
              idSpan.textContent = answerOnly
                ? `!${item.id.replace('item-', '')}/a${stepNum}`
                : `!${item.id.replace('item-', '')}/${stepNum}`;
              const titleSpan = document.createElement('span');
              titleSpan.className = 'issue-menu-title';
              titleSpan.textContent = answerOnly
                ? truncateLabel(step.answer?.trim() || '(no answer)', 56)
                : truncateLabel(step.problem || item.id, 56);
              btn.append(idSpan, titleSpan);
              const refToken = answerOnly
                ? `${item.id}/a${stepNum}`
                : `${item.id}/${stepNum}`;
              btn.addEventListener('mousedown', (e) => {
                e.preventDefault();
                insertIssueRef(ta, refToken);
                removeMentionMenu();
              });
              return btn;
            }).filter(Boolean));
          }
          return;
        }

        if (issueMatch) {
          const query = issueMatch[1];
          const hits = Object.values(items)
            .filter((item) => {
              const num = item.id.replace(/^item-/i, '');
              const problem = item.steps[0]?.problem || '';
              return num.startsWith(query) || problem.toLowerCase().includes(query.toLowerCase());
            })
            .sort((a, b) => a.id.localeCompare(b.id))
            .slice(0, 8);
          mountAutocompleteMenu(ta, () => hits.map((item) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'mention-menu-item';
            btn.setAttribute('role', 'option');
            const idSpan = document.createElement('span');
            idSpan.className = 'issue-menu-id';
            idSpan.textContent = `!${item.id.replace('item-', '')}`;
            const titleSpan = document.createElement('span');
            titleSpan.className = 'issue-menu-title';
            titleSpan.textContent = truncateLabel(item.steps[0]?.problem || item.id);
            btn.append(idSpan, titleSpan);
            btn.addEventListener('mousedown', (e) => {
              e.preventDefault();
              insertIssueRef(ta, item.id);
              removeMentionMenu();
            });
            return btn;
          }));
          return;
        }

        if (tagMatch) {
          const query = tagMatch[1].toLowerCase();
          const hits = allKnownTags()
            .filter((t) => t.toLowerCase().startsWith(query))
            .slice(0, 8);
          const options = query && !hits.includes(normalizeTagName(query))
            ? [normalizeTagName(query), ...hits]
            : hits;
          mountAutocompleteMenu(ta, () => options.map((name) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'mention-menu-item';
            btn.setAttribute('role', 'option');
            btn.textContent = `#${name}`;
            btn.addEventListener('mousedown', (e) => {
              e.preventDefault();
              insertHashTag(ta, name);
              removeMentionMenu();
            });
            return btn;
          }));
        }
      };

      ta.addEventListener('input', showMenu);
      ta.addEventListener('blur', () => setTimeout(removeMentionMenu, 120));
      ta.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') removeMentionMenu();
      });
    }

    function goToIssue(refId, anchorEl = null) {
      const parsed = parseIssueRef(refId);
      const upgradeSource = anchorEl && parsed ? resolveIssueRefSourceField(anchorEl, parsed) : null;
      openIssueRefDrawer(refId, upgradeSource);
    }

    function ensureIssueDrawerShell() {
      if (issueDrawerEl) return issueDrawerEl;
      issueDrawerEl = document.createElement('aside');
      issueDrawerEl.className = 'issue-ref-panel';
      issueDrawerEl.hidden = true;
      issueDrawerEl.setAttribute('role', 'complementary');
      issueDrawerEl.setAttribute('aria-labelledby', 'issue-ref-panel-title');
      issueDrawerEl.innerHTML = `
          <div class="issue-ref-panel-toolbar">
            <span class="issue-ref-panel-title" id="issue-ref-panel-title"></span>
            <button type="button" class="issue-ref-panel-close" data-action="close-issue-drawer" aria-label="Close">×</button>
          </div>
          <div class="issue-ref-panel-body"></div>
      `;
      document.getElementById('app-body').appendChild(issueDrawerEl);
      return issueDrawerEl;
    }

    function populateIssueRefDrawer(refId) {
      const parsed = parseIssueRef(refId);
      if (!parsed) {
        closeIssueRefDrawer();
        return;
      }
      const item = items[parsed.itemId];
      if (!item) {
        closeIssueRefDrawer();
        return;
      }
      const shell = ensureIssueDrawerShell();
      const num = parsed.itemId.replace(/^item-/i, '');
      shell.querySelector('.issue-ref-panel-title').textContent = `!${num}`;
      const body = shell.querySelector('.issue-ref-panel-body');
      const refChrome = parsed.stepIndex == null
        ? buildIssuePanelCardHistoryChrome(item)
        : buildIssuePanelRefChrome(parsed);
      body.innerHTML = `${refChrome}${renderCard(item, {
        highlightRef: panelHighlightRef(parsed),
        idPrefix: PANEL_CARD_ID_PREFIX,
      })}`;
      shell.setAttribute('aria-label', `Decision ${num}`);
    }

    function openIssueRefDrawer(refId, upgradeSource = null) {
      removeIssuePreview();
      if (isRefLinkPickerOpen()) cancelRefLinkPicker();
      if (refId !== issueDrawerRefId) {
        issuePanelViewRev = null;
        issuePanelShowOlderRevisions = false;
        issuePanelCardHistoryView = null;
        issuePanelUpgradeSource = upgradeSource;
      } else if (upgradeSource) {
        issuePanelUpgradeSource = upgradeSource;
      }
      issueDrawerRefId = refId;
      const parsed = parseIssueRef(refId);
      if (parsed && parsed.stepIndex == null && items[parsed.itemId]) {
        initIssuePanelCardHistoryView(items[parsed.itemId]);
      }
      const shell = ensureIssueDrawerShell();
      populateIssueRefDrawer(refId);
      shell.hidden = false;
      syncIssueRefPanelOpenClass();
    }

    function closeIssueRefDrawer() {
      issueDrawerRefId = null;
      issuePanelUpgradeSource = null;
      issuePanelViewRev = null;
      issuePanelDiffOpen = false;
      issuePanelShowOlderRevisions = false;
      issuePanelCardHistoryView = null;
      if (issueDrawerEl) issueDrawerEl.hidden = true;
      syncIssueRefPanelOpenClass();
    }

    function renderRevisionHistoryHtml(step, field, activeRev, { selectable = false, fullText = false, linkedRev = null, minRev = null, stepIndex = null } = {}) {
      const revisions = stepFieldRevisions(step, field);
      if (!revisions.length) return '';
      const head = stepFieldHeadRev(step, field);
      const viewRev = activeRev ?? head;
      let ordered = revisions.slice().sort((a, b) => a.rev - b.rev);
      if (minRev != null) ordered = ordered.filter((entry) => entry.rev >= minRev);
      if (!ordered.length) return '';
      const items = ordered.map((entry) => {
        const active = entry.rev === viewRev;
        const linked = linkedRev != null && entry.rev === linkedRev;
        const date = entry.at ? formatDecisionDate(entry.at) : '';
        const body = fullText
          ? entry.text
          : (field === 'answer'
            ? truncateLabel(entry.text, 180)
            : truncateLabel(entry.text, 160));
        const linkedBadge = linked ? '<span class="rev-linked-badge">linked</span>' : '';
        const meta = `<div class="issue-ref-preview-revision-meta">v${entry.rev}${linkedBadge}${entry.tentative ? ' · tentative' : ''}${entry.rev === head ? ' · current' : ''}</div>`;
        const content = `<span class="revision-timeline-content">${meta}${escapeHtml(body)}</span>`;
        const dateHtml = date
          ? `<time class="revision-timeline-date" datetime="${escapeAttr(entry.at)}">${escapeHtml(date)}</time>`
          : '<span class="revision-timeline-date" aria-hidden="true"></span>';
        const node = `<span class="revision-timeline-node"><span class="revision-timeline-stem-top" aria-hidden="true"></span><span class="revision-timeline-marker" aria-hidden="true"></span><span class="revision-timeline-stem-bottom" aria-hidden="true"></span></span>`;
        const className = `revision-timeline-item${active ? ' is-active' : ''}${linked ? ' is-linked-rev' : ''}`;
        if (selectable) {
          const stepAttr = stepIndex != null ? ` data-step="${stepIndex}"` : '';
          return `<button type="button" class="${className}" data-action="panel-rev-select" data-rev="${entry.rev}" data-field="${field}"${stepAttr}>${dateHtml}${node}${content}</button>`;
        }
        return `<div class="${className}">${dateHtml}${node}${content}</div>`;
      }).join('');
      return `<div class="revision-timeline">${items}</div>`;
    }

    function renderPreviewStepsHtml(item, fromIndex = 0, toIndex = item.steps.length) {
      return item.steps
        .slice(fromIndex, toIndex)
        .map((step) => {
          ensureStepRevisions(step);
          const q = truncateLabel(getProblemText(step), 160);
          const answerText = getAnswerText(step);
          let answerBlock;
          if (answerText) {
            const tent = step.answerTentative ? ' <span aria-hidden="true">⚑</span>' : '';
            answerBlock = `<div class="issue-ref-preview-a">${escapeHtml(truncateLabel(answerText, 140))}${tent}</div>`;
          } else {
            answerBlock = '<div class="issue-ref-preview-a issue-ref-preview-pending">No decision yet</div>';
          }
          return `<div class="issue-ref-preview-step"><div class="issue-ref-preview-q">${escapeHtml(q)}</div>${answerBlock}</div>`;
        })
        .join('');
    }

    function issuePreviewStaleFooter(parsed) {
      if (!isIssueRefStale(parsed)) return '';
      return '<p class="issue-ref-preview-stale">Older revision — click to open the panel.</p>';
    }

    function buildIssuePreviewHtml(refId) {
      const parsed = parseIssueRef(refId);
      if (!parsed) {
        return '<p class="issue-ref-preview-missing">Decision not found</p>';
      }
      const item = items[parsed.itemId];
      if (!item) {
        return '<p class="issue-ref-preview-missing">Decision not found</p>';
      }
      const num = parsed.itemId.replace(/^item-/i, '');
      const stale = isIssueRefStale(parsed);
      const headHtml = `
        <div class="issue-ref-preview-head">
          <span class="issue-ref-preview-id">!${escapeHtml(num)}</span>
          <span class="issue-ref-preview-status">${stale ? 'Stale link' : 'Preview'}</span>
        </div>`;
      const staleFooter = issuePreviewStaleFooter(parsed);

      if (parsed.focusAnswer && parsed.stepIndex != null) {
        const step = item.steps[parsed.stepIndex];
        if (!step) {
          return `${headHtml}<p class="issue-ref-preview-missing">Step not found</p>`;
        }
        ensureStepRevisions(step);
        const headRev = stepFieldHeadRev(step, 'answer');
        const viewRev = parsed.revision ?? headRev;
        const answerText = getAnswerText(step, viewRev);
        const qHtml = getProblemText(step)?.trim()
          ? `<div class="issue-ref-preview-q">${escapeHtml(truncateLabel(getProblemText(step), 160))}</div>`
          : '';
        const answerBlock = answerText
          ? `<div class="issue-ref-preview-a issue-ref-preview-answer-main">${escapeHtml(truncateLabel(answerText, 220))}</div>`
          : '<div class="issue-ref-preview-a issue-ref-preview-pending issue-ref-preview-answer-main">No decision yet</div>';
        return `${headHtml}<div class="issue-ref-preview-answer-slot">${qHtml}${answerBlock}</div>${staleFooter}`;
      }

      if (parsed.stepIndex != null) {
        const step = item.steps[parsed.stepIndex];
        if (!step) {
          return `${headHtml}<p class="issue-ref-preview-missing">Step not found</p>`;
        }
        ensureStepRevisions(step);
        const viewRev = parsed.revision ?? stepFieldHeadRev(step, 'problem');
        const q = truncateLabel(getProblemText(step, viewRev), 160);
        const answerText = getAnswerText(step);
        let answerBlock;
        if (answerText) {
          const tent = step.answerTentative ? ' <span aria-hidden="true">⚑</span>' : '';
          answerBlock = `<div class="issue-ref-preview-a">${escapeHtml(truncateLabel(answerText, 140))}${tent}</div>`;
        } else {
          answerBlock = '<div class="issue-ref-preview-a issue-ref-preview-pending">No decision yet</div>';
        }
        return `${headHtml}<div class="issue-ref-preview-step"><div class="issue-ref-preview-q">${escapeHtml(q)}</div>${answerBlock}</div>${staleFooter}`;
      }

      return `${headHtml}${renderPreviewStepsHtml(item)}${staleFooter}`;
    }

    function bindIssuePreviewInteractions() {
      /* Hover preview is read-only; history and updates live in the side panel. */
    }

    function lockIssuePreviewDismiss(ms = 400) {
      issuePreviewDismissLocked = true;
      if (issuePreviewHideTimer) {
        clearTimeout(issuePreviewHideTimer);
        issuePreviewHideTimer = null;
      }
      if (issuePreviewDismissLockTimer) clearTimeout(issuePreviewDismissLockTimer);
      issuePreviewDismissLockTimer = setTimeout(() => {
        issuePreviewDismissLockTimer = null;
        issuePreviewDismissLocked = false;
      }, ms);
    }

    function scrollPageToRevealIssuePreview() {
      if (!issuePreviewEl) return;
      issuePreviewEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function positionIssuePreview(anchor) {
      if (!issuePreviewEl) return;
      const gap = 6;
      const margin = 8;
      const vh = window.innerHeight;
      const scrollX = window.scrollX;
      const scrollY = window.scrollY;
      const rect = anchor.getBoundingClientRect();
      issuePreviewEl.style.left = '0';
      issuePreviewEl.style.top = '0';
      const pop = issuePreviewEl.getBoundingClientRect();
      let left = rect.left + rect.width / 2 - pop.width / 2;
      left = Math.max(margin, Math.min(left, window.innerWidth - pop.width - margin));
      const spaceBelow = vh - margin - (rect.bottom + gap);
      const spaceAbove = rect.top - gap - margin;
      if (!issuePreviewEl.dataset.placement) {
        issuePreviewEl.dataset.placement = spaceBelow >= pop.height || spaceBelow >= spaceAbove ? 'below' : 'above';
      }
      let docTop;
      if (issuePreviewEl.dataset.placement === 'above') {
        docTop = scrollY + rect.top - gap - pop.height;
      } else {
        docTop = scrollY + rect.bottom + gap;
      }
      issuePreviewEl.style.left = `${scrollX + left}px`;
      issuePreviewEl.style.top = `${Math.max(scrollY + margin, docTop)}px`;
    }

    function removeIssuePreview() {
      if (issuePreviewShowTimer) {
        clearTimeout(issuePreviewShowTimer);
        issuePreviewShowTimer = null;
      }
      if (issuePreviewHideTimer) {
        clearTimeout(issuePreviewHideTimer);
        issuePreviewHideTimer = null;
      }
      if (issuePreviewDismissLockTimer) {
        clearTimeout(issuePreviewDismissLockTimer);
        issuePreviewDismissLockTimer = null;
      }
      issuePreviewDismissLocked = false;
      issuePreviewAnchor = null;
      if (issuePreviewEl) {
        issuePreviewEl.remove();
        issuePreviewEl = null;
      }
    }

    function scheduleHideIssuePreview() {
      if (issuePreviewDismissLocked) return;
      if (issuePreviewHideTimer) clearTimeout(issuePreviewHideTimer);
      issuePreviewHideTimer = setTimeout(removeIssuePreview, 120);
    }

    function showIssuePreview(anchor, refId) {
      if (issuePreviewEl && issuePreviewAnchor === anchor) {
        positionIssuePreview(anchor);
        return;
      }
      removeIssuePreview();
      issuePreviewAnchor = anchor;
      issuePreviewEl = document.createElement('div');
      const parsed = parseIssueRef(refId);
      const previewStale = parsed && isIssueRefStale(parsed);
      issuePreviewEl.className = 'issue-ref-preview'
        + (parsed?.focusAnswer ? ' issue-ref-preview-answer-ref' : '')
        + (previewStale ? ' issue-ref-preview-is-stale' : '');
      issuePreviewEl.setAttribute('role', 'tooltip');
      issuePreviewEl.dataset.refId = refId;
      const sourceEditable = anchor.closest('[data-editable]');
      if (sourceEditable) {
        const sf = sourceEditable.dataset.editable;
        if (sf === 'problem' || sf === 'answer') {
          issuePreviewEl.dataset.sourceItem = sourceEditable.dataset.id;
          issuePreviewEl.dataset.sourceField = sf;
          issuePreviewEl.dataset.sourceStep = sourceEditable.dataset.step;
        }
      }
      issuePreviewEl.innerHTML = buildIssuePreviewHtml(refId);
      bindIssuePreviewInteractions();
      issuePreviewEl.addEventListener('mouseenter', () => {
        if (issuePreviewHideTimer) {
          clearTimeout(issuePreviewHideTimer);
          issuePreviewHideTimer = null;
        }
      });
      issuePreviewEl.addEventListener('mouseleave', scheduleHideIssuePreview);
      document.body.appendChild(issuePreviewEl);
      delete issuePreviewEl.dataset.placement;
      positionIssuePreview(anchor);
      scrollPageToRevealIssuePreview();
    }

    function bindIssueRefPreviewEvents() {
      const app = document.getElementById('app-body');
      app.addEventListener('mouseover', (e) => {
        const ref = e.target.closest('[data-action="goto-issue"]');
        if (!ref) return;
        if (ref.closest('.issue-ref-panel-body .card-readonly')) return;
        const from = e.relatedTarget;
        if (from && ref.contains(from)) return;
        if (issuePreviewHideTimer) {
          clearTimeout(issuePreviewHideTimer);
          issuePreviewHideTimer = null;
        }
        if (issuePreviewShowTimer) clearTimeout(issuePreviewShowTimer);
        issuePreviewShowTimer = setTimeout(() => {
          issuePreviewShowTimer = null;
          showIssuePreview(ref, ref.dataset.issueRef);
        }, 220);
      });
      app.addEventListener('mouseout', (e) => {
        const ref = e.target.closest('[data-action="goto-issue"]');
        if (!ref) return;
        if (ref.closest('.issue-ref-panel-body .card-readonly')) return;
        const to = e.relatedTarget;
        if (to && ref.contains(to)) return;
        if (to && issuePreviewEl?.contains(to)) return;
        if (issuePreviewShowTimer) {
          clearTimeout(issuePreviewShowTimer);
          issuePreviewShowTimer = null;
        }
        scheduleHideIssuePreview();
      });
      window.addEventListener(
        'scroll',
        () => {
          if (issuePreviewEl && issuePreviewAnchor) {
            positionIssuePreview(issuePreviewAnchor);
          }
        },
        true,
      );
    }

    function deleteItem(id) {
      delete items[id];
      delete followupDrafts[id];
    }

    function renderComposerHtml() {
      return `
        <div class="composer" data-composer="root">
          <textarea placeholder="Question — @people, #tag (adds tag), [label](!5/a1)" autofocus data-composer-input></textarea>
          <div class="composer-meta">
            <input type="text" placeholder="Tags" data-composer-tags />
          </div>
          <div class="composer-actions">
            <button type="button" class="btn-sm" data-composer-cancel>Cancel</button>
            <button type="button" class="btn-sm primary" data-composer-save>Add</button>
          </div>
        </div>
      `;
    }

    function commitFollowup(itemId, text, { inPanel = false, ta = null } = {}) {
      if (ta) consumeTrailingHashTag(ta);
      const trimmed = (ta ? ta.value : text).trim();
      if (!trimmed || !items[itemId]) return;
      addStep(itemId, trimmed);
      delete followupDrafts[itemId];
      const stepIndex = items[itemId].steps.length - 1;
      pendingFocus = { id: itemId, field: 'answer', step: stepIndex, panel: inPanel };
      render();
    }

    function renderTagsHtml(item, { readOnly = false } = {}) {
      const num = item.id.replace(/^item-/i, '');
      const chips = item.tags.map((t) => `<span class="tag" style="${tagStyle(t)}">${escapeHtml(t)}</span>`).join('');
      const editAttrs = readOnly ? '' : ` data-editable="tags" data-id="${item.id}"`;
      const tagsInner = chips
        ? `<span class="tags-row-tags">${chips}</span>`
        : (readOnly ? '' : '<span class="tags-add">Tags</span>');
      const tagsBlock = readOnly
        ? tagsInner
        : `<div class="tags-row-edit"${editAttrs}>${tagsInner}</div>`;
      return `
        <div class="tags-row" aria-label="Decision !${escapeAttr(num)}">
          <button type="button" class="card-id" data-action="open-card-history" data-id="${escapeAttr(item.id)}" aria-label="Open card history for !${escapeAttr(num)}">!${escapeHtml(num)}</button>
          ${tagsBlock}
        </div>
      `;
    }

    function stepMatchesHighlight(highlightRef, index) {
      if (!highlightRef || highlightRef.stepIndex == null) return false;
      return highlightRef.stepIndex === index;
    }

    function renderTimelineStep(item, step, index, { highlightRef = null, idPrefix = '', historyEvents = null, historyEventIndex = null } = {}) {
      const inRefPanel = idPrefix === PANEL_CARD_ID_PREFIX;
      const refStep = inRefPanel && stepMatchesHighlight(highlightRef, index);
      const refField = highlightRef?.focusAnswer ? 'answer' : 'problem';
      const pinRev = refStep
        ? (highlightRef.displayRevision ?? highlightRef.revision ?? null)
        : null;
      const headRevForStep = refStep
        ? stepFieldHeadRev(step, refField)
        : null;
      const viewRev = pinRev ?? headRevForStep;
      const viewingSnapshot = refStep && viewRev != null && headRevForStep != null && viewRev !== headRevForStep;
      let problemText;
      let answerText;
      if (historyEvents && historyEventIndex != null) {
        const pRev = fieldRevAtHistoryEvent(historyEvents, index, 'problem', historyEventIndex);
        problemText = pRev != null ? getProblemText(step, pRev) : getProblemText(step);
        const aRev = fieldRevAtHistoryEvent(historyEvents, index, 'answer', historyEventIndex);
        answerText = aRev != null ? getAnswerText(step, aRev) : null;
      } else {
        problemText = refStep && !highlightRef.focusAnswer && pinRev != null
          ? getProblemText(step, pinRev)
          : getProblemText(step);
        answerText = refStep && highlightRef.focusAnswer && pinRev != null
          ? getAnswerText(step, pinRev)
          : getAnswerText(step);
      }
      const answerEmpty = !answerText?.trim();
      const showAsAnswered = historyEventIndex != null
        ? !answerEmpty
        : (stepFullyResolved(step) || (!answerEmpty && pinRev != null && highlightRef?.focusAnswer));
      const highlightStep = !inRefPanel && stepMatchesHighlight(highlightRef, index);
      const highlightAnswer = highlightStep && highlightRef?.focusAnswer;
      const dateHtml = step.decidedAt
        ? `<time class="decision-date" datetime="${escapeAttr(step.decidedAt)}">${escapeHtml(formatDecisionDate(step.decidedAt))}</time>`
        : '';
      const refTargetBar = refStep
        ? (viewingSnapshot ? ' panel-ref-target panel-ref-target--snapshot' : ' panel-ref-target panel-ref-target--current')
        : '';
      const refBarOnAnswer = refStep && highlightRef.focusAnswer;
      const refBarOnProblem = refStep && !highlightRef.focusAnswer;
      const fieldEditAttrs = (field) => inRefPanel
        ? ''
        : ` data-editable="${field}" data-id="${item.id}" data-step="${index}"`;
      const answerMetaHtml = inRefPanel
        ? (dateHtml ? `<div class="answer-meta">${dateHtml}</div>` : '')
        : `<div class="answer-meta">
                <button type="button" class="answer-mark-btn" data-action="toggle-answer-tentative" data-id="${item.id}" data-step="${index}" aria-pressed="${step.answerTentative ? 'true' : 'false'}" aria-label="${step.answerTentative ? 'Clear tentative mark' : 'Mark answer as tentative'}" title="Still needs specify, refine, or further thought"><span class="answer-mark-icon" aria-hidden="true">⚑</span></button>
                ${dateHtml}
              </div>`;
      const answerHtml = answerEmpty
        ? `<div class="answer-block${inRefPanel ? '' : ' editable'} empty${highlightAnswer ? ' highlight' : ''}${refBarOnAnswer ? refTargetBar : ''}" id="${idPrefix}answer-${item.id}-${index}"${fieldEditAttrs('answer')}>${inRefPanel ? '' : 'Decision'}</div>`
        : `<div class="answer-block${step.answerTentative ? ' answer-marked' : ''}${highlightAnswer ? ' highlight' : ''}${refBarOnAnswer ? refTargetBar : ''}" id="${idPrefix}answer-${item.id}-${index}">
            <div class="answer-inner">
              <span class="answer-text${inRefPanel ? '' : ' editable'}"${fieldEditAttrs('answer')}>${formatRichText(answerText)}</span>
              ${answerMetaHtml}
            </div>
          </div>`;
      const problemHtml = `<div class="problem${inRefPanel ? '' : ' editable'}${refBarOnProblem ? refTargetBar : ''}"${fieldEditAttrs('problem')}>${formatRichText(problemText)}</div>`;
      const stepHighlight = highlightStep && !highlightRef?.focusAnswer ? ' highlight' : '';
      return `
        <div class="timeline-step${showAsAnswered ? ' answered' : ''}${stepHighlight}" id="${idPrefix}step-${item.id}-${index}">
          ${problemHtml}
          ${answerHtml}
        </div>
      `;
    }

    function renderCard(item, { highlightRef = null, idPrefix = '' } = {}) {
      const inRefPanel = idPrefix === PANEL_CARD_ID_PREFIX;
      const historyEventIndex = inRefPanel ? highlightRef?.cardHistoryEventIndex : null;
      const historyEvents = historyEventIndex != null ? collectCardHistoryEvents(item) : null;
      const timeline = item.steps
        .map((step, i) => {
          if (historyEvents && !stepVisibleAtHistoryEvent(historyEvents, i, historyEventIndex)) return '';
          return renderTimelineStep(item, step, i, { highlightRef, idPrefix, historyEvents, historyEventIndex });
        })
        .join('');
      const draft = followupDrafts[item.id] || '';
      const cardHighlight = idPrefix && highlightRef && highlightRef.stepIndex == null ? ' highlight' : '';

      return `
        <article class="card ${cardStatusClass(item)}${cardHighlight}${inRefPanel ? ' card-readonly' : ''}" data-id="${item.id}" id="${idPrefix}card-${item.id}">
          <div class="card-top">
            <div class="card-main">
              ${renderTagsHtml(item, { readOnly: inRefPanel })}
              <div class="timeline">${timeline}</div>
              ${inRefPanel ? '' : `<textarea
                class="followup-input"
                data-followup-input
                data-id="${item.id}"
                placeholder="Follow-up question"
                rows="1"
              >${escapeHtml(draft)}</textarea>`}
            </div>
            <button type="button" class="btn-delete" data-action="delete" data-id="${item.id}" aria-label="Delete">×</button>
          </div>
        </article>
      `;
    }

    function renderBoardView() {
      const cols = [
        { needs: true, title: 'Needs decision', class: 'needs' },
        { needs: false, title: 'Answered', class: 'answered' },
      ];

      return cols
        .map((col) => {
          const columnItems = itemsInColumn(col.needs);
          const cards = renderGroupedCards(columnItems);
          const showRootComposer = openComposer?.type === 'root' && col.needs;
          const addBtn = col.needs
            ? (showRootComposer
              ? renderComposerHtml()
              : `<button type="button" class="add-trigger" data-action="add-root">New decision</button>`)
            : '';
          return `
            <section class="column" data-column="${col.needs ? 'needs_decision' : 'answered'}">
              <div class="column-header ${col.class}">
                <span class="title-row"><span class="dot"></span>${col.title}</span>
              </div>
              <div class="column-body">
                ${cards || ''}
                ${addBtn}
              </div>
            </section>
          `;
        })
        .join('');
    }

    function renderListView() {
      const ordered = allItemsOrdered();
      const showRootComposer = openComposer?.type === 'root';
      const cards = renderGroupedCards(ordered);
      const addBlock = showRootComposer
        ? renderComposerHtml()
        : `<button type="button" class="add-trigger" data-action="add-root">New decision</button>`;

      return `
        <section class="list-view">
          <div class="list-header">
            <span>All items</span>
          </div>
          <div class="list-body">
            ${cards || '<p style="color:var(--muted);font-size:0.85rem;margin:0">No items yet</p>'}
            ${addBlock}
          </div>
        </section>
      `;
    }

    function render() {
      removeIssuePreview();
      const drawerRef = issueDrawerRefId;
      const app = document.getElementById('app');
      app.className = viewMode === 'board' ? 'board' : '';
      app.innerHTML = viewMode === 'board' ? renderBoardView() : renderListView();

      document.body.classList.toggle('show-dates', showAllDates);
      document.querySelectorAll('.view-tab[data-view]').forEach((tab) => {
        tab.classList.toggle('active', tab.dataset.view === viewMode);
      });
      const datesBtn = document.querySelector('[data-action="toggle-dates"]');
      if (datesBtn) {
        datesBtn.classList.toggle('active', showAllDates);
        datesBtn.setAttribute('aria-pressed', String(showAllDates));
      }
      document.getElementById('state-json').textContent = JSON.stringify(items, null, 2);

      if (pendingFocus) {
        const { id, field, step = 0, panel = false } = pendingFocus;
        pendingFocus = null;
        const scope = panel
          ? document.querySelector('.issue-ref-panel-body')
          : document.getElementById('app');
        const queryRoot = scope || document;
        const el = field === 'tags'
          ? queryRoot.querySelector(`[data-editable="tags"][data-id="${id}"]`)
          : queryRoot.querySelector(`[data-editable="${field}"][data-id="${id}"][data-step="${step}"]`);
        if (el) startInlineEdit(el, field, id, step);
      } else {
        const composerInput = document.querySelector('[data-composer-input]');
        if (composerInput) {
          composerInput.focus();
          bindRichTextAutocomplete(composerInput);
        }
      }

      if (drawerRef) populateIssueRefDrawer(drawerRef);

      syncAutoGrowTextareas(document.getElementById('app'));
      scheduleSaveState();
    }

    function setView(mode) {
      viewMode = mode;
      render();
    }

    function isEnterSubmit(e) {
      return e.key === 'Enter' && !e.shiftKey && !e.isComposing;
    }

    const AUTO_GROW_TEXTAREA_SEL = 'textarea.inline-input, textarea.followup-input, textarea[data-composer-input]';

    function autoGrowTextarea(ta) {
      if (!ta || ta.nodeName !== 'TEXTAREA') return;
      ta.style.height = 'auto';
      ta.style.height = `${ta.scrollHeight}px`;
    }

    function syncAutoGrowTextareas(root = document) {
      root.querySelectorAll(AUTO_GROW_TEXTAREA_SEL).forEach(autoGrowTextarea);
    }

    function startInlineEdit(el, field, id, stepIndex) {
      const item = items[id];
      if (!item) return;

      if (field === 'tags') {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'inline-input single';
        input.value = item.tags.join(', ');
        el.replaceWith(input);
        input.focus();
        input.select();
        const commit = () => {
          item.tags = parseTags(input.value);
          render();
        };
        input.addEventListener('blur', commit);
        input.addEventListener('keydown', (e) => {
          if (isEnterSubmit(e)) { e.preventDefault(); input.blur(); }
          if (e.key === 'Escape') { pendingFocus = null; render(); }
        });
        return;
      }

      const step = item.steps[stepIndex];
      if (!step) return;

      const isProblem = field === 'problem';
      const current = isProblem ? step.problem : (step.answer || '');
      const ta = document.createElement('textarea');
      ta.className = isProblem ? 'inline-input inline-input-problem' : 'inline-input inline-input-answer';
      ta.dataset.refItemId = id;
      ta.dataset.refField = field;
      ta.dataset.refStep = String(stepIndex);
      ta.value = current;
      ta.rows = 1;
      el.replaceWith(ta);
      autoGrowTextarea(ta);
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);

      const commit = () => {
        consumeTrailingHashTag(ta);
        const val = ta.value.trim();
        if (isProblem) {
          if (!val) { render(); return; }
          recordProblemEdit(step, val);
        } else if (val) {
          recordAnswerEdit(step, val);
        } else {
          step.answer = null;
          step.decidedAt = null;
          step.answerTentative = false;
        }
        render();
      };

      bindRichTextAutocomplete(ta);

      ta.addEventListener('blur', () => {
        setTimeout(hideSelectionRefToolbar, 120);
        if (isRefLinkPickerOpen() || selectionRefPick) {
          pendingInlineEditCommit = commit;
          return;
        }
        removeMentionMenu();
        commit();
      });
      ta.addEventListener('keydown', (e) => {
        if (isEnterSubmit(e)) {
          e.preventDefault();
          ta.blur();
        }
        if (e.key === 'Escape') {
          removeMentionMenu();
          pendingFocus = null;
          render();
        }
      });
    }

    function closeComposer() {
      openComposer = null;
      render();
    }

    function saveComposer(composerEl) {
      const input = composerEl.querySelector('[data-composer-input]');
      consumeTrailingHashTag(input);
      const text = input.value;
      const tags = parseTags(composerEl.querySelector('[data-composer-tags]').value);
      const id = createItem({ problem: text, tags });
      if (id) pendingFocus = { id, field: 'answer', step: 0 };
      openComposer = null;
      render();
    }

    document.querySelector('.header-right').addEventListener('click', (e) => {
      if (e.target.closest('[data-action="toggle-dates"]')) {
        showAllDates = !showAllDates;
        render();
        return;
      }
      const tab = e.target.closest('[data-view]');
      if (tab) setView(tab.dataset.view);
    });

    document.getElementById('app-body').addEventListener('click', (e) => {
      const editable = e.target.closest('[data-editable]');
      if (editable && !editable.closest('.issue-ref-panel-body') && !e.target.closest('textarea, input, [data-action]')) {
        const field = editable.dataset.editable;
        const id = editable.dataset.id;
        const step = field === 'tags' ? 0 : Number(editable.dataset.step);
        startInlineEdit(editable, field, id, step);
        return;
      }

      const actionEl = e.target.closest('[data-action]');
      if (!actionEl) return;

      const action = actionEl.dataset.action;
      const id = actionEl.dataset.id;

      if (action === 'pick-ref-target') {
        e.preventDefault();
        e.stopPropagation();
        applySelectionRefPick(actionEl.dataset.refToken);
        return;
      }

      if (action === 'close-ref-link-picker') {
        e.preventDefault();
        e.stopPropagation();
        cancelRefLinkPicker();
        return;
      }

      if (action === 'ref-picker-toggle-tag') {
        e.preventDefault();
        e.stopPropagation();
        const tag = actionEl.dataset.tag;
        if (tag) toggleRefLinkPickerTag(tag);
        return;
      }

      if (action === 'ref-picker-kind') {
        e.preventDefault();
        e.stopPropagation();
        const kind = actionEl.dataset.kind;
        if (kind === 'all' || kind === 'answer' || kind === 'question' || kind === 'card') {
          refLinkPickerKindFilter = kind;
          populateRefLinkPickerResults();
        }
        return;
      }

      if (action === 'ref-picker-clear-filters') {
        e.preventDefault();
        e.stopPropagation();
        refLinkPickerActiveTags = [];
        refLinkPickerKindFilter = 'all';
        refLinkPickerQuery = '';
        const search = refLinkPickerEl?.querySelector('#ref-link-picker-search');
        if (search) search.value = '';
        populateRefLinkPickerResults();
        search?.focus();
        return;
      }

      if (action === 'ref-picker-filter-id') {
        e.preventDefault();
        e.stopPropagation();
        const query = actionEl.dataset.refQuery;
        if (!query) return;
        refLinkPickerQuery = query;
        const search = refLinkPickerEl?.querySelector('#ref-link-picker-search');
        if (search) search.value = query;
        populateRefLinkPickerResults();
        search?.focus();
        return;
      }

      if (action === 'close-issue-drawer') {
        e.preventDefault();
        closeIssueRefDrawer();
        return;
      }

      if (action === 'add-root') {
        openComposer = { type: 'root' };
        render();
        return;
      }

      if (action === 'goto-issue') {
        if (e.shiftKey && actionEl.classList.contains('issue-ref-stale')) {
          e.preventDefault();
          e.stopPropagation();
          upgradeIssueRefLink(actionEl);
          return;
        }
        e.preventDefault();
        e.stopPropagation();
        goToIssue(actionEl.dataset.issueRef, actionEl);
        return;
      }

      if (action === 'upgrade-issue-ref') {
        e.preventDefault();
        e.stopPropagation();
        const refEl = actionEl.dataset.issueRef
          ? actionEl
          : issuePreviewAnchor || actionEl.closest('[data-action="goto-issue"]');
        upgradeIssueRefLink(refEl);
        return;
      }

      if (action === 'toggle-panel-diff') {
        e.preventDefault();
        e.stopPropagation();
        issuePanelDiffOpen = !issuePanelDiffOpen;
        if (issueDrawerRefId) populateIssueRefDrawer(issueDrawerRefId);
        return;
      }

      if (action === 'toggle-panel-older-revisions') {
        e.preventDefault();
        e.stopPropagation();
        const parsed = issueDrawerRefId ? parseIssueRef(issueDrawerRefId) : null;
        issuePanelShowOlderRevisions = !issuePanelShowOlderRevisions;
        if (parsed && !issuePanelShowOlderRevisions) {
          const floor = panelRevisionFloor(parsed);
          const view = ensurePanelViewRev(parsed);
          if (floor != null && view != null && view < floor) issuePanelViewRev = floor;
        }
        if (issueDrawerRefId) populateIssueRefDrawer(issueDrawerRefId);
        return;
      }

      if (action === 'panel-rev-prev' || action === 'panel-rev-next') {
        e.preventDefault();
        e.stopPropagation();
        const parsed = issueDrawerRefId ? parseIssueRef(issueDrawerRefId) : null;
        if (parsed) stepPanelViewRev(parsed, action === 'panel-rev-prev' ? -1 : 1);
        return;
      }

      if (action === 'open-card-history') {
        e.preventDefault();
        e.stopPropagation();
        const itemId = actionEl.dataset.id;
        if (!itemId || !items[itemId]) return;
        openIssueRefDrawer(itemId);
        return;
      }

      if (action === 'panel-rev-select') {
        e.preventDefault();
        e.stopPropagation();
        const rev = Number(actionEl.dataset.rev);
        if (!Number.isFinite(rev) || !issueDrawerRefId) return;
        const parsed = parseIssueRef(issueDrawerRefId);
        if (parsed?.stepIndex == null && actionEl.dataset.cardHistory === '1') {
          const eventIndex = Number(actionEl.dataset.eventIndex);
          const stepIndex = Number(actionEl.dataset.step);
          const field = actionEl.dataset.field === 'answer' ? 'answer' : 'problem';
          if (!Number.isFinite(eventIndex) || !Number.isFinite(stepIndex)) return;
          issuePanelCardHistoryView = {
            eventIndex,
            snapshotAt: actionEl.dataset.historyAt || '',
            stepIndex,
            field,
            rev,
          };
        }
        issuePanelViewRev = rev;
        populateIssueRefDrawer(issueDrawerRefId);
        return;
      }

      if (action === 'panel-rev-jump-current') {
        e.preventDefault();
        e.stopPropagation();
        const parsed = issueDrawerRefId ? parseIssueRef(issueDrawerRefId) : null;
        const step = parsed ? panelRefStep(parsed) : null;
        if (!parsed || !step) return;
        issuePanelViewRev = stepFieldHeadRev(step, panelRefField(parsed));
        populateIssueRefDrawer(issueDrawerRefId);
        return;
      }

      if (action === 'toggle-answer-tentative' && id && items[id]) {
        const stepIndex = Number(actionEl.dataset.step);
        const step = items[id].steps[stepIndex];
        if (step) {
          toggleAnswerTentative(step);
          render();
        }
        return;
      }

      if (action === 'delete' && id && items[id]) {
        const openParsed = issueDrawerRefId ? parseIssueRef(issueDrawerRefId) : null;
        if (openParsed?.itemId === id) closeIssueRefDrawer();
        deleteItem(id);
        render();
      }
    });

    document.getElementById('app-body').addEventListener('click', (e) => {
      if (e.target.closest('[data-composer-save]')) {
        const composer = e.target.closest('[data-composer]');
        if (composer) saveComposer(composer);
        return;
      }
      if (e.target.closest('[data-composer-cancel]')) {
        closeComposer();
      }
    });


    document.getElementById('app-body').addEventListener('mouseup', (e) => {
      if (selectionRefToolbarEl?.contains(e.target) || mentionMenuEl?.contains(e.target)) return;
      const ta = e.target.closest('textarea');
      if (!isRefEditableTextarea(ta)) {
        hideSelectionRefToolbar();
        return;
      }
      const x = e.clientX;
      const y = e.clientY;
      setTimeout(() => updateSelectionRefToolbar(ta, x, y), 0);
    });

    document.getElementById('app-body').addEventListener('keyup', (e) => {
      const ta = e.target.closest('textarea');
      if (!isRefEditableTextarea(ta)) return;
      if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End', 'Shift'].includes(e.key)) return;
      const rect = ta.getBoundingClientRect();
      updateSelectionRefToolbar(ta, rect.left + rect.width / 2, rect.top + 12);
    });

    document.getElementById('app-body').addEventListener('input', (e) => {
      const ta = e.target.closest('textarea');
      if (ta?.matches(AUTO_GROW_TEXTAREA_SEL)) autoGrowTextarea(ta);
      if (ta && selectionRefToolbarTa === ta && !getTextareaSelectionLabel(ta)) hideSelectionRefToolbar();
      const followup = e.target.closest('[data-followup-input]');
      if (followup) followupDrafts[followup.dataset.id] = followup.value;
    });

    document.getElementById('app-body').addEventListener('keydown', (e) => {
      const followup = e.target.closest('[data-followup-input]');
      if (followup && isEnterSubmit(e)) {
        e.preventDefault();
        commitFollowup(followup.dataset.id, followup.value, {
          inPanel: !!followup.closest('.issue-ref-panel-body'),
          ta: followup,
        });
        return;
      }

      const composer = e.target.closest('[data-composer]');
      if (!composer) return;
      if (isEnterSubmit(e) && e.target.closest('[data-composer-input], [data-composer-tags]')) {
        e.preventDefault();
        saveComposer(composer);
        return;
      }
      if (e.key === 'Escape') {
        closeComposer();
      }
    });

    bindIssueRefPreviewEvents();

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isRefLinkPickerOpen()) {
        e.preventDefault();
        cancelRefLinkPicker();
        return;
      }
      if (e.key !== 'Escape' || !issueDrawerRefId) return;
      if (e.target.closest('textarea, input:not([type="button"])')) return;
      if (isRefLinkPickerOpen()) return;
      closeIssueRefDrawer();
    });

    window.addEventListener('beforeunload', () => {
      if (saveStateTimer) {
        clearTimeout(saveStateTimer);
        saveStateTimer = null;
      }
      saveState();
    });

    initState();
    render();
  </script>
</body>
</html>
